name: Apply auth hotfix

on:
  push:
    branches:
      - fix/auth-existing-account-verification
    paths:
      - .github/workflows/apply-auth-hotfix.yml
      - scripts/apply-auth-hotfix.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/auth-existing-account-verification
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply targeted auth fixes
        run: node scripts/apply-auth-hotfix.mjs
      - name: Verify repository
        run: npm run verify
      - name: Commit verified hotfix and remove transformer
        run: |
          rm scripts/apply-auth-hotfix.mjs .github/workflows/apply-auth-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/login.js web/chat.js web/bot.js vercel.json scripts/login.test.mjs scripts/apply-auth-hotfix.mjs .github/workflows/apply-auth-hotfix.yml
          git commit -m "Fix OAuth transport and unverified-session routing"
          git push origin HEAD:fix/auth-existing-account-verification
