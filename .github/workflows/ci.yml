name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Capture exact PRODUCT M4 formatting
        run: npm run format -- --files-ignore-unknown=true web/run-center.js scripts/run-center-ui.test.mjs

      - name: Upload PRODUCT M4 formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: product-m4-formatted
          path: |
            web/run-center.js
            scripts/run-center-ui.test.mjs
          if-no-files-found: error
          retention-days: 1

      - name: Verify repository
        run: npm run verify
