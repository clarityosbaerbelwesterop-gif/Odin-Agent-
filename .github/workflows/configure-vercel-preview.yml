name: Configure Odin Vercel preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: odin-vercel-preview-configuration
  cancel-in-progress: false

jobs:
  preview:
    if: github.repository == 'clarityosbaerbelwesterop-gif/Odin-Agent-' && github.ref == 'refs/heads/agent/stu-plans-github-mcp-modes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Configure only the approved preview branch
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_ODIN_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NV_API_KEY: ${{ secrets.NV_API_KEY }}
          NV_API_KEY_2: ${{ secrets.NV_API_KEY_2 }}
          FREE_API_KEY: ${{ secrets.FREE_API_KEY }}
        run: node scripts/configure-vercel-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odin-vercel-preview-configuration
          path: vercel-preview-result.json
          if-no-files-found: warn
          retention-days: 14
