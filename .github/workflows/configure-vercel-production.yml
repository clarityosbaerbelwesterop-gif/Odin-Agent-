name: Sync Odin Vercel production

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/configure-vercel-production.yml
      - scripts/configure-neon-github-auth.mjs
      - scripts/sync-vercel-production.mjs
      - migrations/006_odin_bot_m1_m3.sql
      - migrations/007_odin_bot_m4_m6.sql
      - migrations/008_odin_bot_m7_m9.sql
      - migrations/009_quota_and_provider_pool.sql
      - src/bot/**
      - src/providers/nvidia-pool.ts
      - src/providers/openrouter.ts
      - src/providers/unorouter.ts
      - src/chat/quota.ts
      - src/chat/server-models.ts
      - src/chat/github-*.ts
      - src/chat/hosted.ts
      - web/bot.*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: odin-vercel-production-sync
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    if: github.repository == 'clarityosbaerbelwesterop-gif/Odin-Agent-' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify exact merged source before production changes
        run: npm run verify
      - name: Configure GitHub identity provider, synchronize production secrets, and deploy exact main SHA
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_ODIN_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          GITHUB_REPO_OAUTH_CLIENT_ID: ${{ secrets.GITHUB_REPO_OAUTH_CLIENT_ID }}
          GITHUB_REPO_OAUTH_CLIENT_SECRET: ${{ secrets.GITHUB_REPO_OAUTH_CLIENT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNOROUTER_API_KEY: ${{ secrets.UNOROUTER_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          FREE_API_KEY: ${{ secrets.FREE_API_KEY }}
          NVIDIA_PRODUCTION_API_KEY: ${{ secrets.NV_API_KEY }}
          NVIDIA_PRODUCTION_API_KEY_2: ${{ secrets.NV_API_KEY_2 }}
          NVIDIA_PRODUCTION_API_KEY_3: ${{ secrets.NV_API_KEY_3 }}
          NVIDIA_PRODUCTION_API_KEY_4: ${{ secrets.NV_API_KEY_4 }}
          NVIDIA_PRODUCTION_API_KEY_5: ${{ secrets.NV_API_KEY_5 }}
          ODIN_NVIDIA_PRODUCTION_AUTHORIZED: "true"
        run: |
          node scripts/configure-neon-github-auth.mjs
          node scripts/sync-vercel-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odin-production-sync
          path: |
            neon-github-auth-result.json
            vercel-production-sync-result.json
          if-no-files-found: warn
          retention-days: 14
