name: D-F adversarial hardening

on:
  push:
    branches:
      - agent/intelligence-d-e-f
    paths:
      - .github/workflows/d-f-adversarial-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/intelligence-d-e-f
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply semantic boundary hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/routing/frontier-amplification.ts")
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, got {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              'import { AMPLIFICATION_POLICY_VERSION, type ReasoningAmplificationPlan } from "./amplification.js";',
              'import {\n  type AmplificationStrategy,\n  AMPLIFICATION_POLICY_VERSION,\n  type ReasoningAmplificationPlan,\n} from "./amplification.js";',
          )
          replace_once(
              'import { assertSha256, exactKeys, objectValue, safeInteger, sha256Json } from "./internal.js";',
              'import { assertSha256, exactKeys, identifier, objectValue, safeInteger, sha256Json } from "./internal.js";',
          )
          replace_once(
              'import { WEAK_MODEL_SCAFFOLDING_VERSION, type WeakModelScaffoldingPlan } from "./scaffolding.js";',
              'import {\n  type OutputDiscipline,\n  type ScaffoldingMode,\n  type ToolGroundingMode,\n  WEAK_MODEL_SCAFFOLDING_VERSION,\n  type WeakModelScaffoldingPlan,\n} from "./scaffolding.js";',
          )

          marker = '''const FAILURE_CATEGORIES: readonly FrontierFailureCategory[] = [
            "quality",
            "verification",
            "budget",
            "contract",
            "unknown",
          ];
          '''
          additions = marker + '''
          const AMPLIFICATION_STRATEGIES = new Set<AmplificationStrategy>([
            "backward_reason",
            "constraint_solve",
            "counterexample_search",
            "decompose",
            "direct",
            "independent_critique",
            "numeric_consistency",
            "retrieve_context",
            "strict_output",
            "targeted_repair",
            "tool_ground",
          ]);
          const SCAFFOLDING_MODES = new Set<ScaffoldingMode>(["AMPLIFIED", "STANDARD"]);
          const OUTPUT_DISCIPLINES = new Set<OutputDiscipline>([
            "strict_structured",
            "structured_validated",
            "text_contract",
          ]);
          const TOOL_GROUNDING_MODES = new Set<ToolGroundingMode>([
            "required_if_available",
            "unsupported",
            "not_required",
          ]);
          const DEFICIENCIES = new Set([
            "context_window_below_floor",
            "output_limit_below_floor",
            "pass_rate_below_floor",
            "quality_below_floor",
            "sample_support_below_floor",
          ]);
          const DIRECTIVES = new Set([
            "bounded_context_chunks",
            "decompose_before_execution",
            "ground_claims_before_mutation",
            "independent_verification_required",
            "output_contract_guard",
            "reject_no_change_repair",
            "reserve_repair_headroom",
            "surgical_repair_only",
            "tool_grounding",
            "tool_grounding_unavailable",
          ]);
          '''
          replace_once(marker, additions)

          replace_once(
              '''  if (
            scaffolding.maxModelCalls > amplification.maxModelCalls ||
            scaffolding.maxEstimatedTokens > amplification.maxEstimatedTokens
          ) {
            throw new RoutingError(
              "BUDGET_EXCEEDED",
              "Phase E scaffolding cannot increase Phase D runtime-owned ceilings.",
            );
          }
          return Object.freeze({ amplification, domain, scaffolding });''',
              '''  if (
            scaffolding.maxModelCalls !== amplification.maxModelCalls ||
            scaffolding.maxEstimatedTokens !== amplification.maxEstimatedTokens
          ) {
            throw new RoutingError(
              "BUDGET_EXCEEDED",
              "Phase E scaffolding must preserve the exact Phase D runtime-owned ceilings.",
            );
          }
          if (amplification.contextTokenCeiling > benchmark.profile.contextWindowTokens) {
            throw new RoutingError(
              "BUDGET_EXCEEDED",
              "Phase D context ceiling exceeds the bound evaluation profile.",
            );
          }
          const expectedOutputDiscipline: OutputDiscipline = benchmark.profile.strictStructuredOutput
            ? "strict_structured"
            : benchmark.profile.structuredOutput
              ? "structured_validated"
              : "text_contract";
          if (scaffolding.outputDiscipline !== expectedOutputDiscipline) {
            throw new RoutingError(
              "INVALID_INPUT",
              "Phase E output discipline does not match the bound capability profile.",
            );
          }
          const expectedToolGrounding: ToolGroundingMode =
            domain === "tool_use" || domain === "research"
              ? benchmark.profile.toolUse
                ? "required_if_available"
                : "unsupported"
              : "not_required";
          if (scaffolding.toolGrounding !== expectedToolGrounding) {
            throw new RoutingError(
              "INVALID_INPUT",
              "Phase E tool grounding does not match the bound capability profile.",
            );
          }
          const targetedRepair = amplification.strategies.includes("targeted_repair");
          if (
            scaffolding.surgicalRepairOnly !== targetedRepair ||
            scaffolding.rejectNoChangeRepair !== targetedRepair
          ) {
            throw new RoutingError(
              "INVALID_INPUT",
              "Phase E repair policy does not match the exact Phase D strategy set.",
            );
          }
          if (
            scaffolding.requiresIndependentVerification !==
            (scaffolding.mode === "AMPLIFIED" || amplification.requiresIndependentVerification)
          ) {
            throw new RoutingError(
              "INVALID_INPUT",
              "Phase E verification policy does not match its D/E inputs.",
            );
          }
          return Object.freeze({ amplification, domain, scaffolding });''',
          )

          replace_once(
              '''  if (!Array.isArray(plan.strategies) || !Array.isArray(plan.reasonCodes)) {
            throw new RoutingError("INVALID_INPUT", "Phase D amplification collections are malformed.");
          }
          const body = {''',
              '''  if (!Array.isArray(plan.strategies) || !Array.isArray(plan.reasonCodes)) {
            throw new RoutingError("INVALID_INPUT", "Phase D amplification collections are malformed.");
          }
          const strategies = plan.strategies.map((strategy, index) => {
            if (
              typeof strategy !== "string" ||
              !AMPLIFICATION_STRATEGIES.has(strategy as AmplificationStrategy)
            ) {
              throw new RoutingError(
                "INVALID_INPUT",
                `Phase D strategy at index ${index} is unsupported.`,
              );
            }
            return strategy as AmplificationStrategy;
          });
          if (new Set(strategies).size !== strategies.length) {
            throw new RoutingError("INVALID_INPUT", "Phase D strategies contain duplicates.");
          }
          const reasonCodes = plan.reasonCodes.map((reason, index) =>
            identifier(reason, `Phase D reasonCodes[${index}]`),
          );
          if (new Set(reasonCodes).size !== reasonCodes.length) {
            throw new RoutingError("INVALID_INPUT", "Phase D reason codes contain duplicates.");
          }
          if (
            typeof plan.domain !== "string" ||
            !BENCHMARK_V2_DOMAINS.includes(plan.domain as BenchmarkV2Domain)
          ) {
            throw new RoutingError("INVALID_INPUT", "Phase D domain is unsupported.");
          }
          const domain = plan.domain as BenchmarkV2Domain;
          const body = {''',
          )
          replace_once(
              '    critiquePasses: safeInteger(plan.critiquePasses, "Phase D critiquePasses", 0, 100),\n    domain: plan.domain,',
              '    critiquePasses: safeInteger(plan.critiquePasses, "Phase D critiquePasses", 0, 100),\n    domain,',
          )
          replace_once(
              '    reasonCodes: Object.freeze([...plan.reasonCodes]),',
              '    reasonCodes: Object.freeze(reasonCodes),',
          )
          replace_once(
              '    strategies: Object.freeze([...plan.strategies]),',
              '    strategies: Object.freeze(strategies),',
          )

          replace_once(
              '''  if (!Array.isArray(plan.deficiencies) || !Array.isArray(plan.directives)) {
            throw new RoutingError("INVALID_INPUT", "Phase E scaffolding collections are malformed.");
          }
          const body = {''',
              '''  if (!Array.isArray(plan.deficiencies) || !Array.isArray(plan.directives)) {
            throw new RoutingError("INVALID_INPUT", "Phase E scaffolding collections are malformed.");
          }
          if (
            typeof plan.domain !== "string" ||
            !BENCHMARK_V2_DOMAINS.includes(plan.domain as BenchmarkV2Domain)
          ) {
            throw new RoutingError("INVALID_INPUT", "Phase E domain is unsupported.");
          }
          const domain = plan.domain as BenchmarkV2Domain;
          if (typeof plan.mode !== "string" || !SCAFFOLDING_MODES.has(plan.mode as ScaffoldingMode)) {
            throw new RoutingError("INVALID_INPUT", "Phase E scaffolding mode is unsupported.");
          }
          const mode = plan.mode as ScaffoldingMode;
          if (
            typeof plan.outputDiscipline !== "string" ||
            !OUTPUT_DISCIPLINES.has(plan.outputDiscipline as OutputDiscipline)
          ) {
            throw new RoutingError("INVALID_INPUT", "Phase E output discipline is unsupported.");
          }
          const outputDiscipline = plan.outputDiscipline as OutputDiscipline;
          if (
            typeof plan.toolGrounding !== "string" ||
            !TOOL_GROUNDING_MODES.has(plan.toolGrounding as ToolGroundingMode)
          ) {
            throw new RoutingError("INVALID_INPUT", "Phase E tool grounding mode is unsupported.");
          }
          const toolGrounding = plan.toolGrounding as ToolGroundingMode;
          const deficiencies = plan.deficiencies.map((value, index) => {
            const normalized = identifier(value, `Phase E deficiencies[${index}]`);
            if (!DEFICIENCIES.has(normalized)) {
              throw new RoutingError("INVALID_INPUT", "Phase E deficiency is unsupported.");
            }
            return normalized;
          });
          const directives = plan.directives.map((value, index) => {
            const normalized = identifier(value, `Phase E directives[${index}]`);
            if (!DIRECTIVES.has(normalized)) {
              throw new RoutingError("INVALID_INPUT", "Phase E directive is unsupported.");
            }
            return normalized;
          });
          if (
            new Set(deficiencies).size !== deficiencies.length ||
            new Set(directives).size !== directives.length
          ) {
            throw new RoutingError("INVALID_INPUT", "Phase E collections contain duplicates.");
          }
          if (
            (mode === "STANDARD" && deficiencies.length !== 0) ||
            (mode === "AMPLIFIED" && deficiencies.length === 0)
          ) {
            throw new RoutingError("INVALID_INPUT", "Phase E mode contradicts its deficiency evidence.");
          }
          const contextChunkBps = safeInteger(plan.contextChunkBps, "Phase E contextChunkBps", 1, 10_000);
          if (contextChunkBps !== 5_000 && contextChunkBps !== 10_000) {
            throw new RoutingError("INVALID_INPUT", "Phase E context chunk policy is unsupported.");
          }
          const decompositionDepth = safeInteger(plan.decompositionDepth, "Phase E decompositionDepth", 1, 3);
          const body = {''',
          )
          replace_once(
              '    contextChunkBps: safeInteger(plan.contextChunkBps, "Phase E contextChunkBps", 1, 10_000),',
              '    contextChunkBps,',
          )
          replace_once(
              '    decompositionDepth: safeInteger(plan.decompositionDepth, "Phase E decompositionDepth", 1, 3),',
              '    decompositionDepth,',
          )
          replace_once('    deficiencies: Object.freeze([...plan.deficiencies]),', '    deficiencies: Object.freeze(deficiencies),')
          replace_once('    directives: Object.freeze([...plan.directives]),', '    directives: Object.freeze(directives),')
          replace_once('    domain: plan.domain,', '    domain,')
          replace_once('    mode: plan.mode,', '    mode,')
          replace_once('    outputDiscipline: plan.outputDiscipline,', '    outputDiscipline,')
          replace_once('    toolGrounding: plan.toolGrounding,', '    toolGrounding,')

          path.write_text(text)

          test_path = Path("test/routing/frontier-amplification.test.ts")
          tests = test_path.read_text()
          if "recomputed Phase F component hashes cannot smuggle unknown D/E semantics" in tests:
              raise SystemExit("hardening tests already present")
          tests += r'''

test("recomputed Phase F component hashes cannot smuggle unknown D/E semantics", () => {
  const original = components()[0];
  assert.ok(original !== undefined);
  const d = original.amplification;
  const forgedDBody = {
    benchmarkHash: d.benchmarkHash,
    branchCount: d.branchCount,
    contextTokenCeiling: d.contextTokenCeiling,
    critiquePasses: d.critiquePasses,
    domain: d.domain,
    maxEstimatedTokens: d.maxEstimatedTokens,
    maxModelCalls: d.maxModelCalls,
    policyVersion: d.policyVersion,
    profileHash: d.profileHash,
    reasonCodes: d.reasonCodes,
    repairAttempts: d.repairAttempts,
    requiresIndependentVerification: d.requiresIndependentVerification,
    strategies: ["direct", "mint_runtime_authority"],
    weaknessReportHash: d.weaknessReportHash,
  } as const;
  const forgedD = {
    ...forgedDBody,
    planHash: hashJson(forgedDBody),
  } as unknown as ReasoningAmplificationPlan;
  const forgedDComponents = components().map((component) =>
    component.domain === original.domain
      ? {
          amplification: forgedD,
          domain: original.domain,
          scaffolding: scaffoldingPlan(original.domain, forgedD),
        }
      : component,
  );
  assert.throws(
    () => createFrontierAmplificationCandidate({ benchmark, components: forgedDComponents }),
    /Phase D strategy.*unsupported/u,
  );

  const e = original.scaffolding;
  const forgedEBody = {
    amplificationPlanHash: e.amplificationPlanHash,
    contextChunkBps: e.contextChunkBps,
    decompositionDepth: e.decompositionDepth,
    deficiencies: e.deficiencies,
    directives: e.directives,
    domain: e.domain,
    evaluationHash: e.evaluationHash,
    maxEstimatedTokens: e.maxEstimatedTokens,
    maxModelCalls: e.maxModelCalls,
    mode: "MAGIC_MODE",
    outputDiscipline: e.outputDiscipline,
    profileHash: e.profileHash,
    rejectNoChangeRepair: e.rejectNoChangeRepair,
    requiresIndependentVerification: e.requiresIndependentVerification,
    surgicalRepairOnly: e.surgicalRepairOnly,
    toolGrounding: e.toolGrounding,
    version: e.version,
  } as const;
  const forgedE = {
    ...forgedEBody,
    planHash: hashJson(forgedEBody),
  } as unknown as WeakModelScaffoldingPlan;
  const forgedEComponents = components().map((component) =>
    component.domain === original.domain
      ? { ...component, scaffolding: forgedE }
      : component,
  );
  assert.throws(
    () => createFrontierAmplificationCandidate({ benchmark, components: forgedEComponents }),
    /scaffolding mode is unsupported/u,
  );
});

test("Phase F revalidates D/E capability and repair semantics against the benchmark profile", () => {
  const original = components()[0];
  assert.ok(original !== undefined);
  const e = original.scaffolding;
  const forgedBody = {
    amplificationPlanHash: e.amplificationPlanHash,
    contextChunkBps: e.contextChunkBps,
    decompositionDepth: e.decompositionDepth,
    deficiencies: e.deficiencies,
    directives: e.directives,
    domain: e.domain,
    evaluationHash: e.evaluationHash,
    maxEstimatedTokens: e.maxEstimatedTokens,
    maxModelCalls: e.maxModelCalls,
    mode: e.mode,
    outputDiscipline: "text_contract",
    profileHash: e.profileHash,
    rejectNoChangeRepair: false,
    requiresIndependentVerification: e.requiresIndependentVerification,
    surgicalRepairOnly: false,
    toolGrounding: e.toolGrounding,
    version: e.version,
  } as const;
  const forged = {
    ...forgedBody,
    planHash: hashJson(forgedBody),
  } as WeakModelScaffoldingPlan;
  const forgedComponents = components().map((component) =>
    component.domain === original.domain ? { ...component, scaffolding: forged } : component,
  );
  assert.throws(
    () => createFrontierAmplificationCandidate({ benchmark, components: forgedComponents }),
    /output discipline does not match/u,
  );
});
'''
          test_path.write_text(tests)
          PY
      - name: Format hardening changes
        run: npx biome check --write src/routing/scaffolding.ts test/routing/scaffolding.test.ts src/routing/frontier-amplification.ts test/routing/frontier-amplification.test.ts test/package/intelligence-d-f-boundaries.test.ts
      - name: Verify repository
        run: npm run verify
      - name: Remove helper and commit verified hardening
        run: |
          rm .github/workflows/d-f-adversarial-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routing/scaffolding.ts test/routing/scaffolding.test.ts src/routing/frontier-amplification.ts test/routing/frontier-amplification.test.ts test/package/intelligence-d-f-boundaries.test.ts .github/workflows/d-f-adversarial-hardening.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(intelligence): harden D-F semantic authority boundaries"
          git push origin HEAD:agent/intelligence-d-e-f
