name: D-F adversarial hardening

on:
  push:
    branches:
      - agent/intelligence-d-e-f
    paths:
      - .github/workflows/d-f-adversarial-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/intelligence-d-e-f
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply semantic boundary hardening
        run: python scripts/d-f-hardening.py
      - name: Format hardening changes
        run: npx biome check --write src/routing/scaffolding.ts test/routing/scaffolding.test.ts src/routing/frontier-amplification.ts test/routing/frontier-amplification.test.ts test/package/intelligence-d-f-boundaries.test.ts
      - name: Verify repository
        run: npm run verify
      - name: Remove temporary hardening helpers and commit verified result
        run: |
          rm .github/workflows/d-f-adversarial-hardening.yml scripts/d-f-hardening.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routing/scaffolding.ts test/routing/scaffolding.test.ts src/routing/frontier-amplification.ts test/routing/frontier-amplification.test.ts test/package/intelligence-d-f-boundaries.test.ts .github/workflows/d-f-adversarial-hardening.yml scripts/d-f-hardening.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(intelligence): harden D-F semantic authority boundaries"
          git push origin HEAD:agent/intelligence-d-e-f
