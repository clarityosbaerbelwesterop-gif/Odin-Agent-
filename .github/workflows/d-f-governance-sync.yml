name: D-F governance synchronization

on:
  push:
    branches:
      - agent/intelligence-d-e-f
    paths:
      - .github/workflows/d-f-governance-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/intelligence-d-e-f
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Synchronize governance
        run: python scripts/d-f-governance-sync.py
      - name: Verify repository
        run: npm run verify
      - name: Build repository
        run: npm run build
      - name: Remove temporary governance helpers and commit verified synchronization
        run: |
          rm .github/workflows/d-f-governance-sync.yml scripts/d-f-governance-sync.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ARCHITECTURE.md SECURITY.md ROADMAP.md HANDOVER.md docs/milestones/INTELLIGENCE_PHASE_D_F.md .github/workflows/d-f-governance-sync.yml scripts/d-f-governance-sync.py
          git diff --cached --quiet && exit 0
          git commit -m "docs(intelligence): synchronize verified D-F package"
          git push origin HEAD:agent/intelligence-d-e-f
