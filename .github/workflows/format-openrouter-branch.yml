name: Format OpenRouter branch

on:
  push:
    branches: [agent/openrouter-bot-routing]

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'clarityosbaerbelwesterop-gif/Odin-Agent-'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/openrouter-bot-routing
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply repository formatter to changed source and tests
        run: npx biome check --write src/bot/executor.ts src/chat/server-models.ts test/bot/model-routing.test.ts test/chat/openrouter-shared.test.ts test/chat/quota.test.ts .github/workflows/configure-vercel-production.yml
      - name: Commit formatter output when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bot/executor.ts src/chat/server-models.ts test/bot/model-routing.test.ts test/chat/openrouter-shared.test.ts test/chat/quota.test.ts .github/workflows/configure-vercel-production.yml
          git commit -m 'style: format OpenRouter routing'
          git push origin HEAD:agent/openrouter-bot-routing
