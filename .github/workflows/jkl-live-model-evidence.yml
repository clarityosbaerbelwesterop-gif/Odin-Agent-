name: J–L bounded live model evidence

on:
  workflow_dispatch:
  push:
    branches: [agent/jkl-legal-benchmarks-subscriptions]
    paths: [.github/workflows/jkl-live-model-evidence.yml]

permissions:
  contents: read

concurrency:
  group: jkl-bounded-live-model-evidence
  cancel-in-progress: false

jobs:
  kimi-ab:
    name: Kimi alone versus Kimi with Odin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run one bounded paced acquisition
        env:
          NV_API_KEY: ${{ secrets.NV_API_KEY }}
        run: node scripts/live-chathub-ab.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jkl-kimi-model-ab
          path: chathub-ab-result.json
          if-no-files-found: error
          retention-days: 14
