name: Live evaluation pacing repair

on:
  push:
    branches:
      - agent/live-eval-rate-limit-recovery
    paths:
      - .github/workflows/live-eval-pacing-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/live-eval-rate-limit-recovery
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Bind global provider pacing into the M16 live evaluator
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/live-m16-grounded-eval.mjs")
          source = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected one occurrence, found {count}: {old[:80]!r}")
              source = source.replace(old, new, 1)

          replace_once(
              '  classifyLiveFailure,\n  createLiveProviderCallCounter,\n  isTerminalLiveMeasurementFailure,',
              '  classifyLiveFailure,\n  createLiveProviderCallCounter,\n  createLiveProviderPacer,\n  isTerminalLiveMeasurementFailure,',
          )
          replace_once(
              'const MAX_CALLS_PER_ARM_CASE = 2;\nconst SUITE =',
              'const MAX_CALLS_PER_ARM_CASE = 2;\nconst MIN_PROVIDER_START_INTERVAL_MS = 65_000;\nconst SUITE =',
          )
          replace_once(
              'function createUsageMeter(rawProvider, callCounter) {',
              'function createUsageMeter(rawProvider, callCounter, pacer) {',
          )
          replace_once(
              '    generate: async (request, options) => {\n      callCounter.consume();',
              '    generate: async (request, options) => {\n      await pacer.beforeAttempt(options?.signal);\n      callCounter.consume();',
          )
          replace_once(
              '    stream: async function* (request, options) {\n      callCounter.consume();',
              '    stream: async function* (request, options) {\n      await pacer.beforeAttempt(options?.signal);\n      callCounter.consume();',
          )
          replace_once(
              '    usageSnapshot: () => ({ ...state, finishReasons: { ...state.finishReasons } }),',
              '    pacingSnapshot: () => pacer.snapshot(),\n    usageSnapshot: () => ({ ...state, finishReasons: { ...state.finishReasons } }),',
          )
          replace_once(
              '\nasync function runArm({ arm, meteredProvider, caseSpec, observedAt }) {',
              '''\nfunction pacingDelta(before, after) {\n  return {\n    attempts: after.attempts - before.attempts,\n    waitedMs: after.waitedMs - before.waitedMs,\n  };\n}\n\nasync function runArm({ arm, meteredProvider, caseSpec, observedAt }) {''',
          )
          replace_once(
              '  const beforeUsage = meteredProvider.usageSnapshot();\n  const started = performance.now();',
              '  const beforeUsage = meteredProvider.usageSnapshot();\n  const beforePacing = meteredProvider.pacingSnapshot();\n  const started = performance.now();',
          )
          old_latency = '    const latencyMs = Math.round(performance.now() - started);\n    const usage = usageDelta(beforeUsage, meteredProvider.usageSnapshot());'
          new_latency = '''    const wallLatencyMs = Math.round(performance.now() - started);\n    const pacing = pacingDelta(beforePacing, meteredProvider.pacingSnapshot());\n    const latencyMs = Math.max(0, wallLatencyMs - pacing.waitedMs);\n    const usage = usageDelta(beforeUsage, meteredProvider.usageSnapshot());'''
          if source.count(old_latency) != 2:
              raise SystemExit(f"expected two latency sites, found {source.count(old_latency)}")
          source = source.replace(old_latency, new_latency)
          replace_once(
              '      completed: result.report.state === "COMPLETED",\n      errorClass: null,',
              '      completed: result.report.state === "COMPLETED",\n      controlPlaneWaitMs: pacing.waitedMs,\n      errorClass: null,',
          )
          replace_once(
              '      repaired: result.report.quality.firstFailureSignature !== null,\n      usage,\n      verification:',
              '      repaired: result.report.quality.firstFailureSignature !== null,\n      usage,\n      wallLatencyMs,\n      verification:',
          )
          replace_once(
              '      completed: false,\n      errorClass: diagnostic.errorClass,',
              '      completed: false,\n      controlPlaneWaitMs: pacing.waitedMs,\n      errorClass: diagnostic.errorClass,',
          )
          replace_once(
              '      repaired: false,\n      usage,\n      verification: "FAIL",',
              '      repaired: false,\n      usage,\n      wallLatencyMs,\n      verification: "FAIL",',
          )
          replace_once(
              '    completed: run.completed,\n    errorClass: run.errorClass,',
              '    completed: run.completed,\n    controlPlaneWaitMs: run.controlPlaneWaitMs,\n    errorClass: run.errorClass,',
          )
          replace_once(
              '    usage: run.usage,\n    verification: run.verification,',
              '    usage: run.usage,\n    wallLatencyMs: run.wallLatencyMs,\n    verification: run.verification,',
          )
          replace_once(
              '      maxCallsPerArmCase: MAX_CALLS_PER_ARM_CASE,\n      maxProviderCalls,',
              '      maxCallsPerArmCase: MAX_CALLS_PER_ARM_CASE,\n      maxProviderCalls,\n      minProviderStartIntervalMs: MIN_PROVIDER_START_INTERVAL_MS,',
          )
          replace_once(
              '  const meteredProvider = createUsageMeter(rawProvider, callCounter);',
              '''  const pacer = createLiveProviderPacer({\n    minStartIntervalMs: MIN_PROVIDER_START_INTERVAL_MS,\n  });\n  const meteredProvider = createUsageMeter(rawProvider, callCounter, pacer);''',
          )
          replace_once(
              '      maxProviderCalls,\n      profileVersion: "m16-grounded-surgical-live-v2",',
              '      maxProviderCalls,\n      minProviderStartIntervalMs: MIN_PROVIDER_START_INTERVAL_MS,\n      profileVersion: "m16-grounded-surgical-live-v3-paced",',
          )
          replace_once(
              '    provider: "nvidia",\n    providerCalls: callCounter.value,',
              '    pacing: pacer.snapshot(),\n    provider: "nvidia",\n    providerCalls: callCounter.value,',
          )

          path.write_text(source)
          PY
      - name: Format changed surfaces
        run: npx biome check --write src/capability-packs/index.ts src/capability-packs/live-pacer.ts test/capability-packs/live-pacer.test.ts scripts/live-m16-grounded-eval.mjs
      - name: Verify repository
        run: npm run verify
      - name: Build repository
        run: npm run build
      - name: Commit verified repair and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/live-eval-pacing-repair.yml
          git add src/capability-packs/index.ts src/capability-packs/live-pacer.ts test/capability-packs/live-pacer.test.ts scripts/live-m16-grounded-eval.mjs
          git commit -m "eval: pace bounded live provider measurements"
          git push origin HEAD:agent/live-eval-rate-limit-recovery
