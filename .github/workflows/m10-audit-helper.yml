name: M10 lifecycle audit helper

on:
  push:
    branches:
      - agent/m10-skill-lifecycle

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Add lifecycle audit history
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/skills/registry.ts';
          let text = fs.readFileSync(path, 'utf8');
          function replace(oldText, newText) {
            if (!text.includes(oldText)) throw new Error(`Missing registry pattern: ${oldText.slice(0, 100)}`);
            text = text.replace(oldText, newText);
          }
          replace(
            '  type SkillLifecycle,\n  type SkillPackage,',
            '  type SkillLifecycle,\n  type SkillLifecycleEvent,\n  type SkillPackage,',
          );
          replace(
            'export class SkillRegistry {\n  readonly #records = new Map<string, SkillRecord>();',
            'export class SkillRegistry {\n  readonly #events: SkillLifecycleEvent[] = [];\n  readonly #records = new Map<string, SkillRecord>();',
          );
          replace(
            '  listReviewSummaries(): readonly SkillSummary[] {\n    return this.#listSummaries(() => true);\n  }\n\n  resolve(name: string, version: string): SkillPackage {',
            `  listReviewSummaries(): readonly SkillSummary[] {\n    return this.#listSummaries(() => true);\n  }\n\n  history(name?: string, version?: string): readonly SkillLifecycleEvent[] {\n    if (version !== undefined && name === undefined) {\n      throw new SkillError("INVALID_INPUT", "Skill history version requires a skill name.");\n    }\n    if (name !== undefined) assertSkillName(name);\n    if (version !== undefined) assertVersion(version);\n    return Object.freeze(\n      this.#events\n        .filter(\n          (event) =>\n            (name === undefined || event.name === name) &&\n            (version === undefined || event.version === version),\n        )\n        .map(cloneLifecycleEvent),\n    );\n  }\n\n  resolve(name: string, version: string): SkillPackage {`,
          );
          replace(
            '    this.#records.set(skillKey(current.package.name, current.package.version), next);\n    return cloneRecord(next);',
            `    this.#records.set(skillKey(current.package.name, current.package.version), next);\n    this.#appendEvent({\n      action: "VERIFIED",\n      actor: null,\n      contentHash: current.package.contentHash,\n      evidenceRefs: evidence.evidenceRefs,\n      from: current.lifecycle,\n      name: current.package.name,\n      occurredAt: evidence.observedAt,\n      producerClass: evidence.producerClass,\n      to: "VERIFIED",\n      version: current.package.version,\n    });\n    return cloneRecord(next);`,
          );
          replace(
            '    this.#records.set(skillKey(request.name, request.version), next);\n    return cloneRecord(next);\n  }\n\n  #activate(',
            `    this.#records.set(skillKey(request.name, request.version), next);\n    this.#appendEvent({\n      action: "REVOKED",\n      actor: request.actor,\n      contentHash: current.package.contentHash,\n      evidenceRefs: [],\n      from: current.lifecycle,\n      name: request.name,\n      occurredAt: request.revokedAt,\n      producerClass: null,\n      to: "REVOKED",\n      version: request.version,\n    });\n    return cloneRecord(next);\n  }\n\n  #activate(`,
          );
          replace(
            '        this.#records.set(\n          key,\n          freezeRecord({\n            ...record,\n            lifecycle: "VERIFIED",\n          }),\n        );',
            `        this.#records.set(\n          key,\n          freezeRecord({\n            ...record,\n            lifecycle: "VERIFIED",\n          }),\n        );\n        this.#appendEvent({\n          action: "SUPERSEDED",\n          actor: request.actor,\n          contentHash: record.package.contentHash,\n          evidenceRefs: [],\n          from: "ACTIVE",\n          name: record.package.name,\n          occurredAt: request.promotedAt,\n          producerClass: null,\n          to: "VERIFIED",\n          version: record.package.version,\n        });`,
          );
          replace(
            '    this.#records.set(skillKey(request.name, request.version), next);\n    return cloneRecord(next);\n  }\n\n  #insert(skill: SkillPackage, lifecycle: SkillLifecycle): SkillRecord {',
            `    this.#records.set(skillKey(request.name, request.version), next);\n    this.#appendEvent({\n      action: rollback ? "ROLLED_BACK" : "ACTIVATED",\n      actor: request.actor,\n      contentHash: current.package.contentHash,\n      evidenceRefs: [],\n      from: current.lifecycle,\n      name: request.name,\n      occurredAt: request.promotedAt,\n      producerClass: null,\n      to: "ACTIVE",\n      version: request.version,\n    });\n    return cloneRecord(next);\n  }\n\n  #insert(skill: SkillPackage, lifecycle: SkillLifecycle): SkillRecord {`,
          );
          replace(
            '    this.#records.set(key, record);\n    return cloneRecord(record);\n  }\n\n  #record(name: string, version: string): SkillRecord {',
            `    this.#records.set(key, record);\n    this.#appendEvent({\n      action: "REGISTERED",\n      actor: null,\n      contentHash: skill.contentHash,\n      evidenceRefs: [],\n      from: null,\n      name: skill.name,\n      occurredAt: skill.provenance.observedAt,\n      producerClass: null,\n      to: lifecycle,\n      version: skill.version,\n    });\n    return cloneRecord(record);\n  }\n\n  #appendEvent(event: Omit<SkillLifecycleEvent, "sequence">): void {\n    this.#events.push(\n      freezeLifecycleEvent({\n        ...event,\n        sequence: this.#events.length + 1,\n      }),\n    );\n  }\n\n  #record(name: string, version: string): SkillRecord {`,
          );
          replace(
            'function cloneRecord(value: SkillRecord): SkillRecord {\n  return freezeRecord(structuredClone(value));\n}\n\nfunction exactKeys(',
            `function cloneRecord(value: SkillRecord): SkillRecord {\n  return freezeRecord(structuredClone(value));\n}\n\nfunction freezeLifecycleEvent(value: SkillLifecycleEvent): SkillLifecycleEvent {\n  return Object.freeze({\n    ...value,\n    evidenceRefs: Object.freeze([...value.evidenceRefs]),\n  });\n}\n\nfunction cloneLifecycleEvent(value: SkillLifecycleEvent): SkillLifecycleEvent {\n  return freezeLifecycleEvent(structuredClone(value));\n}\n\nfunction exactKeys(`,
          );
          fs.writeFileSync(path, text);
          NODE
          npx biome check --write src/skills/registry.ts src/skills/types.ts
      - name: Commit audit history and remove helper
        run: |
          rm .github/workflows/m10-audit-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/skills/registry.ts src/skills/types.ts .github/workflows/m10-audit-helper.yml
          git commit -m "feat(m10): audit skill lifecycle transitions"
          git push origin HEAD:agent/m10-skill-lifecycle
