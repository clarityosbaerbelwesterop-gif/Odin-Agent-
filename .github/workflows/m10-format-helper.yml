name: M10 formatting helper

on:
  push:
    branches:
      - agent/m10-skill-lifecycle

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply repository formatter
        run: npx biome check --write src/skills test/skills
      - name: Commit formatting and remove helper
        run: |
          rm .github/workflows/m10-format-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/skills test/skills .github/workflows/m10-format-helper.yml
          git commit -m "style(m10): normalize skill lifecycle code"
          git push origin HEAD:agent/m10-skill-lifecycle
