name: M10 strict type fix

on:
  push:
    branches:
      - agent/m10-skill-lifecycle

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Repair strict index narrowing
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function patch(path, replacements) {
            let text = fs.readFileSync(path, 'utf8');
            for (const [oldText, newText] of replacements) {
              if (!text.includes(oldText)) throw new Error(`Missing expected pattern in ${path}: ${oldText}`);
              text = text.replace(oldText, newText);
            }
            fs.writeFileSync(path, text);
          }
          patch('src/skills/registry.ts', [[
            '    if (matches.length !== 1) {\n      throw new SkillError("NOT_FOUND", `No active skill version exists for ${name}.`);\n    }\n    return clonePackage(matches[0].package);',
            '    const active = matches[0];\n    if (matches.length !== 1 || active === undefined) {\n      throw new SkillError("NOT_FOUND", `No active skill version exists for ${name}.`);\n    }\n    return clonePackage(active.package);'
          ]]);
          patch('test/skills/registry.test.ts', [[
            '  const summaries = registry.listAvailableSummaries();\n  assert.equal(summaries.length, 1);\n  assert.equal("instructions" in summaries[0], false);\n  assert.equal(JSON.stringify(summaries).includes("smallest change"), false);\n  assert.deepEqual(summaries[0].requiredTools, ["repo.patch", "repo.quality", "repo.read"]);\n  assert.equal(first.package.contentHash, secondRegistry.listAvailableSummaries()[0].contentHash);',
            '  const summaries = registry.listAvailableSummaries();\n  assert.equal(summaries.length, 1);\n  const summary = summaries[0];\n  assert.ok(summary);\n  assert.equal("instructions" in summary, false);\n  assert.equal(JSON.stringify(summaries).includes("smallest change"), false);\n  assert.deepEqual(summary.requiredTools, ["repo.patch", "repo.quality", "repo.read"]);\n  const reorderedSummary = secondRegistry.listAvailableSummaries()[0];\n  assert.ok(reorderedSummary);\n  assert.equal(first.package.contentHash, reorderedSummary.contentHash);'
          ], [
            '  assert.deepEqual(learnedHistory[1].evidenceRefs, ["evidence:independent"]);\n  assert.equal(learnedHistory[1].producerClass, "independent_verifier");\n  assert.throws(() => (learnedHistory[1].evidenceRefs as string[]).push("mutated"), TypeError);',
            '  const verificationEvent = learnedHistory[1];\n  assert.ok(verificationEvent);\n  assert.deepEqual(verificationEvent.evidenceRefs, ["evidence:independent"]);\n  assert.equal(verificationEvent.producerClass, "independent_verifier");\n  assert.throws(() => (verificationEvent.evidenceRefs as string[]).push("mutated"), TypeError);'
          ]]);
          NODE
          npx biome check --write src/skills/registry.ts test/skills/registry.test.ts
          npx tsc -p tsconfig.json --noEmit
      - name: Commit strict type repair and remove helper
        run: |
          rm .github/workflows/m10-typefix-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/skills/registry.ts test/skills/registry.test.ts .github/workflows/m10-typefix-helper.yml
          git commit -m "fix(m10): narrow strict skill indexes"
          git push origin HEAD:agent/m10-skill-lifecycle
