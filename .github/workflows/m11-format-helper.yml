name: M11 formatting helper

on:
  push:
    branches:
      - agent/m11-adaptive-reasoning

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Repair mechanical lint findings
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const routerPath = 'src/routing/router.ts';
          let router = fs.readFileSync(routerPath, 'utf8');
          router = router.replace(
            'import type { CapabilityProfile, ReasoningEffort } from "../providers/types.js";',
            'import type { CapabilityProfile } from "../providers/types.js";',
          );
          fs.writeFileSync(routerPath, router);

          const testPath = 'test/routing/router.test.ts';
          let test = fs.readFileSync(testPath, 'utf8');
          test = test.replace(
            '  assert.equal(route.escalations[0]?.model, "strong");\n  assert.ok(route.primary.estimatedCostMicros < route.escalations[0]!.estimatedCostMicros);',
            '  const escalation = route.escalations[0];\n  assert.ok(escalation !== undefined);\n  assert.equal(escalation.model, "strong");\n  assert.ok(route.primary.estimatedCostMicros < escalation.estimatedCostMicros);',
          );
          fs.writeFileSync(testPath, test);
          NODE
          npx biome check --write src/routing test/routing
          npm run typecheck
      - name: Commit formatted M11 sources and remove helper
        run: |
          git rm .github/workflows/m11-format-helper.yml
          git add src/routing test/routing
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style(m11): normalize routing implementation"
          git push origin HEAD:agent/m11-adaptive-reasoning
