name: M12 one-shot Biome fix

on:
  push:
    branches:
      - agent/m12-production-hardening

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Repair control-character check and apply safe Biome fixes
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/sandbox/network.ts';
          let text = fs.readFileSync(path, 'utf8');
          const oldText = `function hasControlCharacter(value: string): boolean {\n  return /[\\u0000-\\u001f\\u007f]/u.test(value);\n}`;
          const newText = `function hasControlCharacter(value: string): boolean {\n  for (const character of value) {\n    const code = character.charCodeAt(0);\n    if (code <= 0x1f || code === 0x7f) return true;\n  }\n  return false;\n}`;
          if (text.includes(oldText)) {
            text = text.replace(oldText, newText);
            fs.writeFileSync(path, text);
          }
          NODE
          npx biome check --write src/sandbox test/sandbox
      - name: Commit and remove helper
        run: |
          rm .github/workflows/m12-biome-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sandbox test/sandbox .github/workflows/m12-biome-fix.yml
          if ! git diff --cached --quiet; then
            git commit -m "fix(m12): apply sandbox Biome fixes"
            git push origin HEAD:agent/m12-production-hardening
          fi
