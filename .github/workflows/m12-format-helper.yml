name: M12 formatting helper

on:
  push:
    branches:
      - agent/m12-production-hardening

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Repair control-character check
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/sandbox/network.ts';
          let text = fs.readFileSync(path, 'utf8');
          const oldText = `function hasControlCharacter(value: string): boolean {\n  return /[\\u0000-\\u001f\\u007f]/u.test(value);\n}`;
          const newText = `function hasControlCharacter(value: string): boolean {\n  for (const character of value) {\n    const code = character.charCodeAt(0);\n    if (code <= 0x1f || code === 0x7f) return true;\n  }\n  return false;\n}`;
          if (!text.includes(oldText)) throw new Error('Missing control-character helper');
          text = text.replace(oldText, newText);
          fs.writeFileSync(path, text);
          NODE
      - name: Apply scoped safe Biome fixes
        run: npx biome check --write src/sandbox test/sandbox
      - run: npm run verify
      - name: Commit formatted M12 tranche and remove helper
        run: |
          rm .github/workflows/m12-format-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sandbox test/sandbox .github/workflows/m12-format-helper.yml
          git commit -m "fix(m12): normalize sandbox hardening tranche"
          git push origin HEAD:agent/m12-production-hardening
