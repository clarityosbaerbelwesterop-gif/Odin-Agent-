name: M12 lifecycle formatting

on:
  push:
    branches:
      - agent/m12-production-hardening

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx biome format --write src/sandbox/backend.ts
      - name: Commit formatted lifecycle and remove helper
        run: |
          rm .github/workflows/m12-lifecycle-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sandbox/backend.ts .github/workflows/m12-lifecycle-format.yml
          git commit -m "fix(m12): format sandbox lifecycle"
          git push origin HEAD:agent/m12-production-hardening
