name: M12 model credential routing

on:
  push:
    branches:
      - agent/m12-production-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Add provider-model credential context
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function replace(path, oldText, newText) {
            let text = fs.readFileSync(path, 'utf8');
            if (!text.includes(oldText)) throw new Error(`Missing expected pattern in ${path}`);
            text = text.replace(oldText, newText);
            fs.writeFileSync(path, text);
          }

          replace(
            'src/providers/types.ts',
            'export type CredentialResolver = () => Promise<string> | string;',
            `export interface ProviderCredentialContext {\n  readonly provider: string;\n  readonly model: string;\n}\n\nexport type CredentialResolver = (\n  context: ProviderCredentialContext,\n) => Promise<string> | string;`,
          );
          replace(
            'src/providers/base.ts',
            '    const credential = await this.resolveCredential();',
            '    const credential = await this.resolveCredential(request.model);',
          );
          replace(
            'src/providers/base.ts',
            '  private async resolveCredential(): Promise<string> {',
            '  private async resolveCredential(model: string): Promise<string> {',
          );
          replace(
            'src/providers/base.ts',
            '      credential = await this.#credentialResolver();',
            '      credential = await this.#credentialResolver(Object.freeze({ model, provider: this.id }));',
          );

          const testPath = 'test/providers/openai.test.ts';
          let tests = fs.readFileSync(testPath, 'utf8');
          const addition = `\n\ntest("credential resolver receives exact provider and model context", async () => {\n  const transport = new MockTransport((request) => {\n    const body = JSON.parse(request.body) as { model: string };\n    return jsonResponse({ ...openAIResponse(), model: body.model });\n  });\n  const contexts: Array<Readonly<{ model: string; provider: string }>> = [];\n  const provider = new OpenAIProvider({\n    capabilities: new CapabilityRegistry([\n      capabilityProfile("openai", "model-a"),\n      capabilityProfile("openai", "model-b"),\n    ]),\n    credential: (context) => {\n      contexts.push(Object.freeze({ ...context }));\n      return context.model === "model-a" ? "key-a" : "key-b";\n    },\n    transport,\n  });\n\n  await provider.generate(basicRequest("model-a"));\n  await provider.generate(basicRequest("model-b"));\n\n  assert.deepEqual(contexts, [\n    { model: "model-a", provider: "openai" },\n    { model: "model-b", provider: "openai" },\n  ]);\n  assert.equal(transport.requests[0]?.headers.authorization, "Bearer key-a");\n  assert.equal(transport.requests[1]?.headers.authorization, "Bearer key-b");\n});\n`;
          if (!tests.includes('credential resolver receives exact provider and model context')) {
            fs.appendFileSync(testPath, addition);
          }
          NODE
          npx biome check --write src/providers/types.ts src/providers/base.ts test/providers/openai.test.ts
      - name: Commit patch and remove helper
        run: |
          rm .github/workflows/m12-model-credentials.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/providers/types.ts src/providers/base.ts test/providers/openai.test.ts .github/workflows/m12-model-credentials.yml
          git commit -m "feat(m12): route provider credentials by model"
          git push origin HEAD:agent/m12-production-hardening
      - name: Verify patched branch
        run: npm run verify
