name: M12 sandbox diagnostic steps

on:
  push:
    branches:
      - agent/m12-production-hardening

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: backend test
        run: timeout 15s node --test --experimental-test-coverage dist/test/sandbox/backend.test.js
      - name: network test
        run: timeout 15s node --test --experimental-test-coverage dist/test/sandbox/network.test.js
      - name: process test
        run: timeout 15s node --test --experimental-test-coverage dist/test/sandbox/process.test.js
      - name: routing test
        run: timeout 15s node --test --experimental-test-coverage dist/test/sandbox/routing.test.js
      - name: workspace test
        run: timeout 15s node --test --experimental-test-coverage dist/test/sandbox/workspace.test.js
