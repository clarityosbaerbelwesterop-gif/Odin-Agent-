name: M12 sandbox diagnostic

on:
  push:
    branches:
      - agent/m12-production-hardening

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run sandbox tests individually with hard timeouts
        run: |
          set -euo pipefail
          for file in dist/test/sandbox/*.test.js; do
            echo "===== $file ====="
            timeout 20s node --test --experimental-test-coverage "$file"
          done
