name: M12C one-shot documentation sync

on:
  push:
    branches: [agent/m12c-release-proof]
    paths: [.github/workflows/m12c-doc-sync.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/m12c-release-proof
          fetch-depth: 0
      - name: Synchronize M12-C evidence docs
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceExact(path, oldText, newText) {
            const current = fs.readFileSync(path, 'utf8');
            if (!current.includes(oldText)) {
              throw new Error(`Expected anchor missing in ${path}: ${oldText.slice(0, 120)}`);
            }
            fs.writeFileSync(path, current.replace(oldText, newText));
          }

          replaceExact(
            'ROADMAP.md',
            'Status: **PARTIALLY_VERIFIED**. Local deterministic M12-A/B hardening is verified; live and production\ninfrastructure proof remains deliberately open.',
            'Status: **PARTIALLY_VERIFIED**. Local deterministic M12-A/B/C hardening and release-proof controls are\nverified; live provider/sandbox and public-production infrastructure proof remains deliberately open.',
          );
          replaceExact(
            'ROADMAP.md',
            '- [ ] M12-C structured observability, deterministic load/recovery evidence, backup/recovery contracts,\n  release manifests, and fail-closed release gates.',
            '- [x] M12-C structured secret-safe observability, deterministic load/recovery evidence, backup/restore\n  contracts, integrity-bound release manifests, and fail-closed local/integration/live release gates.\n- [x] M12-C normal PR CI observed: run `33796268313`, 258/258 tests passed; aggregate coverage was\n  89.29% lines, 76.24% branches, and 95.64% functions.\n- [x] Local verify + recovery + restore evidence can pass only the `local` release gate; the same evidence\n  is explicitly proven insufficient for `integration` and `live` claims.',
          );
          replaceExact(
            'ROADMAP.md',
            'M12-A/B prove local deterministic enforcement and a provider-neutral remote-sandbox lifecycle contract.\nThey do **not** prove Docker/Kubernetes/VM isolation, a specific hosted sandbox API, transport-level DNS\npinning, live-provider compatibility, deployment, production auth, backups, or public traffic.',
            'M12-A/B/C prove local deterministic enforcement, a provider-neutral remote-sandbox lifecycle contract,\nsecret-safe observability, deterministic recovery/backup evidence, and fail-closed release-claim levels.\nThey do **not** prove Docker/Kubernetes/VM isolation, a specific hosted sandbox API, transport-level DNS\npinning, live-provider compatibility, deployment, production auth, cloud backup guarantees, or public traffic.',
          );

          replaceExact(
            'ARCHITECTURE.md',
            'Status: M12-A/B local execution and provider-neutral sandbox lifecycle partially verified, 2026-09-03.',
            'Status: M12-A/B/C local execution, sandbox lifecycle, observability, recovery evidence, and release gates verified locally; full M12 remains partially verified pending authorized live/infrastructure proof, 2026-09-04.',
          );
          replaceExact(
            'ARCHITECTURE.md',
            'Normal PR run `33794095989` verified this tranche with 237/237 tests and aggregate coverage 89.43%\nlines / 76.28% branches / 95.37% functions.\n\n## Current module map',
            'Normal PR run `33794095989` verified this tranche with 237/237 tests and aggregate coverage 89.43%\nlines / 76.28% branches / 95.37% functions.\n\n### M12-C — Observability, recovery evidence, and release proof\n\n`src/observability` adds bounded structured runtime events with deterministic identity and fail-closed\nsecret-like metadata rejection. `src/release` adds hash-bound release evidence, monotonic local /\nintegration / live claim policies, backup/restore proof, deterministic recovery proof, and release gates\nthat reject missing, stale, foreign, failed, tampered, or weaker-than-required evidence.\n\nSandbox cleanup was additionally hardened so concurrent identical releases collapse to one remote\n`destroy` operation while conflicting release reasons fail closed. The local end-to-end release fixture\nproves that repository verify + recovery + restore evidence can unlock only a local claim and cannot be\nrelabelled into integration/live proof. Normal PR run `33796268313` passed 258/258 tests with 89.29%\nline / 76.24% branch / 95.64% function coverage.\n\n## Current module map',
          );
          replaceExact(
            'ARCHITECTURE.md',
            '  sandbox/       M12 canonical workspace, bounded process/network policy, backend lifecycle/routing\n  artifacts/',
            '  sandbox/       M12 canonical workspace, bounded process/network policy, backend lifecycle/routing\n  observability/ M12-C secret-safe bounded runtime events\n  release/       M12-C backup/recovery proof, release evidence/manifests, fail-closed gates\n  artifacts/',
          );
          replaceExact(
            'ARCHITECTURE.md',
            '## Next architecture milestone\n\nM12-C completes the no-cost production-hardening work around the verified M12-A/B execution boundary:\nstructured secret-safe observability, deterministic load/recovery evidence, backup/recovery contracts,\nrelease manifests, and fail-closed release gates.\n\nLive-provider/sandbox smoke matrices, production deployment, public service/auth transport, and any\npaid infrastructure require separate explicit authorization and remain unproven until actually\nexercised.',
            '## Next architecture milestone\n\nThe remaining M12 path is evidence escalation, not local claim inflation: run an explicitly authorized\nlive provider/sandbox smoke matrix through the existing provider/runtime boundaries, then bind those\nobservations into `integration` or `live` release evidence. Public service/auth/realtime transport and\ndeployment hardening remain separate production work.\n\nLocal CI may never manufacture `integration` or `live` evidence. Any paid resource, deployment, or\nproduction/public traffic remains separately approval-gated.',
          );

          replaceExact(
            'SECURITY.md',
            'and M12-A/B local execution/sandbox safeguards. Controls not explicitly identified as implemented remain future work.',
            'and M12-A/B/C local execution/sandbox, observability, recovery-evidence, and release-gate safeguards. Controls not explicitly identified as implemented remain future work.',
          );
          replaceExact(
            'SECURITY.md',
            'Normal PR CI `33794095989` verified the M12-A/B local tranche with 237/237 tests. No hosted sandbox\nprovider, live model provider, paid resource, production deployment, migration, billing change, or\npublic traffic was exercised.\n\n## Prompt injection and untrusted-content security',
            'Normal PR CI `33794095989` verified the M12-A/B local tranche with 237/237 tests. No hosted sandbox\nprovider, live model provider, paid resource, production deployment, migration, billing change, or\npublic traffic was exercised.\n\n## Implemented M12-C observability and release-proof safeguards\n\n`src/observability` rejects dangerous metadata keys and obvious secret-like values before event\nmaterialization. Events carry only bounded typed metadata, canonical timestamps, and deterministic\nidentity; raw credentials, full environments, private reasoning, and unbounded process output are not\nvalid event content.\n\n`src/release` binds evidence to exact producer, level, subject, status, timestamp, and content hash.\nRelease manifests bind exact commit/config/suite/policy/evidence identities. Policy levels are monotonic:\nstronger claims retain lower-level requirements and must add evidence genuinely produced at the stronger\nlevel. Missing, stale, future, foreign, failed, tampered, duplicated, unreferenced, or weak evidence\nblocks. Backup/restore verification binds restored-state hash to the source-state hash and cannot claim\ncloud/production recovery without separately exercised infrastructure.\n\nConcurrent identical sandbox release now collapses to one remote cleanup call; a conflicting release\nreason fails closed. Normal PR CI `33796268313` passed 258/258 tests. The local end-to-end release proof\nexplicitly passes `local` and blocks `integration`/`live` when only local evidence exists.\n\n## Prompt injection and untrusted-content security',
          );

          const handover = `# Engineering handover\n\nUpdated: 2026-09-04.\n\n## Current state\n\n- Repository: \`clarityosbaerbelwesterop-gif/Odin-Agent-\` (private).\n- \`main\` contains verified M0–M11 plus merged M12-A/B at squash merge\n  \`144e1115196c56e550a5b1da10973fe135d23276\`.\n- Active branch: \`agent/m12c-release-proof\`; Draft PR #16 targets \`main\`.\n- M12-C local implementation is repository/CI verified on head\n  \`5e2a387ca2b2fd4905ac03560df4878be7cda35b\`.\n- Normal PR run \`33796268313\` passed **258/258 tests**, 0 failures, with aggregate coverage\n  **89.29% lines / 76.24% branches / 95.64% functions**.\n- M12 remains **PARTIALLY_VERIFIED** because no authorized live provider/sandbox, production deploy,\n  public-service auth/realtime transport, migration, or public traffic proof has been completed yet.\n- The user has now explicitly authorized a minimal NVIDIA live-provider smoke run using the existing\n  repository secret and requested Kimi K3 if that model is actually available to the key.\n\n## M12-C verified local capability\n\n- bounded structured observability with deterministic event identity and pre-log secret-like metadata rejection;\n- immutable hash-bound release evidence and deterministic manifests;\n- monotonic \`local\` / \`integration\` / \`live\` evidence levels that cannot be upgraded by relabelling;\n- fail-closed release gates for missing/stale/foreign/failed/tampered/duplicate/unreferenced/weak evidence;\n- backup manifests and restore verification bound to exact source/restored state hashes;\n- deterministic five-scenario recovery proof and conversion to scoped release evidence;\n- end-to-end local release proof: repo verify + recovery + restore passes only \`local\`, while\n  \`integration\` and \`live\` remain blocked without real higher-level evidence;\n- concurrent sandbox release race fixed: identical releases collapse to one remote destroy, conflicting\n  release reasons fail closed.\n\n## Boundaries retained\n\n- M3 remains execution/capability authority; M5 remains completion authority.\n- M6 memory is still an in-memory contract; M7 ownership is logical single-process coordination.\n- M8 durability is local SQLite and does not imply distributed exactly-once effects.\n- M9 is a local client protocol/reference shell, not production auth/realtime transport.\n- M10 learned/community skills cannot self-promote.\n- M11 offline evaluation does not prove live model quality.\n- M12 host-process execution is not kernel/container isolation; network policy is not transport-level\n  DNS pinning; provider-neutral sandbox contracts are not proof of a hosted sandbox implementation.\n- Local fixtures never become integration/live evidence.\n\n## Verified evidence history\n\n- M10 implementation run \`33777800516\`, 172/172; squash merge\n  \`bfc76b57a3531f5b6824fa3a3c285c5a55fd13d0\`.\n- M11 final squash merge \`bd9c42a2c07918aed140aebcd0d0d59082a71678\`; exact-head CI recorded in merge message.\n- M12-A/B normal PR run \`33794095989\`: 237/237; squash merge\n  \`144e1115196c56e550a5b1da10973fe135d23276\`.\n- M12-C normal PR run \`33796268313\`: 258/258, 89.29% line / 76.24% branch / 95.64% function coverage.\n\n## Exact next action\n\n1. Finish M12-C documentation synchronization and obtain a final normal PR-specific \`npm run verify\`\n   on the exact clean head.\n2. Mark PR #16 ready and squash-merge with exact-head protection under the user's standing merge approval.\n3. Create a fresh live-evaluation branch from the resulting \`main\`.\n4. Add a narrowly scoped GitHub Actions live-smoke path that reads \`NV_API_KEY\` only from repository\n   secrets, never prints it, discovers/validates the exact NVIDIA Kimi model identifier, and performs one\n   low-volume end-to-end task through Odin's provider/runtime boundary.\n5. Record latency/usage/output/evidence and score the task against deterministic acceptance criteria. Do\n   not claim superiority over GPT-6 Astra/Fable 5.1 unless the same task is actually run against authorized\n   comparable baselines; use architecture/eval evidence only for an AGI-bridge assessment.\n6. Continue remaining no-cost post-MVP tracks after the live smoke, without deployment, production\n   migration, or paid-resource creation beyond this explicitly authorized minimal provider call.\n`;
          fs.writeFileSync('HANDOVER.md', handover);

          replaceExact(
            'docs/milestones/M12_C_RELEASE_PROOF.md',
            'Status: implementation in progress. Updated: 2026-09-03.',
            'Status: local implementation VERIFIED; full M12 remains PARTIALLY_VERIFIED pending authorized live/infrastructure proof. Updated: 2026-09-04.',
          );
          fs.appendFileSync(
            'docs/milestones/M12_C_RELEASE_PROOF.md',
            '\n## Verified repository evidence\n\n- Normal PR CI run `33796268313` passed on implementation head `5e2a387ca2b2fd4905ac03560df4878be7cda35b`.\n- 258/258 tests passed with 0 failures.\n- Aggregate coverage: 89.29% lines, 76.24% branches, 95.64% functions.\n- The end-to-end local release fixture passes `local` using repository verify + recovery + restore evidence and deliberately blocks `integration` and `live` without stronger evidence.\n- The sandbox load fixture proves concurrent create collapse and single remote destroy; conflicting concurrent release reasons fail closed.\n\nA final synchronized-documentation CI run is still required before PR #16 is merge-ready.\n',
          );
          NODE
          rm .github/workflows/m12c-doc-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md ARCHITECTURE.md SECURITY.md HANDOVER.md docs/milestones/M12_C_RELEASE_PROOF.md .github/workflows/m12c-doc-sync.yml
          git diff --cached --check
          git commit -m "docs(m12c): synchronize verified local release proof"
          git push origin HEAD:agent/m12c-release-proof
