name: M12C one-shot format

on:
  push:
    branches:
      - agent/m12c-release-proof

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply Biome fixes to M12-C files
        run: npx biome check --write src/observability src/release test/observability test/release
      - name: Remove helper and commit
        run: |
          rm .github/workflows/m12c-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/observability src/release test/observability test/release .github/workflows/m12c-format.yml
          git commit -m "style(m12c): apply repository formatting"
          git push
