name: M13 final format helper

on:
  push:
    branches:
      - agent/m13-evidence-learning
    paths:
      - .github/workflows/m13-format-final-helper.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/m13-evidence-learning
          fetch-depth: 0
      - name: Apply exact formatter output
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const testPath = 'test/learning/curator.test.ts';
          let test = fs.readFileSync(testPath, 'utf8');
          const oldIdentity = 'function identity(\n  request: Pick<\n    LearningAttestationRequest,\n    "missionId" | "projectId" | "taskId" | "userId"\n  >,\n): string {';
          const newIdentity = 'function identity(\n  request: Pick<LearningAttestationRequest, "missionId" | "projectId" | "taskId" | "userId">,\n): string {';
          if (!test.includes(oldIdentity)) throw new Error('Expected unformatted identity block missing.');
          fs.writeFileSync(testPath, test.replace(oldIdentity, newIdentity));

          const securityPath = 'test/learning/security.test.ts';
          let security = fs.readFileSync(securityPath, 'utf8');
          const doubleGap = '  );\n});\n\n\ntest("automatic learning rejects secret-like keys, tags, and source references"';
          const singleGap = '  );\n});\n\ntest("automatic learning rejects secret-like keys, tags, and source references"';
          if (!security.includes(doubleGap)) throw new Error('Expected extra blank line missing.');
          fs.writeFileSync(securityPath, security.replace(doubleGap, singleGap));
          NODE
      - name: Remove helper and commit
        run: |
          rm .github/workflows/m13-format-final-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/learning/curator.test.ts test/learning/security.test.ts .github/workflows/m13-format-final-helper.yml
          git commit -m "style(m13): match repository formatter"
          git push origin HEAD:agent/m13-evidence-learning
