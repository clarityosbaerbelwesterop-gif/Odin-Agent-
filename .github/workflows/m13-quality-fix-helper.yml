name: M13 quality fix helper

on:
  push:
    branches:
      - agent/m13-evidence-learning
    paths:
      - .github/workflows/m13-quality-fix-helper.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/m13-evidence-learning
          fetch-depth: 0
      - name: Install locked dependencies
        run: npm ci
      - name: Replace control-character regex with explicit code-point check
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/learning/curator.ts';
          let text = fs.readFileSync(path, 'utf8');
          const oldText = 'if (value === "" || value.length > MAX_ID_LENGTH || /[\\u0000-\\u001f\\u007f]/u.test(value)) {';
          const newText = 'if (value === "" || value.length > MAX_ID_LENGTH || hasControlCharacter(value)) {';
          if (!text.includes(oldText)) throw new Error('Expected identifier guard was not found.');
          text = text.replace(oldText, newText);
          const anchor = 'function assertIdentifier(value: string, label: string): void {';
          const helper = 'function hasControlCharacter(value: string): boolean {\n  return [...value].some((character) => {\n    const codePoint = character.codePointAt(0);\n    return codePoint !== undefined && (codePoint <= 31 || codePoint === 127);\n  });\n}\n\n';
          if (!text.includes(anchor)) throw new Error('Identifier helper anchor was not found.');
          text = text.replace(anchor, helper + anchor);
          fs.writeFileSync(path, text);
          NODE
      - name: Apply Biome safe fixes and formatting
        run: npx biome check --write src/learning/curator.ts test/learning/curator.test.ts test/learning/security.test.ts
      - name: Verify targeted quality files
        run: npx biome check src/learning/curator.ts test/learning/curator.test.ts test/learning/security.test.ts
      - name: Remove helper and commit
        run: |
          rm .github/workflows/m13-quality-fix-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/learning/curator.ts test/learning/curator.test.ts test/learning/security.test.ts .github/workflows/m13-quality-fix-helper.yml
          git commit -m "fix(m13): satisfy quality gate"
          git push origin HEAD:agent/m13-evidence-learning
