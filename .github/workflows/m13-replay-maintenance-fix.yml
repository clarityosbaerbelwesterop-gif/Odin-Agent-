name: M13 replay and maintenance fix

on:
  push:
    branches: [agent/m13-evidence-learning]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/m13-evidence-learning
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Apply replay and maintenance corrections
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const curatorPath = 'src/learning/curator.ts';
          let curator = fs.readFileSync(curatorPath, 'utf8');

          const oldReplay = `interface ReplayRecord {
  readonly fingerprint: string;
  readonly recordId: string;
  readonly supportIdentity: string;
}`;
          const newReplay = `interface ReplayRecord {
  readonly proposalFingerprint: string;
  readonly recordId: string;
  readonly supportIdentity: string;
}`;
          if (!curator.includes(oldReplay)) throw new Error('ReplayRecord anchor missing');
          curator = curator.replace(oldReplay, newReplay);

          const oldFlow = `    const contentHash = sha256(proposal.lesson);
    const request: LearningAttestationRequest = {
      learningKeyHash: sha256(proposal.key),
      lessonContentHash: contentHash,
      missionId: proposal.missionId,
      projectId: proposal.projectId,
      sensitivity: proposal.sensitivity,
      taskId: proposal.taskId,
      userId: proposal.userId,
    };
    const attestation = await this.#authority.attestVerifiedTask(request);
    const verified = validateAttestation(attestation, request, proposal.observedAt);
    const recordId = learningId(proposal, contentHash);
    const supportIdentity = \`${'${proposal.missionId}'}\\u0000${'${proposal.taskId}'}\`;
    const replayKey = \`${'${proposal.userId}'}\\u0000${'${proposal.projectId}'}\\u0000${'${supportIdentity}'}\\u0000${'${proposal.idempotencyKey}'}\`;
    const fingerprint = stableHash({ proposal, verified });
    const replay = this.#replays.get(replayKey);
    if (replay !== undefined) {
      if (
        replay.fingerprint !== fingerprint ||
        replay.recordId !== recordId ||
        replay.supportIdentity !== supportIdentity
      ) {
        throw new LearningError(
          "CONFLICT",
          "Learning idempotency replay conflicts with prior input.",
        );
      }
      const record = this.#records.get(recordId);
      if (record === undefined) {
        throw new LearningError("CONFLICT", "Learning replay points to missing state.");
      }
      return { record: cloneRecord(record), replayed: true, supportAdded: false };
    }
`;
          const newFlow = `    const contentHash = sha256(proposal.lesson);
    const recordId = learningId(proposal, contentHash);
    const supportIdentity = \`${'${proposal.missionId}'}\\u0000${'${proposal.taskId}'}\`;
    const replayKey = \`${'${proposal.userId}'}\\u0000${'${proposal.projectId}'}\\u0000${'${supportIdentity}'}\\u0000${'${proposal.idempotencyKey}'}\`;
    const proposalFingerprint = stableHash(proposal);
    const replay = this.#replays.get(replayKey);
    if (replay !== undefined) {
      if (
        replay.proposalFingerprint !== proposalFingerprint ||
        replay.recordId !== recordId ||
        replay.supportIdentity !== supportIdentity
      ) {
        throw new LearningError(
          "CONFLICT",
          "Learning idempotency replay conflicts with prior input.",
        );
      }
      const record = this.#records.get(recordId);
      if (record === undefined) {
        throw new LearningError("CONFLICT", "Learning replay points to missing state.");
      }
      return { record: cloneRecord(record), replayed: true, supportAdded: false };
    }

    const request: LearningAttestationRequest = {
      learningKeyHash: sha256(proposal.key),
      lessonContentHash: contentHash,
      missionId: proposal.missionId,
      projectId: proposal.projectId,
      sensitivity: proposal.sensitivity,
      taskId: proposal.taskId,
      userId: proposal.userId,
    };
    const attestation = await this.#authority.attestVerifiedTask(request);
    const verified = validateAttestation(attestation, request, proposal.observedAt);
`;
          if (!curator.includes(oldFlow)) throw new Error('recordVerifiedLesson flow anchor missing');
          curator = curator.replace(oldFlow, newFlow);

          const oldSet = `    this.#replays.set(replayKey, { fingerprint, recordId, supportIdentity });`;
          const newSet = `    this.#replays.set(replayKey, { proposalFingerprint, recordId, supportIdentity });`;
          if (!curator.includes(oldSet)) throw new Error('replay set anchor missing');
          curator = curator.replace(oldSet, newSet);

          const oldArchive = `      if (record.status !== "ESTABLISHED" && ageDays >= request.archiveAfterDays) {`;
          const newArchive = `      if (
        record.status !== "ESTABLISHED" &&
        record.supports.length < ESTABLISHMENT_SUPPORT &&
        ageDays >= request.archiveAfterDays
      ) {`;
          if (!curator.includes(oldArchive)) throw new Error('maintenance archive anchor missing');
          curator = curator.replace(oldArchive, newArchive);
          fs.writeFileSync(curatorPath, curator);

          const testPath = 'test/learning/curator.test.ts';
          let tests = fs.readFileSync(testPath, 'utf8');
          tests = tests.replaceAll('/scope or verdict did not match/u', '/scope, verdict, or exact content binding did not match/u');

          const oldReplayTest = `  const first = await curator.recordVerifiedLesson(input);
  const replay = await curator.recordVerifiedLesson(input);
  const duplicateTask = await curator.recordVerifiedLesson({`;
          const newReplayTest = `  const first = await curator.recordVerifiedLesson(input);
  authority.attestations.clear();
  const replay = await curator.recordVerifiedLesson(input);
  authority.set(attestation("mission-1", "task-1"));
  const duplicateTask = await curator.recordVerifiedLesson({`;
          if (!tests.includes(oldReplayTest)) throw new Error('idempotency replay test anchor missing');
          tests = tests.replace(oldReplayTest, newReplayTest);
          fs.writeFileSync(testPath, tests);
          NODE
      - name: Verify corrected M13
        run: |
          npm ci
          npm run quality
          npm run typecheck
          npm test
          npm run smoke:kimi:dry
      - name: Remove helper and commit
        run: |
          rm .github/workflows/m13-replay-maintenance-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/learning/curator.ts test/learning/curator.test.ts .github/workflows/m13-replay-maintenance-fix.yml
          git commit -m 'fix(m13): make replay and maintenance fail closed'
          git push origin HEAD:agent/m13-evidence-learning
