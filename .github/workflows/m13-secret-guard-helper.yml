name: M13 secret learning guard helper

on:
  push:
    branches:
      - agent/m13-evidence-learning
    paths:
      - .github/workflows/m13-secret-guard-helper.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/m13-evidence-learning
          fetch-depth: 0
      - name: Add shared secret-text primitive and harden learning
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          fs.mkdirSync('src/security', { recursive: true });
          fs.writeFileSync('src/security/secret-text.ts', `const OBVIOUS_SECRET =\n  /(?:\\bBearer\\s+\\S+|\\bsk-[A-Za-z0-9_-]{8,}|\\bgh[pousr]_[A-Za-z0-9]{8,}|\\bxox[baprs]-|-----BEGIN [A-Z ]*PRIVATE KEY-----)/u;\n\nexport function containsObviousSecret(value: string): boolean {\n  return OBVIOUS_SECRET.test(value);\n}\n`);

          let events = fs.readFileSync('src/observability/events.ts', 'utf8');
          const importAnchor = 'import { createHash } from "node:crypto";\n';
          if (!events.includes(importAnchor)) throw new Error('Observability import anchor missing.');
          events = events.replace(importAnchor, `${importAnchor}import { containsObviousSecret } from "../security/secret-text.js";\n`);
          const forbidden = 'const FORBIDDEN_VALUE =\n  /(?:\\bBearer\\s+\\S+|\\bsk-[A-Za-z0-9_-]{8,}|\\bgh[pousr]_[A-Za-z0-9]{8,}|\\bxox[baprs]-|-----BEGIN [A-Z ]*PRIVATE KEY-----)/u;\n';
          if (!events.includes(forbidden)) throw new Error('Existing secret matcher missing.');
          events = events.replace(forbidden, '');
          if (!events.includes('FORBIDDEN_VALUE.test(value)')) throw new Error('Observability secret check missing.');
          events = events.replace('FORBIDDEN_VALUE.test(value)', 'containsObviousSecret(value)');
          fs.writeFileSync('src/observability/events.ts', events);

          let curator = fs.readFileSync('src/learning/curator.ts', 'utf8');
          const curatorImport = 'import type { MemoryStore } from "../memory/types.js";\n';
          if (!curator.includes(curatorImport)) throw new Error('Curator import anchor missing.');
          curator = curator.replace(curatorImport, `${curatorImport}import { containsObviousSecret } from "../security/secret-text.js";\n`);
          const returnAnchor = '  return Object.freeze({\n    idempotencyKey: identifier(object.idempotencyKey, "idempotencyKey"),\n    key: normalizeKey(object.key),\n    lesson: boundedText(object.lesson, "lesson", MAX_LESSON_LENGTH),';
          if (!curator.includes(returnAnchor)) throw new Error('Proposal return anchor missing.');
          curator = curator.replace(returnAnchor, '  const lesson = boundedText(object.lesson, "lesson", MAX_LESSON_LENGTH);\n  if (containsObviousSecret(lesson)) {\n    throw new LearningError("DENIED", "Post-task learning rejects obvious secret-like lesson content.");\n  }\n  return Object.freeze({\n    idempotencyKey: identifier(object.idempotencyKey, "idempotencyKey"),\n    key: normalizeKey(object.key),\n    lesson,');
          fs.writeFileSync('src/learning/curator.ts', curator);

          let securityTest = fs.readFileSync('test/learning/security.test.ts', 'utf8');
          securityTest += `\n\ntest("automatic learning rejects obvious secret-like lesson content regardless of model sensitivity label", async () => {\n  const curator = new EvidenceLearningCurator(\n    new TamperingAuthority("key"),\n    new InMemoryMemoryStore(),\n  );\n  await assert.rejects(\n    () =>\n      curator.recordVerifiedLesson({\n        ...proposal(),\n        lesson: "Remember API credential sk-proj-abcdefghijk12345 for later use.",\n        sensitivity: "internal",\n      }),\n    (error: unknown) =>\n      error instanceof LearningError &&\n      error.code === "DENIED" &&\n      /secret-like lesson content/u.test(error.message),\n  );\n});\n`;
          fs.writeFileSync('test/learning/security.test.ts', securityTest);

          fs.mkdirSync('test/security', { recursive: true });
          fs.writeFileSync('test/security/secret-text.test.ts', `import assert from "node:assert/strict";\nimport { test } from "node:test";\nimport { containsObviousSecret } from "../../src/security/secret-text.js";\n\ntest("obvious credential patterns are detected without flagging ordinary prose", () => {\n  assert.equal(containsObviousSecret("Bearer abcdefghijklmnop"), true);\n  assert.equal(containsObviousSecret("sk-proj-abcdefghijk12345"), true);\n  assert.equal(containsObviousSecret("ghp_abcdefghijk12345"), true);\n  assert.equal(containsObviousSecret("xoxb-123456789"), true);\n  assert.equal(containsObviousSecret("-----BEGIN PRIVATE KEY-----"), true);\n  assert.equal(containsObviousSecret("Use scoped verification evidence before promotion."), false);\n});\n`);
          NODE
      - name: Install locked dependencies
        run: npm ci
      - name: Format and verify changed files
        run: |
          npx biome check --write src/security/secret-text.ts src/observability/events.ts src/learning/curator.ts test/learning/security.test.ts test/security/secret-text.test.ts
          npx biome check src/security/secret-text.ts src/observability/events.ts src/learning/curator.ts test/learning/security.test.ts test/security/secret-text.test.ts
      - name: Remove helper and commit
        run: |
          rm .github/workflows/m13-secret-guard-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/security/secret-text.ts src/observability/events.ts src/learning/curator.ts test/learning/security.test.ts test/security/secret-text.test.ts .github/workflows/m13-secret-guard-helper.yml
          git commit -m "fix(m13): reject secret-like learned content"
          git push origin HEAD:agent/m13-evidence-learning
