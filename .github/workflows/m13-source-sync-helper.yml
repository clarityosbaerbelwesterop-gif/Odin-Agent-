name: M13 source sync helper

on:
  push:
    branches:
      - agent/m13-evidence-learning
    paths:
      - .github/workflows/m13-source-sync-helper.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/m13-evidence-learning

      - name: Add verified-learning source class to memory runtime
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/memory/store.ts';
          const before = fs.readFileSync(path, 'utf8');
          const oldText = '  "repository",\n  "tool",\n]);';
          const newText = '  "repository",\n  "tool",\n  "verified_learning",\n]);';
          const matches = before.split(oldText).length - 1;
          if (matches !== 1) throw new Error(`Expected exactly one memory source-class anchor, found ${matches}`);
          fs.writeFileSync(path, before.replace(oldText, newText));
          NODE

      - name: Remove helper and commit
        run: |
          rm .github/workflows/m13-source-sync-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/memory/store.ts .github/workflows/m13-source-sync-helper.yml
          git commit -m "fix(m13): allow verified learning memory provenance"
          git push
