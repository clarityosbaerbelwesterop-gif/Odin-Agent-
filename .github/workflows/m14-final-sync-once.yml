name: M14 final governance sync

on:
  push:
    branches:
      - agent/m14-skill-intake-firewall

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/m14-skill-intake-firewall
          fetch-depth: 0
      - name: Synchronize M14 governance
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function read(path) { return fs.readFileSync(path, 'utf8'); }
          function write(path, text) { fs.writeFileSync(path, text); }
          function replaceExact(source, before, after, label) {
            if (!source.includes(before)) throw new Error(`missing expected block: ${label}`);
            return source.replace(before, after);
          }

          {
            const path = 'ARCHITECTURE.md';
            let source = read(path);
            source = replaceExact(
              source,
              'Status: M0–M13 implementation verified locally/in CI; M12 remains partially verified for hosted-sandbox/public-production proof, while M13 evidence-backed learning is implemented and pending final synchronized exact-head PR CI, 2026-09-04.',
              'Status: M0–M13 are merged and verified; M14 skill-intake implementation is verified in normal PR CI and this synchronized head is awaiting its final exact-head CI before merge. M12 remains partially verified for hosted-sandbox/public-production proof, 2026-09-04.',
              'architecture status',
            );
            const marker = '## Current module map';
            if (!source.includes(marker)) throw new Error('architecture module marker missing');
            if (!source.includes('### M14 — Skill intake firewall')) {
              const section = `### M14 — Skill intake firewall\n\n\`src/skill-intake\` converts one externally resolved skill snapshot into immutable bounded evidence without executing third-party code. The trusted resolver must bind repository, requested ref, selected path, and an exact 40-hex commit. File count, per-file bytes, total bytes, path depth, and retained findings are bounded; binaries, symlinks, truncation, incomplete inventory, unknown license state, and malformed manifests remain explicit limitations rather than being interpreted as clean coverage.\n\nStatic findings cover prompt override, credential collection/exfiltration, download-and-execute patterns, destructive writes, privilege escalation, self-promotion, policy/memory poisoning, dependency installation, explicit shell/subprocess use, MCP configuration, hooks/workflows including nested \`.github/workflows\` surfaces, and executable content. Findings retain stable hashes/fingerprints instead of matched raw snippets.\n\nOnly \`COMPLETE + ACCEPT\` may become an M10 \`community\` candidate. M14 forces \`requiredTools=[]\` and cannot activate the skill, register M3 handlers, mint grants, expose credentials, change budgets/routing, or create M5 completion evidence. M10 independent verification/trusted promotion remains a separate authority boundary. Normal PR run \`33858888408\` passed 290/290 tests, Biome, strict TypeScript, and the secret-free Kimi dry smoke; aggregate coverage was 89.47% lines / 76.70% branches / 95.84% functions.\n\n`;
              source = source.replace(marker, section + marker);
            }
            source = replaceExact(
              source,
              '  learning/      M13 evidence-backed repeated learning, conflict curation, bounded nudges\n  security/      shared secret-text and future cross-cutting security primitives',
              '  learning/      M13 evidence-backed repeated learning, conflict curation, bounded nudges\n  skill-intake/  M14 immutable community-skill intake, bounded risk/completeness quarantine\n  security/      shared secret-text and future cross-cutting security primitives',
              'architecture module map',
            );
            source = replaceExact(
              source,
              'Local CI may never manufacture `integration` or `live` evidence. Any paid resource, deployment, or\nproduction/public traffic remains separately approval-gated. With M13 implemented, the preferred no-cost next milestone is M14: an immutable, fail-closed Skill Intake Firewall that can inspect large external skill catalogs without executing them, bind accepted material to exact commits/content hashes, and hand only fully analyzed community candidates to M10. M15 then evaluates and deduplicates candidate procedures into measured, progressively loaded capability packs; neither milestone may turn external instructions into authority.',
              "Local CI may never manufacture `integration` or `live` evidence. Any paid resource, deployment, or\nproduction/public traffic remains separately approval-gated. With M14 implementation verified, the next no-cost capability milestone after merge is M15: evaluate and deduplicate community procedures against Odin's canonical runtime on held-out fixtures, measure output lift/safety/context cost, and promote only measured winners through M10. M15 may propose progressively loaded capability packs but cannot turn external instructions into authority or self-promote them.",
              'architecture next milestone',
            );
            write(path, source);
          }

          {
            const path = 'SECURITY.md';
            let source = read(path);
            source = replaceExact(
              source,
              'M12-A/B/C local execution/sandbox, observability, recovery-evidence, and release-gate safeguards, one M12-D bounded live-provider credential path, and M13 evidence-backed learning safeguards. Controls not explicitly identified as implemented remain future work.',
              'M12-A/B/C local execution/sandbox, observability, recovery-evidence, and release-gate safeguards, one M12-D bounded live-provider credential path, M13 evidence-backed learning safeguards, and M14 bounded external-skill intake safeguards. Controls not explicitly identified as implemented remain future work.',
              'security status',
            );
            source = replaceExact(
              source,
              'The next planned M14 intake boundary must retain these principles for external skills: immutable source pinning, bounded complete analysis, no execution during intake, and no path from discovery to activation without M10 independent verification/trusted promotion. A curated or official source is provenance evidence, not automatic runtime trust.\n\n',
              `## Implemented M14 skill-intake safeguards\n\nExternal skills, plugins, catalogs, scripts, hooks, MCP files, and workflow definitions are untrusted data. M14 requires a trusted resolver to bind the requested repository/ref/path to one immutable commit and rejects source-identity confusion before candidate creation. Mutable catalog reputation or an official publisher name is provenance context, not runtime authority.\n\nAnalysis is resource-bounded and non-executing: file count, file bytes, total bytes, path depth, and finding output are capped; no package install, subprocess, shell, browser, MCP execution, archive expansion, or third-party network execution is part of intake. Binary/symlink/oversize/incomplete inventory, unknown license state, malformed manifests, and finding truncation force explicit partial coverage and cannot yield a clean accept. Nested \`.github/workflows\`, hooks, MCP configuration, and executable surfaces are detected as risk-bearing content.\n\nRisk findings use bounded rule identifiers, severity, file/content hashes, and stable fingerprints rather than storing matched raw snippets. Critical prompt-override, exfiltration, download-and-execute, or privilege-escalation patterns reject. High-risk credential collection, destructive mutation, self-promotion, policy/memory poisoning, MCP authority, hooks/workflows, or executable surfaces quarantine. Static M14 analysis proves only its bounded rules and completeness contract; it is not a universal proof that third-party code is safe.\n\nOnly \`COMPLETE + ACCEPT\` can be handed to M10 as a \`community\` candidate with \`requiredTools=[]\`. M14 cannot activate a skill, register M3 tools, mint grants/approvals, resolve credentials, change routing/budgets, or create completion evidence. M10 independent verification and trusted promotion remain mandatory. Normal PR CI \`33858888408\` passed 290/290 tests with Biome, strict TypeScript, and secret-free Kimi dry smoke; dedicated regressions cover malformed manifests and nested workflow surfaces.\n\n`,
              'security M14 section',
            );
            write(path, source);
          }

          {
            const path = 'docs/milestones/M14_SKILL_INTAKE_FIREWALL.md';
            let source = read(path);
            source = replaceExact(
              source,
              'Status: **IMPLEMENTATION_IN_PROGRESS**. Updated: 2026-09-04.',
              'Status: **IMPLEMENTATION_VERIFIED — FINAL_SYNC_CI_PENDING**. Updated: 2026-09-04. Normal PR CI `33858888408` passed 290/290 tests, Biome, strict TypeScript, and the secret-free Kimi dry smoke; this synchronized exact head must still pass normal PR CI before merge.',
              'milestone status',
            );
            write(path, source);
          }

          {
            const path = 'HANDOVER.md';
            let source = read(path);
            source = replaceExact(
              source,
              '- Governance synchronization is now being applied to ROADMAP/ARCHITECTURE/SECURITY/M14 milestone; one final normal exact-head CI is required before PR #19 can be called merge-ready.',
              '- ROADMAP/ARCHITECTURE/SECURITY/M14 milestone/HANDOVER are synchronized to the verified implementation evidence; this synchronized head must pass one final normal exact-head CI before merge.',
              'handover governance state',
            );
            source = replaceExact(
              source,
              '- One additional bounded Kimi K3 A/B comparison remains planned only after M15 curated capability winners are actually integrated.',
              '- One additional bounded NVIDIA/Kimi K3 A/B comparison is user-authorized after M15 curated capability winners are integrated; it remains intentionally deferred until then.',
              'handover Kimi authorization',
            );
            const start = source.indexOf('## Next milestones');
            const end = source.indexOf('## Standing boundaries');
            if (start < 0 || end <= start) throw new Error('handover next/standing markers missing');
            const next = `## Next milestones\n\n1. Obtain one normal exact-head \`npm run verify\` on this synchronized M14 branch; fix any real failure without weakening a gate.\n2. If that run is green, mark PR #19 ready and merge it under the user's explicit current merge authorization.\n3. Create a fresh M15 branch from merged \`main\`: **Curated Capability Pack + offline improvement evaluation**. Deduplicate candidate procedures against Odin's canonical runtime, evaluate quality/safety/context-cost lift on held-out fixtures, and promote only measured winners through M10.\n4. After M15 winners are integrated and verified, run the already user-authorized bounded NVIDIA/Kimi K3 A/B comparison using sanitized evidence only. Do not infer broad model superiority from one fixture.\n5. Keep scheduler/triggers/background missions and permissioned MCP/Agent-Skills adapters as separate no-cost milestones before any public production deployment.\n\n`;
            source = source.slice(0, start) + next + source.slice(end);
            write(path, source);
          }
          NODE
          rm .github/workflows/m14-final-sync-once.yml
      - name: Commit synchronized governance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(m14): finalize synchronized governance"
          git push origin HEAD:agent/m14-skill-intake-firewall
