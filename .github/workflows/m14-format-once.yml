name: M14 one-shot formatter

on:
  push:
    branches:
      - agent/m14-skill-intake-firewall

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/m14-skill-intake-firewall
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply Biome fixes and remove helper
        run: |
          npm exec -- biome check --write --unsafe src/skill-intake/firewall.ts test/skill-intake/firewall.test.ts
          rm .github/workflows/m14-format-once.yml
      - name: Commit deterministic formatter result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "M14: apply deterministic Biome fixes"
          git push origin HEAD:agent/m14-skill-intake-firewall
