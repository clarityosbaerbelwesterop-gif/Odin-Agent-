name: M14 one-shot manifest hardening

on:
  push:
    branches:
      - agent/m14-skill-intake-firewall

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/m14-skill-intake-firewall
          fetch-depth: 0
      - name: Harden malformed manifest handling
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/skill-intake/firewall.ts';
          let source = fs.readFileSync(path, 'utf8');
          const call = '    parsedManifest = parseManifest(manifestContent);';
          if (!source.includes(call)) throw new Error('expected parseManifest call not found');
          source = source.replace(call, '    parsedManifest = safeParseManifest(manifestContent);');
          const marker = 'function parseManifest(content: string): ParsedManifest | null {';
          if (!source.includes(marker)) throw new Error('parseManifest marker not found');
          const helper = `function safeParseManifest(content: string): ParsedManifest | null {\n  try {\n    return parseManifest(content);\n  } catch (error) {\n    if (\n      error instanceof SkillIntakeError &&\n      (error.code === "INCOMPLETE" || error.code === "INVALID_INPUT")\n    ) {\n      return null;\n    }\n    throw error;\n  }\n}\n\n`;
          source = source.replace(marker, helper + marker);
          fs.writeFileSync(path, source);
          NODE
          rm .github/workflows/m14-hardening-once.yml
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(m14): quarantine malformed skill manifests"
          git push origin HEAD:agent/m14-skill-intake-firewall
