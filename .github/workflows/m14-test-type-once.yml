name: M14 one-shot strict test fix

on:
  push:
    branches:
      - agent/m14-skill-intake-firewall

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/m14-skill-intake-firewall
          fetch-depth: 0
      - name: Make candidate denial test type-safe
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'test/skill-intake/firewall.test.ts';
          let source = fs.readFileSync(path, 'utf8');
          const before = `  assert.throws(\n    () =>\n      skills.resolve(\n        result.candidate?.package.name ?? "missing",\n        result.candidate?.package.version,\n      ),\n    (error: unknown) => error instanceof SkillError && error.code === "DENIED",\n  );`;
          const after = `  const candidate = result.candidate;\n  assert.ok(candidate);\n  assert.throws(\n    () => skills.resolve(candidate.package.name, candidate.package.version),\n    (error: unknown) => error instanceof SkillError && error.code === "DENIED",\n  );`;
          if (!source.includes(before)) throw new Error('expected candidate denial test block not found');
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          NODE
          rm .github/workflows/m14-test-type-once.yml
      - name: Commit strict test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(m14): preserve candidate narrowing in denial assertion"
          git push origin HEAD:agent/m14-skill-intake-firewall
