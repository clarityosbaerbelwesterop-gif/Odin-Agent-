name: M15 Kimi A/B dry verify once

on:
  push:
    branches:
      - agent/m15-curated-capability-pack
    paths:
      - .github/workflows/m15-ab-dry-verify-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/m15-curated-capability-pack
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format M15 TypeScript surface
        run: npx biome check --write src/capability-packs test/capability-packs
      - name: Verify repository
        run: npm run verify
      - name: Build and exercise A/B runner without credentials
        run: |
          npm run build
          ODIN_M15_AB_RESULT_PATH=m15-ab-dry.json node scripts/live-kimi-capability-ab.mjs --dry-run
          node -e 'const x=require("./m15-ab-dry.json"); if(!x.configured || x.secretPresent !== false || x.caseIds.length !== 3) process.exit(1)'
      - name: Remove helper and commit verified formatting
        run: |
          git rm .github/workflows/m15-ab-dry-verify-once.yml
          rm -f m15-ab-dry.json
          git add src/capability-packs test/capability-packs scripts/live-kimi-capability-ab.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(m15): verify live A/B harness" || true
          git push origin HEAD:agent/m15-curated-capability-pack
