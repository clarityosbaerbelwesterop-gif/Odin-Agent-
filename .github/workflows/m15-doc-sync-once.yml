name: M15 documentation synchronization once

on:
  push:
    branches:
      - agent/m15-curated-capability-pack
    paths:
      - .github/workflows/m15-doc-sync-once.yml

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/m15-curated-capability-pack
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Synchronize governance docs
        run: node scripts/sync-m15-docs.mjs
      - name: Format repository
        run: npx biome check --write .
      - name: Verify synchronized repository
        run: npm run verify
      - name: Checkpoint synchronized governance
        run: |
          git rm .github/workflows/m15-doc-sync-once.yml scripts/sync-m15-docs.mjs
          git add ROADMAP.md ARCHITECTURE.md SECURITY.md HANDOVER.md docs/milestones/M15_CURATED_CAPABILITY_PACK.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(m15): synchronize verified curation evidence"
          git push origin HEAD:agent/m15-curated-capability-pack
