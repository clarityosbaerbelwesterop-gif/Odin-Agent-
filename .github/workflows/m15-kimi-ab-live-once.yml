name: M15 authorized post-merge Kimi coding A/B once

on:
  push:
    branches:
      - agent/m15-kimi-postmerge-evidence
    paths:
      - .github/workflows/m15-kimi-ab-live-once.yml

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/m15-kimi-postmerge-evidence
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify repository before any live provider request
        run: npm run verify
      - name: Build repository
        run: npm run build
      - name: Dry-run A/B harness without credentials
        run: |
          ODIN_M15_AB_RESULT_PATH=m15-ab-dry.json node scripts/live-kimi-capability-ab.mjs --dry-run
          node -e 'const x=require("./m15-ab-dry.json"); if(!x.configured || x.secretPresent !== false || x.caseIds.length !== 3 || x.maxProviderCalls !== 12) process.exit(1)'
          rm m15-ab-dry.json
      - name: Run bounded NVIDIA Kimi K3 A/B
        env:
          NV_API_KEY: ${{ secrets.NV_API_KEY }}
          ODIN_M15_AB_RESULT_PATH: docs/evals/m15-kimi-coding-ab.json
        run: |
          mkdir -p docs/evals
          node scripts/live-kimi-capability-ab.mjs
      - name: Validate sanitized A/B evidence
        env:
          NV_API_KEY: ${{ secrets.NV_API_KEY }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/evals/m15-kimi-coding-ab.json';
          const raw = fs.readFileSync(path, 'utf8');
          const result = JSON.parse(raw);
          if (!result.attestation || result.provider !== 'nvidia' || result.model !== 'moonshotai/kimi-k3') process.exit(1);
          if (result.providerCalls < 1 || result.providerCalls > 12) process.exit(1);
          if (!Array.isArray(result.results) || result.results.length !== 3) process.exit(1);
          if (raw.includes(process.env.NV_API_KEY)) process.exit(1);
          if (raw.includes('"instructions"')) process.exit(1);
          NODE
      - name: Remove one-shot workflow and commit sanitized evidence
        run: |
          git rm .github/workflows/m15-kimi-ab-live-once.yml
          git add docs/evals/m15-kimi-coding-ab.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(m15): record sanitized Kimi coding A/B evidence"
          git push origin HEAD:agent/m15-kimi-postmerge-evidence
