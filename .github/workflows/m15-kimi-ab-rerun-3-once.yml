name: M15 authorized Kimi coding A/B rerun 3 v2

on:
  push:
    branches:
      - agent/m15-kimi-rerun-3
    paths:
      - .github/workflows/m15-kimi-ab-rerun-3-once.yml

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/m15-kimi-rerun-3
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify repository before any live provider request
        run: npm run verify
      - name: Build repository
        run: npm run build
      - name: Dry-run v2 A/B harness without credentials
        run: |
          ODIN_M15_AB_RESULT_PATH=m15-ab-rerun-3-dry.json node scripts/live-kimi-capability-ab.mjs --dry-run
          node - <<'NODE'
          const result = require('./m15-ab-rerun-3-dry.json');
          const profile = result.executionProfile;
          if (!result.configured) process.exit(1);
          if (result.secretPresent !== false) process.exit(1);
          if (!Array.isArray(result.caseIds) || result.caseIds.length !== 3) process.exit(1);
          if (result.maxProviderCalls !== 12) process.exit(1);
          if (result.model !== 'moonshotai/kimi-k3' || result.provider !== 'nvidia') process.exit(1);
          if (!profile || profile.profileVersion !== 'm15-kimi-coding-ab-v2') process.exit(1);
          if (profile.acceptanceLatencyMs !== 180000 || profile.providerTimeoutMs !== 240000) process.exit(1);
          if (profile.reasoningEffort !== 'high' || profile.temperature !== 1) process.exit(1);
          if (profile.maxCallsPerArmCase !== 2 || profile.maxProviderCalls !== 12) process.exit(1);
          NODE
          rm m15-ab-rerun-3-dry.json
      - name: Run one authorized bounded NVIDIA Kimi K3 A/B with v2 profile
        env:
          NV_API_KEY: ${{ secrets.NV_API_KEY }}
          ODIN_M15_AB_RESULT_PATH: docs/evals/m15-kimi-coding-ab-rerun-3-v2.json
        run: |
          mkdir -p docs/evals
          node scripts/live-kimi-capability-ab.mjs
      - name: Validate sanitized v2 A/B evidence
        env:
          NV_API_KEY: ${{ secrets.NV_API_KEY }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/evals/m15-kimi-coding-ab-rerun-3-v2.json';
          const raw = fs.readFileSync(path, 'utf8');
          const result = JSON.parse(raw);
          const profile = result.executionProfile;
          if (!result.attestation || result.provider !== 'nvidia' || result.model !== 'moonshotai/kimi-k3') process.exit(1);
          if (!profile || profile.profileVersion !== 'm15-kimi-coding-ab-v2') process.exit(1);
          if (profile.acceptanceLatencyMs !== 180000 || profile.providerTimeoutMs !== 240000) process.exit(1);
          if (profile.reasoningEffort !== 'high' || profile.maxProviderCalls !== 12) process.exit(1);
          if (result.providerCalls < 1 || result.providerCalls > 12) process.exit(1);
          if (!Array.isArray(result.results) || result.results.length !== 3) process.exit(1);
          if (!result.summary || !['MEASURED','PARTIAL','INCONCLUSIVE'].includes(result.summary.status)) process.exit(1);
          if (!Number.isInteger(result.summary.completePairs) || !Number.isInteger(result.summary.incompletePairs)) process.exit(1);
          if (result.summary.completePairs + result.summary.incompletePairs !== 3) process.exit(1);
          if (result.summary.completePairs === 0) {
            if (result.summary.status !== 'INCONCLUSIVE') process.exit(1);
            if (result.summary.averageLiftBps !== null || result.summary.totalLiftBps !== null) process.exit(1);
          }
          if (raw.includes(process.env.NV_API_KEY)) process.exit(1);
          if (raw.includes('"instructions"')) process.exit(1);
          NODE
      - name: Remove one-shot workflow and commit sanitized v2 rerun evidence
        run: |
          git rm .github/workflows/m15-kimi-ab-rerun-3-once.yml
          git add docs/evals/m15-kimi-coding-ab-rerun-3-v2.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(m15): record sanitized Kimi A/B rerun-3 v2 evidence"
          git push origin HEAD:agent/m15-kimi-rerun-3
