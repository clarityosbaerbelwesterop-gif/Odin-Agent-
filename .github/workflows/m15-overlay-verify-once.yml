name: M15 candidate overlay verify once

on:
  push:
    branches:
      - agent/m15-curated-capability-pack
    paths:
      - .github/workflows/m15-overlay-verify-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/m15-curated-capability-pack
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format M15 surface
        run: npx biome check --write src/capability-packs test/capability-packs
      - name: Verify repository
        run: npm run verify
      - name: Remove helper and commit verified formatting
        run: |
          git rm .github/workflows/m15-overlay-verify-once.yml
          git add src/capability-packs test/capability-packs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(m15): verify candidate overlay" || true
          git push origin HEAD:agent/m15-curated-capability-pack
