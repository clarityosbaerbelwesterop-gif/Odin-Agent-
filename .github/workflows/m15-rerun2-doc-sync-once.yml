name: M15 rerun 2 governance sync once

on:
  push:
    branches:
      - agent/m15-kimi-rerun-2
    paths:
      - .github/workflows/m15-rerun2-doc-sync-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/m15-kimi-rerun-2
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply rerun-2 documentation synchronization
        run: node scripts/m15-rerun2-doc-sync.mjs
      - name: Verify synchronized repository
        run: npm run verify
      - name: Remove helper files and commit verified sync
        run: |
          git rm .github/workflows/m15-rerun2-doc-sync-once.yml scripts/m15-rerun2-doc-sync.mjs
          git add HANDOVER.md ROADMAP.md ARCHITECTURE.md SECURITY.md docs/milestones/M15_CURATED_CAPABILITY_PACK.md docs/evals/M15_KIMI_CODING_AB_RERUN_2_ANALYSIS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(m15): record rerun-2 timeout diagnosis and v2 profile"
          git push origin HEAD:agent/m15-kimi-rerun-2
