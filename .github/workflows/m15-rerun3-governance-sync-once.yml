name: M15 rerun-3 governance sync once

on:
  push:
    branches:
      - agent/m15-kimi-rerun-3
    paths:
      - .github/workflows/m15-rerun3-governance-sync-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/m15-kimi-rerun-3
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Append verified rerun-3 governance evidence
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const updates = new Map([
            ['HANDOVER.md', `

## M15 rerun-3 v2 evidence update — 2026-09-04

Third authorized NVIDIA/Kimi K3 live run \`33884808665\` completed under \`m15-kimi-coding-ab-v2\` after repository verify, build, and credential-free dry-run gates passed. It used 10/12 maximum provider calls. The immutable raw artifact remains \`docs/evals/m15-kimi-coding-ab-rerun-3-v2.json\` and its separate interpretation is \`docs/evals/M15_KIMI_CODING_AB_RERUN_3_V2_ANALYSIS.md\`.

Post-run review found that the old wrapper marked every thrown task failure incomplete. The hardened semantics distinguish ambiguous/infrastructure interruption from deterministic terminal task failure. Applied conservatively to the preserved diagnostics, rerun 3 is **PARTIAL**: two matched pairs are complete terminal failures at quality 0 vs 0 / lift 0, while \`canonical-user-id\` stays incomplete because the candidate ended in ambiguous \`provider_malformed_response\`. No M10 verification, activation, capability-pack inclusion, public benchmark claim, or AGI/Astra/Fable claim follows.

An offline exact-fixture control proves the three coding fixtures themselves are solvable through the same Odin M4 repository/quality path and M5 completion authority when supplied one valid structured plan. Normal PR CI \`33888060837\` passed 336/336 tests, Biome, strict TypeScript, and secret-free Kimi dry smoke; aggregate coverage was 89.99% lines / 77.41% branches / 95.89% functions. This shifts the next engineering priority toward live Kimi/provider structured-output and plan/repair reliability, not weaker quality gates or more candidate prompt text. PR #23 remains merge-approval-gated and no fourth live provider run is authorized.
`],
            ['ROADMAP.md', `

## M15 post-merge live evidence — rerun 3 v2

- [x] Third explicitly authorized NVIDIA/Kimi K3 comparison run \`33884808665\` executed under runtime-owned \`m15-kimi-coding-ab-v2\` after deterministic preflight gates.
- [x] Raw sanitized evidence preserved immutably; 10/12 provider calls used and no candidate authority/promotion created.
- [x] Live evidence semantics hardened so deterministic terminal task failures remain measurable while timeout/network/auth/rate-limit and ambiguous malformed-provider outcomes stay incomplete.
- [x] Rerun-3 preserved diagnostics re-evaluate conservatively to **PARTIAL**: 2/3 complete matched pairs, baseline 0 vs candidate 0, 0 bps lift on those pairs; one pair remains incomplete.
- [x] Exact three-fixture scripted control proves the M4/M5 harness can complete all three cases first-pass with valid structured plans; PR CI \`33888060837\` passed 336/336 tests.
- [ ] Establish live baseline reliability on a sufficiently complete matched set before reconsidering \`odin-coding-discipline\` verification or pack membership.
- [ ] Any fourth live provider comparison requires new explicit authorization and a new immutable evidence identity.

Rerun 3 does not establish a Kimi public benchmark, model-wide Odin lift, AGI/ASI, or equivalence/superiority to Astra/Fable. Current evidence prioritizes provider/model plan-and-repair reliability over additional skill promotion.
`],
            ['ARCHITECTURE.md', `

## M15 live-evidence terminal-outcome boundary

Rerun-3 review establishes a sharper distinction inside the live comparison harness. A deterministic terminal task failure (for example plan SHA mismatch, no-change repair, quality still failing after bounded repair, verification denial, or bounded context/budget exhaustion) is a completed negative measurement. A timeout, network/auth/rate-limit failure, unknown error, or ambiguous malformed provider response remains incomplete because outcome attribution is not safe. The runtime owns this allowlist; model output cannot declare itself measured.

Failed arms retain conservative token accounting and cannot pass M15 quality/safety/authority gates merely because they terminate early. Historical raw evidence is immutable; corrected semantics create a separate derived interpretation rather than rewriting the original artifact.

Third authorized Kimi run \`33884808665\` therefore derives to PARTIAL with 2/3 complete terminal-failure pairs and zero measured lift on those pairs. The exact-fixture offline control passed all three cases through M4/M5, so the next architecture focus is the live model/provider structured-output and plan/repair contract rather than bypassing M5 or relaxing fixture acceptance.
`],
            ['SECURITY.md', `

## M15 live failure-evidence hardening — rerun 3

Live candidate evaluation must not create survivorship bias by discarding deterministic failures. The runtime now treats only an explicit bounded set of terminal task failure codes as complete negative measurements. Transient or ambiguous provider failures—including timeout, network, authentication, quota/rate-limit, unavailable/unknown, and generic malformed-response categories—remain incomplete. This prevents both hiding a candidate failure and falsely blaming a model for an infrastructure/transport ambiguity.

Failed arms keep fail-closed token/quality accounting, raw exception text is not persisted, and the historical live artifact is never rewritten. Rerun-3 derived evidence is PARTIAL rather than promoted: two complete pairs are 0 vs 0 and one remains incomplete. The candidate receives no M10 verification, activation, tool authority, credential access, routing privilege, or pack membership. Normal CI \`33888060837\` also proves the three fixture patterns succeed through the same deterministic M4/M5 path with valid scripted structured output.
`],
            ['docs/milestones/M15_CURATED_CAPABILITY_PACK.md', `

## Third authorized Kimi comparison — v2

Run \`33884808665\` exercised the three matched coding cases with NVIDIA \`moonshotai/kimi-k3\` under \`m15-kimi-coding-ab-v2\`. All preflight gates passed and the live step used 10/12 maximum provider calls. The immutable raw result initially reports INCONCLUSIVE because that runner version marked all thrown errors incomplete.

Review identified an evidence-semantics defect: deterministic terminal task failures were being conflated with interrupted/ambiguous measurements. The repaired contract counts a narrow runtime-owned set of terminal failures as complete negative evidence while keeping transient/ambiguous provider categories incomplete. It does not classify generic \`provider_malformed_response\` as terminal because that category can represent transport or response-shape ambiguity.

Applied to preserved rerun-3 diagnostics, the defensible result is **PARTIAL** with 2/3 complete pairs. \`retry-429-surgical\` and \`safe-trim-existing-api\` are quality 0 vs 0 with 0 bps candidate lift; \`canonical-user-id\` remains incomplete due to candidate \`provider_malformed_response\`. Thus \`odin-coding-discipline@m15v1\` remains unverified/unactivated from live evidence.

A deterministic exact-fixture control then passed all three cases first-pass through Odin M4 tools/quality and M5 verification. Normal PR CI \`33888060837\` passed 336/336 tests with aggregate coverage 89.99% lines / 77.41% branches / 95.89% functions. The immediate bottleneck is therefore live Kimi/provider plan/repair reliability, not fixture solvability. A fourth live comparison requires new explicit authorization.
`],
          ]);
          for (const [path, addition] of updates) {
            const marker = addition.trim().split('\n')[0];
            const current = fs.readFileSync(path, 'utf8');
            if (!current.includes(marker)) fs.writeFileSync(path, current.replace(/\s*$/u, '') + addition);
          }
          NODE
      - name: Verify synchronized repository
        run: npm run verify
      - name: Commit verified governance sync
        run: |
          git rm .github/workflows/m15-rerun3-governance-sync-once.yml
          git add HANDOVER.md ROADMAP.md ARCHITECTURE.md SECURITY.md docs/milestones/M15_CURATED_CAPABILITY_PACK.md docs/evals/M15_KIMI_CODING_AB_RERUN_3_V2_ANALYSIS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(m15): synchronize rerun-3 v2 evidence"
          git push origin HEAD:agent/m15-kimi-rerun-3
