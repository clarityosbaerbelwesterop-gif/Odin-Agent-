name: M15 rerun-3 terminal outcome hardening once

on:
  push:
    branches:
      - agent/m15-kimi-rerun-3
    paths:
      - .github/workflows/m15-rerun3-terminal-outcome-hardening-once.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/m15-kimi-rerun-3
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Patch live runner terminal-outcome semantics
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/live-kimi-capability-ab.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const replacements = [
            [
              'import {\n  classifyLiveFailure,\n  summarizeLiveComparisons,\n} from "../dist/src/capability-packs/live-evidence.js";',
              'import {\n  classifyLiveFailure,\n  isTerminalLiveMeasurementFailure,\n  summarizeLiveComparisons,\n} from "../dist/src/capability-packs/live-evidence.js";',
            ],
            [
              '      measurementComplete: false,',
              '      measurementComplete: isTerminalLiveMeasurementFailure(diagnostic),',
            ],
            [
              '    totalTokens: run.measurementComplete\n      ? run.modelUsage.inputTokens + run.modelUsage.outputTokens\n      : 10_000_000,',
              '    totalTokens:\n      run.completed && run.measurementComplete\n        ? run.modelUsage.inputTokens + run.modelUsage.outputTokens\n        : 10_000_000,',
            ],
          ];
          for (const [from, to] of replacements) {
            const first = source.indexOf(from);
            if (first < 0) throw new Error(`Expected patch anchor missing: ${from.slice(0, 80)}`);
            if (source.indexOf(from, first + from.length) >= 0) {
              throw new Error(`Patch anchor is not unique: ${from.slice(0, 80)}`);
            }
            source = source.replace(from, to);
          }
          fs.writeFileSync(path, source);
          NODE
      - name: Verify repository
        run: npm run verify
      - name: Build repository
        run: npm run build
      - name: Verify credential-free A/B dry run
        run: |
          ODIN_M15_AB_RESULT_PATH=m15-rerun3-terminal-dry.json node scripts/live-kimi-capability-ab.mjs --dry-run
          node - <<'NODE'
          const result = require('./m15-rerun3-terminal-dry.json');
          if (!result.configured || result.secretPresent !== false) process.exit(1);
          if (result.executionProfile?.profileVersion !== 'm15-kimi-coding-ab-v2') process.exit(1);
          if (result.maxProviderCalls !== 12) process.exit(1);
          NODE
          rm m15-rerun3-terminal-dry.json
      - name: Commit verified offline hardening
        run: |
          git rm .github/workflows/m15-rerun3-terminal-outcome-hardening-once.yml
          git add src/capability-packs/live-evidence.ts test/capability-packs/live-evidence.test.ts scripts/live-kimi-capability-ab.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(m15): count bounded terminal failures as measured outcomes"
          git push origin HEAD:agent/m15-kimi-rerun-3
