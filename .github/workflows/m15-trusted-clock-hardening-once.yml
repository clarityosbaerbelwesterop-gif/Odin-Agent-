name: M15 trusted curation clock hardening once

on:
  push:
    branches:
      - agent/m15-curated-capability-pack
    paths:
      - .github/workflows/m15-trusted-clock-hardening-once.yml

permissions:
  contents: write

jobs:
  harden-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/m15-curated-capability-pack
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Harden M15 curation authority and evidence freshness
        run: |
          python3 - <<'PY'
          from pathlib import Path

          curator = Path('src/capability-packs/curator.ts')
          text = curator.read_text()

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              return source.replace(old, new, 1)

          text = replace_once(
              text,
              'import type { SkillVerificationProducer } from "../skills/types.js";\n',
              'import type { SkillVerificationProducer } from "../skills/types.js";\nimport { M15_ADDITIVE_PROCEDURE_KEYS } from "./procedures.js";\n',
              'procedure catalog import',
          )
          text = replace_once(
              text,
              '  readonly #policy: CapabilityCurationPolicy;\n',
              '  readonly #policy: CapabilityCurationPolicy;\n  readonly #clock: () => string;\n',
              'clock field',
          )
          text = replace_once(
              text,
              '    policy: Partial<CapabilityCurationPolicy> = {},\n  ) {',
              '    policy: Partial<CapabilityCurationPolicy> = {},\n    clock: () => string = () => new Date().toISOString(),\n  ) {',
              'constructor clock parameter',
          )
          text = replace_once(
              text,
              '    this.#policy = normalizePolicy({ ...DEFAULT_POLICY, ...policy });\n',
              '    this.#policy = normalizePolicy({ ...DEFAULT_POLICY, ...policy });\n    this.#clock = clock;\n',
              'clock assignment',
          )
          text = replace_once(
              text,
              '    const request = normalizeRequest(value, this.#policy);\n',
              '''    const request = normalizeRequest(value, this.#policy);\n    const trustedObservedAt = canonicalTimestamp(this.#clock(), "curation runtime clock");\n    if (Date.parse(request.observedAt) > Date.parse(trustedObservedAt)) {\n      throw new CapabilityCurationError(\n        "INVALID_INPUT",\n        "Curation observedAt cannot be future-dated relative to the runtime clock.",\n      );\n    }\n    const allowedProcedureKeys = new Set<string>([\n      ...this.#canonicalProcedureKeys,\n      ...M15_ADDITIVE_PROCEDURE_KEYS[request.domain],\n    ]);\n    if (request.procedureKeys.some((key) => !allowedProcedureKeys.has(key))) {\n      throw new CapabilityCurationError(\n        "DENIED",\n        "Curation procedure keys must come from the runtime-owned domain catalog.",\n      );\n    }\n''',
              'trusted timestamp and procedure validation',
          )
          text = replace_once(
              text,
              '    const evaluationRequest: CapabilityEvaluationRequest = Object.freeze({\n      ...request,\n      novelProcedureKeys,',
              '    const evaluationRequest: CapabilityEvaluationRequest = Object.freeze({\n      ...request,\n      observedAt: trustedObservedAt,\n      novelProcedureKeys,',
              'trusted evaluation request timestamp',
          )
          text = replace_once(
              text,
              '    validateAttestation(attestation, request, record.package.provenance.observedAt, this.#policy);',
              '    validateAttestation(\n      attestation,\n      evaluationRequest,\n      record.package.provenance.observedAt,\n      this.#policy,\n    );',
              'trusted attestation validation',
          )
          curator.write_text(text)

          test_file = Path('test/capability-packs/curator.test.ts')
          text = test_file.read_text()
          occurrences = text.count('new CapabilityCurator(')
          if occurrences < 5:
              raise SystemExit(f'curator test constructor count unexpectedly low: {occurrences}')
          text = text.replace('new CapabilityCurator(', 'makeCurator(')
          marker = '''class FixtureAuthority {\n  calls = 0;\n  readonly #factory: (request: CapabilityEvaluationRequest) => unknown;\n\n  constructor(factory: (request: CapabilityEvaluationRequest) => unknown) {\n    this.#factory = factory;\n  }\n\n  async evaluate(request: CapabilityEvaluationRequest): Promise<unknown> {\n    this.calls += 1;\n    return this.#factory(request);\n  }\n}\n'''
          helper = marker + '''\nfunction makeCurator(\n  skills: SkillRegistry,\n  authority: FixtureAuthority,\n  canonicalProcedureKeys: readonly string[],\n  policy: ConstructorParameters<typeof CapabilityCurator>[3] = {},\n) {\n  return new CapabilityCurator(\n    skills,\n    authority,\n    canonicalProcedureKeys,\n    policy,\n    () => T1,\n  );\n}\n'''
          if text.count(marker) != 1:
              raise SystemExit('FixtureAuthority marker mismatch')
          text = text.replace(marker, helper, 1)
          regressions = '''\n\ntest("trusted clock prevents caller timestamps from rescuing stale evaluation evidence", async () => {\n  const skills = new SkillRegistry();\n  const candidate = registerCandidate(skills);\n  const authority = new FixtureAuthority((value) => attestation(value, { evaluatedAt: T0 }));\n  const curator = makeCurator(skills, authority, ["verification.evidence-binding"], {\n    maxEvidenceAgeMs: 1_000,\n  });\n\n  await assert.rejects(\n    () => curator.curate(request(candidate, { observedAt: T0 })),\n    (error: unknown) =>\n      error instanceof CapabilityCurationError && error.code === "EVALUATION_FAILED",\n  );\n  assert.equal(authority.calls, 1);\n  assert.equal(\n    skills.resolveForReview(candidate.package.name, candidate.package.version).lifecycle,\n    "CANDIDATE",\n  );\n\n  await assert.rejects(\n    () =>\n      curator.curate(\n        request(candidate, { observedAt: "2026-09-04T11:00:00.000Z" }),\n      ),\n    (error: unknown) =>\n      error instanceof CapabilityCurationError && error.code === "INVALID_INPUT",\n  );\n  assert.equal(authority.calls, 1);\n});\n\ntest("candidate cannot invent novel procedure keys outside the runtime-owned domain catalog", async () => {\n  const skills = new SkillRegistry();\n  const candidate = registerCandidate(skills);\n  const authority = new FixtureAuthority((value) => attestation(value));\n  const curator = makeCurator(skills, authority, ["verification.evidence-binding"]);\n\n  await assert.rejects(\n    () =>\n      curator.curate(\n        request(candidate, {\n          procedureKeys: [\n            "research.falsifiable-hypotheses",\n            "research.self-declared-novelty",\n          ],\n        }),\n      ),\n    (error: unknown) =>\n      error instanceof CapabilityCurationError && error.code === "DENIED",\n  );\n  assert.equal(authority.calls, 0);\n  assert.equal(\n    skills.resolveForReview(candidate.package.name, candidate.package.version).lifecycle,\n    "CANDIDATE",\n  );\n});\n'''
          if 'trusted clock prevents caller timestamps' in text or 'self-declared-novelty' in text:
              raise SystemExit('curation boundary regressions already present')
          test_file.write_text(text.rstrip() + regressions + '\n')

          registry_test = Path('test/capability-packs/registry.test.ts')
          text = registry_test.read_text()
          occurrences = text.count('new CapabilityCurator(')
          if occurrences < 2:
              raise SystemExit(f'registry test constructor count unexpectedly low: {occurrences}')
          text = text.replace('new CapabilityCurator(', 'makeCurator(')
          class_end = '''  }\n}\n\nasync function measuredSecuritySkill()'''
          helper = '''  }\n}\n\nfunction makeCurator(\n  skills: SkillRegistry,\n  authority: PassingAuthority,\n  canonicalProcedureKeys: readonly string[],\n) {\n  return new CapabilityCurator(\n    skills,\n    authority,\n    canonicalProcedureKeys,\n    {},\n    () => T1,\n  );\n}\n\nasync function measuredSecuritySkill()'''
          if text.count(class_end) != 1:
              raise SystemExit('PassingAuthority class end mismatch')
          text = text.replace(class_end, helper, 1)
          registry_test.write_text(text)
          PY
      - name: Make live A/B failures observable and fail closed
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/live-kimi-capability-ab.mjs')
          text = path.read_text()
          start = text.index('async function runArm(')
          end = text.index('\nfunction measured(run)', start)
          replacement = '''async function runArm({ arm, baseProvider, caseSpec, candidate, observedAt }) {\n  const workspace = new FixtureWorkspace(caseSpec.files);\n  const quality = new CaseQualityRunner(workspace, caseSpec);\n  const audit = new InMemoryToolAuditSink();\n  const policy = new InMemoryCapabilityPolicy();\n  const tools = new ToolRuntime(\n    new ToolRegistry(createRepositoryToolRegistrations({ quality, workspace })),\n    policy,\n    audit,\n    () => observedAt,\n  );\n  const mission = new MissionRuntime(new InMemoryEventStore(), () => observedAt);\n  const provider =\n    arm === "candidate"\n      ? new CandidateEvaluationProvider(baseProvider, {\n          candidateContentHash: candidate.contentHash,\n          instructions: candidate.instructions,\n          sourceReference: candidate.provenance.reference,\n        })\n      : baseProvider;\n  const coding = new CodingOrchestrator({\n    audit,\n    clock: () => observedAt,\n    grants: policy,\n    mission,\n    model: MODEL,\n    provider,\n    quality,\n    tools,\n    verification: new IndependentVerificationEngine({ maxEvidenceAgeMs: 60_000 }),\n  });\n  const started = performance.now();\n  const beforeCalls = baseProvider.callCounter.value;\n  try {\n    const result = await coding.start({\n      budgetLimits: {\n        attempts: 40,\n        costMicros: 0,\n        inputTokens: 40_000,\n        outputTokens: 20_000,\n        toolCalls: 40,\n      },\n      missionId: `m15-kimi-${arm}-${caseSpec.id}-${Date.now()}`,\n      objective: caseSpec.objective,\n    });\n    const latencyMs = Math.round(performance.now() - started);\n    if (result.status !== "completed") throw new Error("A/B fixture unexpectedly interrupted.");\n    const calls = baseProvider.callCounter.value - beforeCalls;\n    if (calls > MAX_CALLS_PER_ARM_CASE) throw new Error("Per-arm provider-call ceiling exceeded.");\n    const finalContent = workspace.content(caseSpec.targetPath);\n    const run = {\n      changedFiles: result.report.changedFiles,\n      completed: result.report.state === "COMPLETED",\n      errorClass: null,\n      finalContent,\n      firstPass: result.report.quality.firstFailureSignature === null,\n      latencyMs,\n      measurementComplete: true,\n      modelUsage: result.report.modelUsage,\n      providerCalls: calls,\n      repaired: result.report.quality.firstFailureSignature !== null,\n      verification: result.report.verification.outcome,\n    };\n    return { ...run, qualityBps: scoreCase(caseSpec, run) };\n  } catch (error) {\n    const latencyMs = Math.round(performance.now() - started);\n    const calls = baseProvider.callCounter.value - beforeCalls;\n    const run = {\n      changedFiles: [],\n      completed: false,\n      errorClass: error instanceof Error ? error.name : "UnknownError",\n      finalContent: workspace.content(caseSpec.targetPath),\n      firstPass: false,\n      latencyMs,\n      measurementComplete: false,\n      modelUsage: { inputTokens: 0, outputTokens: 0 },\n      providerCalls: calls,\n      repaired: false,\n      verification: "FAIL",\n    };\n    return { ...run, qualityBps: 0 };\n  }\n}\n'''
          text = text[:start] + replacement + text[end:]
          old = '''    totalTokens: run.modelUsage.inputTokens + run.modelUsage.outputTokens,\n'''
          new = '''    totalTokens: run.measurementComplete\n      ? run.modelUsage.inputTokens + run.modelUsage.outputTokens\n      : 10_000_000,\n'''
          if text.count(old) != 1:
              raise SystemExit('measurement token accounting marker mismatch')
          text = text.replace(old, new, 1)
          old = '''          latencyMs: baseline.latencyMs,\n          providerCalls: baseline.providerCalls,\n          totalTokens: measured(baseline).totalTokens,\n'''
          new = '''          errorClass: baseline.errorClass,\n          latencyMs: baseline.latencyMs,\n          measurementComplete: baseline.measurementComplete,\n          providerCalls: baseline.providerCalls,\n          totalTokens: measured(baseline).totalTokens,\n'''
          if text.count(old) != 1:
              raise SystemExit('baseline sanitized marker mismatch')
          text = text.replace(old, new, 1)
          old = '''          latencyMs: candidateRun.latencyMs,\n          providerCalls: candidateRun.providerCalls,\n          totalTokens: measured(candidateRun).totalTokens,\n'''
          new = '''          errorClass: candidateRun.errorClass,\n          latencyMs: candidateRun.latencyMs,\n          measurementComplete: candidateRun.measurementComplete,\n          providerCalls: candidateRun.providerCalls,\n          totalTokens: measured(candidateRun).totalTokens,\n'''
          if text.count(old) != 1:
              raise SystemExit('candidate sanitized marker mismatch')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Format changed M15 surface
        run: npx biome check --write src/capability-packs/curator.ts test/capability-packs/curator.test.ts test/capability-packs/registry.test.ts scripts/live-kimi-capability-ab.mjs
      - name: Verify complete repository
        run: npm run verify
      - name: Remove helper and checkpoint verified hardening
        run: |
          git rm .github/workflows/m15-trusted-clock-hardening-once.yml
          git add src/capability-packs/curator.ts test/capability-packs/curator.test.ts test/capability-packs/registry.test.ts scripts/live-kimi-capability-ab.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(m15): harden curation authority and A/B failure evidence"
          git push origin HEAD:agent/m15-curated-capability-pack
