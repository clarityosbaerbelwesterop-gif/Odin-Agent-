name: M16 fenced structured output hardening once

on:
  push:
    branches:
      - agent/m16-live-reliability-efficiency
    paths:
      - .github/workflows/m16-fenced-json-hardening-once.yml

permissions:
  contents: write

jobs:
  harden-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/m16-live-reliability-efficiency
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Harden exact fenced structured output parsing
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const sourcePath = 'src/providers/openai-compatible.ts';
          let source = fs.readFileSync(sourcePath, 'utf8');
          const oldParse = '  return parseJsonValue(provider, text, "Structured output");';
          const newParse = '  return parseJsonValue(provider, unwrapExactJsonFence(text), "Structured output");';
          if (!source.includes(oldParse)) throw new Error('Expected structured-output parser anchor missing.');
          source = source.replace(oldParse, newParse);
          const anchor = '\nfunction validateExtraHeaders(\n';
          const helper = `
function unwrapExactJsonFence(text: string): string {
  const trimmed = text.trim();
  const match = /^\`\`\`(?:json)?[ \\t]*\\r?\\n([\\s\\S]*?)\\r?\\n\`\`\`$/u.exec(trimmed);
  return match?.[1]?.trim() ?? text;
}
`;
          if (!source.includes(anchor)) throw new Error('Expected helper insertion anchor missing.');
          source = source.replace(anchor, `${helper}${anchor}`);
          fs.writeFileSync(sourcePath, source);

          const testPath = 'test/providers/compatible.test.ts';
          let tests = fs.readFileSync(testPath, 'utf8');
          const marker = 'compatible strict structured output accepts one exact JSON markdown fence';
          if (!tests.includes(marker)) {
            tests += `

test("compatible strict structured output accepts one exact JSON markdown fence", async () => {
  const transport = new MockTransport(() =>
    jsonResponse({
      choices: [
        {
          finish_reason: "stop",
          index: 0,
          message: { content: "\`\`\`json\\n{\\\"ok\\\":true}\\n\`\`\`", role: "assistant" },
        },
      ],
      id: "chat_fenced",
      model: "test-model",
      usage: { completion_tokens: 8, prompt_tokens: 8, total_tokens: 16 },
    }),
  );
  const provider = new NvidiaProvider({
    capabilities: new CapabilityRegistry([capabilityProfile("nvidia")]),
    credential: () => "nvidia-key",
    transport,
  });
  const response = await provider.generate({
    ...basicRequest(),
    responseFormat: {
      name: "strict_object",
      schema: {
        additionalProperties: false,
        properties: { ok: { type: "boolean" } },
        required: ["ok"],
        type: "object",
      },
      strict: true,
      type: "json_schema",
    },
  });
  assert.deepEqual(response.structuredOutput, { ok: true });
});

test("compatible structured output never extracts fenced JSON from surrounding prose", async () => {
  const transport = new MockTransport(() =>
    jsonResponse({
      choices: [
        {
          finish_reason: "stop",
          index: 0,
          message: { content: "Result:\\n\`\`\`json\\n{\\\"ok\\\":true}\\n\`\`\`", role: "assistant" },
        },
      ],
      id: "chat_prose_fenced",
      model: "test-model",
      usage: { completion_tokens: 9, prompt_tokens: 8, total_tokens: 17 },
    }),
  );
  const provider = new NvidiaProvider({
    capabilities: new CapabilityRegistry([capabilityProfile("nvidia")]),
    credential: () => "nvidia-key",
    transport,
  });
  await assert.rejects(
    provider.generate({
      ...basicRequest(),
      responseFormat: {
        name: "strict_object",
        schema: {
          additionalProperties: false,
          properties: { ok: { type: "boolean" } },
          required: ["ok"],
          type: "object",
        },
        strict: true,
        type: "json_schema",
      },
    }),
    (error: unknown) => {
      assert.ok(error instanceof ProviderError);
      assert.equal(error.category, "malformed_response");
      return true;
    },
  );
});
`;
          }
          fs.writeFileSync(testPath, tests);
          NODE
          npx biome check --write src/providers/openai-compatible.ts test/providers/compatible.test.ts
      - name: Verify repository
        run: npm run verify
      - name: Commit verified hardening
        run: |
          git rm .github/workflows/m16-fenced-json-hardening-once.yml
          git add src/providers/openai-compatible.ts test/providers/compatible.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(m16): accept only exact fenced structured JSON"
          git push origin HEAD:agent/m16-live-reliability-efficiency
