name: M16 fenced structured output hardening v2 once

on:
  push:
    branches:
      - agent/m16-live-reliability-efficiency
    paths:
      - .github/workflows/m16-fenced-json-hardening-v2-once.yml

permissions:
  contents: write

jobs:
  harden-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/m16-live-reliability-efficiency
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply exact fenced structured-output hardening
        run: node scripts/m16-fenced-json-hardening.mjs
      - name: Format touched files
        run: npx biome check --write src/providers/openai-compatible.ts test/providers/compatible.test.ts
      - name: Verify repository
        run: npm run verify
      - name: Commit verified hardening
        run: |
          git rm .github/workflows/m16-fenced-json-hardening-v2-once.yml scripts/m16-fenced-json-hardening.mjs
          git add src/providers/openai-compatible.ts test/providers/compatible.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(m16): accept only exact fenced structured JSON"
          git push origin HEAD:agent/m16-live-reliability-efficiency
