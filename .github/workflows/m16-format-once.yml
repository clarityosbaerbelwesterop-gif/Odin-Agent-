name: M16 format grounded coding once

on:
  push:
    branches:
      - agent/m16-live-reliability-efficiency
    paths:
      - .github/workflows/m16-format-once.yml

permissions:
  contents: write

jobs:
  format-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/m16-live-reliability-efficiency
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply repository formatter
        run: npx biome check --write src/runtime/grounded-coding-provider.ts test/runtime/grounded-coding-provider.test.ts
      - name: Verify formatted tranche
        run: npm run verify
      - name: Commit verified formatting
        run: |
          git rm .github/workflows/m16-format-once.yml
          git add src/runtime/grounded-coding-provider.ts test/runtime/grounded-coding-provider.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(m16): format grounded coding tranche"
          git push origin HEAD:agent/m16-live-reliability-efficiency
