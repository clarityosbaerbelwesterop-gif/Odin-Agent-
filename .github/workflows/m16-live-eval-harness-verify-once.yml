name: M16 live evaluation harness verify once

on:
  push:
    branches:
      - agent/m16-live-evals
    paths:
      - .github/workflows/m16-live-eval-harness-verify-once.yml

permissions:
  contents: write

jobs:
  verify-harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/m16-live-evals
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format evaluator
        run: npx biome check --write scripts/live-m16-grounded-eval.mjs
      - name: Verify repository
        run: npm run verify
      - name: Build repository
        run: npm run build
      - name: Dry-run output suite
        run: ODIN_M16_RESULT_PATH=/tmp/m16-output-dry.json node scripts/live-m16-grounded-eval.mjs --dry-run --suite=output
      - name: Dry-run strength suite
        run: ODIN_M16_RESULT_PATH=/tmp/m16-strength-dry.json node scripts/live-m16-grounded-eval.mjs --dry-run --suite=strength
      - name: Commit verified harness
        run: |
          git rm .github/workflows/m16-live-eval-harness-verify-once.yml
          git add scripts/live-m16-grounded-eval.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(m16): verify grounded live evaluation harness"
          git push origin HEAD:agent/m16-live-evals
