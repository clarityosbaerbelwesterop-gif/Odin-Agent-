name: M16 run4 diagnostics hardening v2 once

on:
  push:
    branches:
      - agent/m16-run4-diagnostics
    paths:
      - .github/workflows/m16-run4-diagnostics-v2-once.yml

permissions:
  contents: write

jobs:
  harden-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/m16-run4-diagnostics
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply diagnostics patch
        run: node scripts/m16-run4-diagnostics-patch.mjs
      - name: Format touched code
        run: npx biome check --write src/capability-packs/live-evidence.ts src/runtime/grounded-coding-provider.ts test/capability-packs/live-evidence.test.ts test/runtime/grounded-coding-provider.test.ts scripts/live-m16-grounded-eval.mjs
      - name: Verify repository
        run: npm run verify
      - name: Build repository
        run: npm run build
      - name: Dry-run both M16 suites
        run: |
          ODIN_M16_RESULT_PATH=/tmp/m16-output-dry.json node scripts/live-m16-grounded-eval.mjs --dry-run --suite=output
          ODIN_M16_RESULT_PATH=/tmp/m16-strength-dry.json node scripts/live-m16-grounded-eval.mjs --dry-run --suite=strength
      - name: Commit verified diagnostics
        run: |
          git rm .github/workflows/m16-run4-diagnostics-v2-once.yml scripts/m16-run4-diagnostics-patch.mjs
          git add src/capability-packs/live-evidence.ts src/runtime/grounded-coding-provider.ts test/capability-packs/live-evidence.test.ts test/runtime/grounded-coding-provider.test.ts scripts/live-m16-grounded-eval.mjs docs/evals/M16_KIMI_GROUNDED_OUTPUT_RUN_4_ANALYSIS.md HANDOVER.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(m16): classify grounded failures before strength run"
          git push origin HEAD:agent/m16-run4-diagnostics
