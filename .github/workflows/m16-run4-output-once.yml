name: M16 authorized Kimi output run 4 once

on:
  push:
    branches:
      - agent/m16-run4-output
    paths:
      - .github/workflows/m16-run4-output-once.yml

permissions:
  contents: write

jobs:
  run4-output:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/m16-run4-output
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify repository before provider access
        run: npm run verify
      - name: Build repository before provider access
        run: npm run build
      - name: Credential-free output dry run
        run: ODIN_M16_RESULT_PATH=/tmp/m16-run4-output-dry.json node scripts/live-m16-grounded-eval.mjs --dry-run --suite=output
      - name: Authorized NVIDIA Kimi K3 output and efficiency evaluation
        env:
          NV_API_KEY: ${{ secrets.NV_API_KEY }}
          ODIN_M16_RESULT_PATH: docs/evals/m16-kimi-grounded-output-run-4.json
        run: node scripts/live-m16-grounded-eval.mjs --suite=output
      - name: Validate sanitized immutable evidence
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/evals/m16-kimi-grounded-output-run-4.json';
          const evidence = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (evidence.provider !== 'nvidia') throw new Error('Unexpected provider identity.');
          if (evidence.model !== 'moonshotai/kimi-k3') throw new Error('Unexpected model identity.');
          if (evidence.suite !== 'output') throw new Error('Unexpected suite identity.');
          if (!Array.isArray(evidence.results) || evidence.results.length !== 3) throw new Error('Unexpected evidence case count.');
          if (typeof evidence.summary !== 'object' || evidence.summary === null) throw new Error('Missing summary.');
          const raw = fs.readFileSync(path, 'utf8');
          if (/nvapi-[a-z0-9_-]{8,}/iu.test(raw) || /authorization\s*:/iu.test(raw)) {
            throw new Error('Evidence contains secret-like material.');
          }
          console.log(JSON.stringify({
            provider: evidence.provider,
            model: evidence.model,
            suite: evidence.suite,
            providerCalls: evidence.providerCalls,
            status: evidence.summary.status,
            completePairs: evidence.summary.completePairs,
          }));
          NODE
      - name: Preserve run-4 evidence and remove one-shot workflow
        run: |
          git rm .github/workflows/m16-run4-output-once.yml
          git add docs/evals/m16-kimi-grounded-output-run-4.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "eval(m16): preserve Kimi output run 4 evidence"
          git push origin HEAD:agent/m16-run4-output
