name: M20 autonomy format and verify once

on:
  push:
    branches:
      - agent/m20-m22-autonomy-router-frontier-evals
    paths:
      - src/autonomy/**
      - test/autonomy/**
      - .github/workflows/m20-format-verify-once.yml

permissions:
  contents: write

jobs:
  verify-m20:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/m20-m22-autonomy-router-frontier-evals
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx biome check --write src/autonomy test/autonomy
      - run: npm run verify
      - run: npm run build
      - name: Commit verified formatting and remove helper
        run: |
          git rm -f .github/workflows/m20-format-verify-once.yml
          git add src/autonomy test/autonomy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(m20): format verified autonomy checkpoint"
          git push origin HEAD:agent/m20-m22-autonomy-router-frontier-evals
