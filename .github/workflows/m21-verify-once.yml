name: M21 failure-aware routing verify once

on:
  push:
    branches:
      - agent/m20-m22-autonomy-router-frontier-evals
    paths:
      - src/routing/**
      - test/routing/**
      - .github/workflows/m21-verify-once.yml

permissions:
  contents: write

jobs:
  verify-m21:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/m20-m22-autonomy-router-frontier-evals
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx biome check --write src/routing/multi-model.ts src/routing/index.ts test/routing/multi-model.test.ts
      - run: npm run verify
      - run: npm run build
      - name: Commit verified M21 checkpoint and remove helper
        run: |
          git rm -f .github/workflows/m21-verify-once.yml
          git add src/routing/multi-model.ts src/routing/index.ts test/routing/multi-model.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(m21): checkpoint verified failure-aware routing"
          git push origin HEAD:agent/m20-m22-autonomy-router-frontier-evals
