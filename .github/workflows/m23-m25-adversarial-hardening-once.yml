name: M23-M25 adversarial hardening once

on:
  push:
    branches:
      - agent/m23-m25-skill-os-memory-tools
    paths:
      - .github/workflows/m23-m25-adversarial-hardening-once.yml

permissions:
  contents: write

jobs:
  harden-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/m23-m25-skill-os-memory-tools
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply bounded adversarial hardening
        run: node scripts/m23-m25-adversarial-hardening-once.mjs
      - name: Normalize touched code and tests
        run: npx biome check --write src/capability-packs/registry.ts src/skill-os src/memory/advanced.ts test/skill-os/runtime.test.ts test/memory/advanced.test.ts
      - name: Verify repository
        run: npm run verify
      - name: Build repository
        run: npm run build
      - name: Remove helper and commit verified hardening
        run: |
          git rm -f scripts/m23-m25-adversarial-hardening-once.mjs .github/workflows/m23-m25-adversarial-hardening-once.yml
          git add src/capability-packs/registry.ts src/skill-os src/memory/advanced.ts test/skill-os/runtime.test.ts test/memory/advanced.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(m23-m25): harden scope freshness and memory authority"
          git push origin HEAD:agent/m23-m25-skill-os-memory-tools
