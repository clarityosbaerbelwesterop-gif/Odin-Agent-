name: M24 format once

on:
  push:
    branches:
      - agent/m23-m25-skill-os-memory-tools
    paths:
      - .github/workflows/m24-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/m23-m25-skill-os-memory-tools
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format M24 files
        run: npx biome check --write src/memory/advanced.ts src/memory/index.ts test/memory/advanced.test.ts
      - name: Remove helper and commit formatting
        run: |
          git rm -f .github/workflows/m24-format-once.yml
          git add src/memory/advanced.ts src/memory/index.ts test/memory/advanced.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(m24): normalize advanced memory tranche"
          git push origin HEAD:agent/m23-m25-skill-os-memory-tools
