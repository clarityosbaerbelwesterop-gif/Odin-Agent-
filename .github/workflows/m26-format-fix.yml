name: M26 format repair

on:
  push:
    branches:
      - agent/m26-m28-production-sandbox-hosted-mobile

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/m26-m28-production-sandbox-hosted-mobile
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format production sandbox
        run: npx biome check --write src/sandbox/production.ts
      - name: Verify M26 repository
        run: npm run verify
      - name: Build repository
        run: npm run build
      - name: Commit verified formatting repair
        run: |
          rm .github/workflows/m26-format-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sandbox/production.ts .github/workflows/m26-format-fix.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(m26): format verified production sandbox"
          git push origin HEAD:agent/m26-m28-production-sandbox-hosted-mobile
