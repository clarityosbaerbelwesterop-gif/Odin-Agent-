name: M28 mobile experience repair

on:
  push:
    branches:
      - agent/m26-m28-production-sandbox-hosted-mobile

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/m26-m28-production-sandbox-hosted-mobile
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Repair responsive accessibility semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('web/mobile-reference.html')
          text = path.read_text()
          old = '<div class="progress" aria-label="Mission progress"><span></span></div>'
          new = '<div class="progress" role="progressbar" aria-label="Mission progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="62"><span></span></div>'
          if old not in text:
              raise SystemExit('progress anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply repository formatting
        run: npx biome check --write src/mobile/experience.ts test/mobile/experience.test.ts web/mobile-reference.html web/mobile-reference.js
      - name: Verify repository
        run: npm run verify
      - name: Build repository
        run: npm run build
      - name: Commit verified M28 repair
        run: |
          rm .github/workflows/m28-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mobile/experience.ts test/mobile/experience.test.ts web/mobile-reference.html web/mobile-reference.js .github/workflows/m28-repair.yml
          git commit -m "fix(m28): verify mobile experience contracts"
          git push origin HEAD:agent/m26-m28-production-sandbox-hosted-mobile
