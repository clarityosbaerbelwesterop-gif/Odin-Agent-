name: M8 checkpoint errorfix helper

on:
  push:
    branches:
      - agent/m8-durable-missions

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Normalize checkpoint corruption at durable boundary
        run: |
          perl -0pi -e 's/    restoreMissionCheckpoint\(parsed, missionId\);\n    this\.#assertCheckpointMatchesEvents\(parsed\);/    try {\n      restoreMissionCheckpoint(parsed, missionId);\n      this.#assertCheckpointMatchesEvents(parsed);\n    } catch (error) {\n      if (error instanceof DurableStoreCorruptionError) throw error;\n      throw new DurableStoreCorruptionError("Checkpoint failed durable integrity validation.");\n    }/g' src/durable/store.ts
          grep -q 'Checkpoint failed durable integrity validation' src/durable/store.ts
      - run: npx biome check --write src/durable/store.ts
      - name: Commit fix and remove helper
        run: |
          rm .github/workflows/m8-checkpoint-errorfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/durable/store.ts .github/workflows/m8-checkpoint-errorfix.yml
          git commit -m "fix(m8): normalize checkpoint corruption errors"
          git push origin HEAD:agent/m8-durable-missions
