name: M8 format helper

on:
  push:
    branches:
      - agent/m8-durable-missions

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx biome check --write src/durable test/durable
      - name: Commit deterministic formatting
        run: |
          if git diff --quiet -- src/durable test/durable; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/durable test/durable
          git commit -m "style(m8): apply Biome formatting"
          git push origin HEAD:agent/m8-durable-missions
