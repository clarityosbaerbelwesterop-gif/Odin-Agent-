name: M8 SQLite typefix helper

on:
  push:
    branches:
      - agent/m8-durable-missions

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Use Node 24 StatementSync API
        run: |
          perl -0pi -e 's/  const statement = database\.prepare\(sql\);\n  try \{\n    statement\.run\(\.\.\.parameters\);\n  \} finally \{\n    statement\.close\(\);\n  \}/  database.prepare(sql).run(...parameters);/g' src/durable/store.ts
          perl -0pi -e 's/  const statement = database\.prepare\(sql\);\n  try \{\n    return statement\.get\(\.\.\.parameters\);\n  \} finally \{\n    statement\.close\(\);\n  \}/  return database.prepare(sql).get(...parameters);/g' src/durable/store.ts
          perl -0pi -e 's/  const statement = database\.prepare\(sql\);\n  try \{\n    return statement\.all\(\.\.\.parameters\) as unknown\[\];\n  \} finally \{\n    statement\.close\(\);\n  \}/  return database.prepare(sql).all(...parameters) as unknown[];/g' src/durable/store.ts
          test "$(grep -c 'statement.close' src/durable/store.ts || true)" -eq 0
      - run: npx biome check --write src/durable/store.ts
      - name: Commit typefix and remove helper
        run: |
          rm .github/workflows/m8-sqlite-typefix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/durable/store.ts .github/workflows/m8-sqlite-typefix.yml
          git commit -m "fix(m8): use Node SQLite statement API correctly"
          git push origin HEAD:agent/m8-durable-missions
