name: M9 cleanup helper

on:
  push:
    branches:
      - agent/m9-client-protocol

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply exact M9 cleanup
        run: |
          perl -0pi -e 's/  type ClientStateRequest,\n//' src/client/control.ts
          perl -0pi -e 's/<button value="dismiss">/<button type="submit" value="dismiss">/' web/index.html
          perl -0pi -e 's/<button value="confirm" class="danger">/<button type="submit" value="confirm" class="danger">/' web/index.html
          npx biome check --write src/client/control.ts web
      - name: Commit cleanup and remove helper
        run: |
          rm .github/workflows/m9-cleanup-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/control.ts web .github/workflows/m9-cleanup-helper.yml
          git commit -m "style(m9): normalize client reference assets"
          git push origin HEAD:agent/m9-client-protocol
