name: M9 protocol contract completion

on:
  push:
    branches:
      - agent/m9-client-protocol

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Complete checkpoint and command outcome contract
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function replace(path, oldText, newText) {
            let text = fs.readFileSync(path, 'utf8');
            if (!text.includes(oldText)) throw new Error(`Missing expected pattern in ${path}`);
            text = text.replace(oldText, newText);
            fs.writeFileSync(path, text);
          }

          replace(
            'src/client/types.ts',
            '  readonly budgetUsage: BudgetCounters;\n  readonly jobs: ClientJobCounts;',
            '  readonly budgetUsage: BudgetCounters;\n  readonly checkpointVersion: number | null;\n  readonly jobs: ClientJobCounts;',
          );
          replace(
            'src/client/types.ts',
            '  readonly command: ClientCommandName;\n  readonly projection: ClientMissionProjection;',
            '  readonly command: ClientCommandName;\n  readonly outcome: "APPLIED" | "REPLAYED";\n  readonly projection: ClientMissionProjection;',
          );

          replace(
            'src/client/protocol.ts',
            '  verification: ClientVerificationSummary = { evidenceRefs: [], status: "UNAVAILABLE" },\n): ClientMissionProjection {',
            '  verification: ClientVerificationSummary = { evidenceRefs: [], status: "UNAVAILABLE" },\n  checkpointVersion: number | null = null,\n): ClientMissionProjection {',
          );
          replace(
            'src/client/protocol.ts',
            '    budgetUsage: normalizeCounters(snapshot.budgetUsage, "budget usage"),\n    focus: snapshot.focus,',
            '    budgetUsage: normalizeCounters(snapshot.budgetUsage, "budget usage"),\n    checkpointVersion:\n      checkpointVersion === null\n        ? null\n        : safeInteger(checkpointVersion, "checkpoint version", 1),\n    focus: snapshot.focus,',
          );
          replace(
            'src/client/protocol.ts',
            '      "budgetUsage",\n      "focus",',
            '      "budgetUsage",\n      "checkpointVersion",\n      "focus",',
          );
          replace(
            'src/client/protocol.ts',
            '    budgetUsage: normalizeCounters(object.budgetUsage, "projection budget usage"),\n    focus: focus as ClientMissionProjection["focus"],',
            '    budgetUsage: normalizeCounters(object.budgetUsage, "projection budget usage"),\n    checkpointVersion:\n      object.checkpointVersion === null\n        ? null\n        : safeInteger(object.checkpointVersion, "projection checkpoint version", 1),\n    focus: focus as ClientMissionProjection["focus"],',
          );

          replace(
            'src/client/control.ts',
            'export interface ClientActivitySource {\n  jobCounts(missionId: string): Promise<Readonly<Record<DurableJobStatus, number>>>;',
            'export interface ClientActivitySource {\n  jobCounts(missionId: string): Promise<Readonly<Record<DurableJobStatus, number>>>;\n  loadCheckpoint(missionId: string): Promise<{ readonly aggregateVersion: number } | null>;',
          );
          replace(
            'src/client/control.ts',
            'export interface MissionCommandAuthority {\n  execute(request: ClientCommandRequest): Promise<MissionSnapshot>;\n}',
            'export interface MissionCommandAuthority {\n  execute(request: ClientCommandRequest): Promise<{\n    readonly outcome: "APPLIED" | "REPLAYED";\n    readonly snapshot: MissionSnapshot;\n  }>;\n}',
          );
          replace(
            'src/client/control.ts',
            '  async execute(request: ClientCommandRequest): Promise<MissionSnapshot> {',
            '  async execute(request: ClientCommandRequest): Promise<{\n    readonly outcome: "APPLIED" | "REPLAYED";\n    readonly snapshot: MissionSnapshot;\n  }> {',
          );
          replace(
            'src/client/control.ts',
            '    const targets = commandTargets(request.command, snapshot);\n    const items: EventAppendItem<MissionEventData>[] = [];\n    const scopedIdempotencyKey = `client:${request.sessionId}:${request.idempotencyKey}`;',
            '    const targets = commandTargets(request.command, snapshot);\n    const scopedIdempotencyKey = `client:${request.sessionId}:${request.idempotencyKey}`;\n    const outcome = events.some((event) => event.idempotencyKey === scopedIdempotencyKey)\n      ? "REPLAYED"\n      : "APPLIED";\n    const items: EventAppendItem<MissionEventData>[] = [];',
          );
          replace(
            'src/client/control.ts',
            '    return projectMission(await this.#store.load(request.missionId));\n  }\n}',
            '    return {\n      outcome,\n      snapshot: projectMission(await this.#store.load(request.missionId)),\n    };\n  }\n}',
          );
          replace(
            'src/client/control.ts',
            '    const [jobCounts, verification, rawPage] = await Promise.all([\n      this.#activity.jobCounts(request.missionId),\n      this.#verification.summary(request.missionId),\n      this.#activity.readJobEvents(request.missionId, request.afterCursor, request.limit + 1),\n    ]);',
            '    const [jobCounts, verification, rawPage, checkpoint] = await Promise.all([\n      this.#activity.jobCounts(request.missionId),\n      this.#verification.summary(request.missionId),\n      this.#activity.readJobEvents(request.missionId, request.afterCursor, request.limit + 1),\n      this.#activity.loadCheckpoint(request.missionId),\n    ]);',
          );
          replace(
            'src/client/control.ts',
            '      projection: buildClientProjection(snapshot, jobCounts, verification),',
            '      projection: buildClientProjection(\n        snapshot,\n        jobCounts,\n        verification,\n        checkpoint?.aggregateVersion ?? null,\n      ),',
          );
          replace(
            'src/client/control.ts',
            '    const snapshot = await this.#commands.execute(request);\n    const [jobCounts, verification] = await Promise.all([\n      this.#activity.jobCounts(request.missionId),\n      this.#verification.summary(request.missionId),\n    ]);',
            '    const execution = await this.#commands.execute(request);\n    const [jobCounts, verification, checkpoint] = await Promise.all([\n      this.#activity.jobCounts(request.missionId),\n      this.#verification.summary(request.missionId),\n      this.#activity.loadCheckpoint(request.missionId),\n    ]);',
          );
          replace(
            'src/client/control.ts',
            '      missionId: request.missionId,\n      projection: buildClientProjection(snapshot, jobCounts, verification),',
            '      missionId: request.missionId,\n      outcome: execution.outcome,\n      projection: buildClientProjection(\n        execution.snapshot,\n        jobCounts,\n        verification,\n        checkpoint?.aggregateVersion ?? null,\n      ),',
          );
          NODE
          npx biome check --write src/client/types.ts src/client/protocol.ts src/client/control.ts
      - name: Commit contract completion and remove helper
        run: |
          rm .github/workflows/m9-contract-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/types.ts src/client/protocol.ts src/client/control.ts .github/workflows/m9-contract-helper.yml
          git commit -m "feat(m9): expose checkpoint and command outcome"
          git push origin HEAD:agent/m9-client-protocol
