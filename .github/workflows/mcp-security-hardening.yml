name: MCP Security Hardening

on:
  push:
    branches:
      - agent/mcp-connectors-oauth-platform
    paths:
      - .github/workflows/mcp-security-hardening.yml
      - .github/scripts/mcp-security-hardening.py
      - .github/scripts/mcp-security-compat.py

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/mcp-connectors-oauth-platform
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Apply MCP security hardening
        run: python .github/scripts/mcp-security-hardening.py
      - name: Apply typed compatibility fix
        run: python .github/scripts/mcp-security-compat.py
      - run: npm ci
      - run: npm run format
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ui
      - name: Commit hardened product state
        run: |
          git config user.name "odin-product-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src test web migrations package.json scripts api/index.mjs
          git status --short
          git commit -m "fix: harden MCP approvals and connector trust boundaries"
          git push origin HEAD:agent/mcp-connectors-oauth-platform
# temporary verification workflow; remove before PR
