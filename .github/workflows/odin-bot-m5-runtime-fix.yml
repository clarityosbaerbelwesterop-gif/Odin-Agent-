name: Verify Odin Bot M5 runtime fix

on:
  push:
    branches:
      - agent/odin-bot-m4-m6-team-autonomy-continuity-v2
    paths:
      - .github/workflows/odin-bot-m5-runtime-fix.yml

permissions:
  contents: write

concurrency:
  group: odin-bot-m5-runtime-fix
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Apply autonomy runtime gate
        run: python scripts/odin-bot-m5-runtime-gate.py
      - run: npm ci
      - name: Normalize changed product files
        run: npx biome check --write src/bot/executor.ts test/bot/team-autonomy-continuity.test.ts
      - name: Full repository verification
        run: npm run verify
      - name: Reject whitespace errors
        run: git diff --check
      - name: Commit verified runtime fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "odin-bot-build"
          git config user.email "odin-bot-build@users.noreply.github.com"
          git add src/bot/executor.ts test/bot/team-autonomy-continuity.test.ts
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Fix M5 autonomy enforcement in bot runtime"
            git push origin HEAD:agent/odin-bot-m4-m6-team-autonomy-continuity-v2
          fi
