name: Verify Odin Bot M7-M9 integration

on:
  push:
    branches:
      - agent/odin-bot-m7-m9-events-pr-proactive
    paths:
      - .github/workflows/odin-bot-m7-m9-build.yml

permissions:
  contents: write

concurrency:
  group: odin-bot-m7-m9-build
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Apply M7-M9 runtime integration
        run: |
          python scripts/odin-bot-m7-m9-build.py
          python scripts/odin-bot-m7-m9-polish.py
      - run: npm ci
      - name: Normalize changed product files
        run: >-
          npx biome check --write
          src/bot/github-event-policy.ts
          src/bot/github-events.ts
          src/bot/wakeup.ts
          src/bot/store.ts
          src/bot/executor.ts
          src/chat/github-delivery.ts
          src/chat/github-workspace-session.ts
          src/chat/github-workspace.ts
          src/chat/hosted.ts
          test/bot/github-events.test.ts
          test/chat/github-delivery.test.ts
          scripts/sync-vercel-production.mjs
      - name: Full repository verification
        run: npm run verify
      - name: Reject whitespace errors
        run: git diff --check
      - name: Commit verified M7-M9 product block
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "odin-bot-build"
          git config user.email "odin-bot-build@users.noreply.github.com"
          git add \
            src/bot/github-event-policy.ts \
            src/bot/github-events.ts \
            src/bot/wakeup.ts \
            src/bot/store.ts \
            src/bot/executor.ts \
            src/chat/github-delivery.ts \
            src/chat/github-workspace-session.ts \
            src/chat/github-workspace.ts \
            src/chat/hosted.ts \
            test/bot/github-events.test.ts \
            test/chat/github-delivery.test.ts \
            migrations/008_odin_bot_m7_m9.sql \
            scripts/sync-vercel-production.mjs \
            .github/workflows/configure-vercel-production.yml
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Odin Bot M7-M9: event wakeups, PR delivery and proactive lifecycle"
            git push origin HEAD:agent/odin-bot-m7-m9-events-pr-proactive
          fi
