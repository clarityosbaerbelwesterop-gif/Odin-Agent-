name: One-shot auth formatter

on:
  push:
    branches: [agent/auth-session-hardening]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/auth-session-hardening
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx biome check --write web/login.js test/chat/neon-auth.test.ts
      - name: Commit formatter changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/login.js test/chat/neon-auth.test.ts
          git commit -m "style: format auth hardening"
          git push origin HEAD:agent/auth-session-hardening
