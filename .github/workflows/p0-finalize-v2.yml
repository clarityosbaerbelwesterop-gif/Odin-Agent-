name: P0 Finalize Product Rewrite V2
run-name: P0 Finalize — verified product-only commit

on:
  push:
    branches:
      - agent/product-rewrite-p0-auth-workspace-chat
    paths:
      - .github/workflows/p0-finalize-v2.yml

permissions:
  contents: write

concurrency:
  group: p0-finalize-product-rewrite
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Apply deterministic completion patch
        run: python scripts/p0-finalize-patch.py
      - run: npm ci
      - name: Verify final tree
        run: npm run verify
      - name: Reject whitespace errors
        run: git diff --check
      - name: Commit verified final tree
        shell: bash
        run: |
          git status --short
          test -n "$(git status --porcelain)"
          git config user.name "odin-p0-bot"
          git config user.email "odin-p0-bot@users.noreply.github.com"
          git add -A
          git commit -m "P0: finish GitHub identity and production auth wiring"
          git push origin HEAD:agent/product-rewrite-p0-auth-workspace-chat
