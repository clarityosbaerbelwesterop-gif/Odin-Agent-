name: P0 Neon GitHub Auth Probe
run-name: P0 Neon GitHub Auth Probe — exact production endpoint

on:
  push:
    branches:
      - agent/product-rewrite-p0-auth-workspace-chat
    paths:
      - ".github/workflows/p0-neon-github-auth-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Configure GitHub provider from existing secrets
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: node scripts/configure-neon-github-auth.mjs
      - name: Probe exact production Neon Auth endpoint without secret values
        env:
          PRODUCTION_NEON_AUTH_URL: https://ep-restless-cake-b1d8u9ge.neonauth.c-5.eu-central-1.aws.neon.tech/neondb/auth
        run: node scripts/probe-neon-github-auth.mjs
