name: P0 Repair
run-name: P0 Repair — complete integration gate

on:
  push:
    branches:
      - agent/product-rewrite-p0-auth-workspace-chat
    paths:
      - ".github/workflows/p0-repair.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply guarded P0 patch
        run: node scripts/apply-product-rewrite-p0-v2.mjs
      - name: Format product and production-wiring files
        run: |
          npx biome format --write src/chat/hosted.ts src/chat/github-catalog.ts test/chat/github-catalog.test.ts test/chat/hosted.test.ts web/chat.js web/chat.html web/login.html web/login.css web/login.js web/workspace.js web/workspace.css scripts/login.test.mjs scripts/workspace-ui.test.mjs scripts/configure-neon-github-auth.mjs .github/workflows/configure-vercel-production.yml
      - name: Remove one-shot files
        run: |
          rm -f scripts/apply-product-rewrite-p0-v2.mjs
          rm -f .github/workflows/product-rewrite-p0.yml
          rm -f .github/workflows/p0-repair.yml
      - name: Verify
        run: npm run verify
      - name: Commit verified integration
        run: |
          git config user.name "odin-product-rewrite"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "P0: integrate login workspace and resilient mission runs"
          git push origin HEAD:agent/product-rewrite-p0-auth-workspace-chat
