name: Patch concurrent mission quota

on:
  push:
    branches:
      - agent/concurrent-mission-quota

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/concurrent-mission-quota
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/patch-concurrent-mission-quota.mjs
      - run: npx biome check --write src/chat/hosted.ts src/chat/neon-database.ts
      - run: npx tsc -p tsconfig.json --noEmit
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/chat/hosted.ts src/chat/neon-database.ts
          git commit -m 'feat: enforce concurrent mission quotas at run admission'
          git push origin HEAD:agent/concurrent-mission-quota
