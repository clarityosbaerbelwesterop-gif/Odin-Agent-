name: Patch concurrent mission quota

on:
  push:
    branches: [agent/concurrent-mission-quota]
    paths:
      - .github/workflows/patch-concurrent-mission-quota.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'clarityosbaerbelwesterop-gif/Odin-Agent-'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/concurrent-mission-quota
      - name: Patch hosted run admission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/chat/hosted.ts')
          text = path.read_text()
          old_import = 'import { QuotaStore } from "./quota.js";'
          new_import = 'import { planQuota, QuotaStore } from "./quota.js";'
          if old_import not in text:
              raise SystemExit('quota import anchor missing')
          text = text.replace(old_import, new_import, 1)
          old = '''        const resource = `run:${id}`;
        const lease = await db.claim(resource);
        if (!lease) throw new ChatError("BUSY", "This task already has an active worker.", 409);'''
          new = '''        const resource = `run:${id}`;
        const runLimit = planQuota(effectivePlan(await product.account())).maxConcurrentMissions;
        const claimed = await db.claimBounded(resource, "run:", runLimit);
        if (claimed.status === "busy")
          throw new ChatError("BUSY", "This task already has an active worker.", 409);
        if (claimed.status === "limit")
          throw new ChatError(
            "CONCURRENT_MISSION_LIMIT",
            "Your plan's concurrent mission limit is reached.",
            409,
          );
        const lease = claimed.token;'''
          if old not in text:
              raise SystemExit('run admission anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format and verify patched files
        run: |
          npm ci
          npx biome check --write src/chat/hosted.ts src/chat/neon-database.ts
          npx tsc -p tsconfig.json --noEmit
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/chat/hosted.ts src/chat/neon-database.ts
          git commit -m 'feat: enforce concurrent mission quotas at run admission'
          git push origin HEAD:agent/concurrent-mission-quota
