name: Patch pre-Stripe integrations

on:
  push:
    branches: [fix/unorouter-provider]
    paths:
      - scripts/patch-prestripe-unorouter-github.mjs
      - .github/workflows/patch-prestripe-unorouter-github.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/unorouter-provider
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/patch-prestripe-unorouter-github.mjs
      - run: npx biome check --write src/providers/unorouter.ts src/providers/index.ts src/chat/server-models.ts src/chat/quota.ts src/chat/hosted.ts src/bot/executor.ts scripts/sync-vercel-production.mjs test/chat/openrouter-shared.test.ts test/chat/quota.test.ts test/bot/model-routing.test.ts .github/workflows/configure-vercel-production.yml
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm test -- --runInBand || npm test
      - name: Commit applied patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/providers/unorouter.ts src/providers/index.ts src/chat/server-models.ts src/chat/quota.ts src/chat/hosted.ts src/bot/executor.ts scripts/sync-vercel-production.mjs test/chat/openrouter-shared.test.ts test/chat/quota.test.ts test/bot/model-routing.test.ts .github/workflows/configure-vercel-production.yml
          git commit -m 'fix: separate GitHub repo OAuth and wire UnoRouter correctly'
          git push origin HEAD:fix/unorouter-provider
