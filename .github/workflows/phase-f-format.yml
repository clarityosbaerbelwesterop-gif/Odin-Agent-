name: Phase F format repair

on:
  push:
    branches:
      - agent/intelligence-d-e-f
    paths:
      - .github/workflows/phase-f-format.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/intelligence-d-e-f
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply Biome formatting
        run: npx biome check --write src/routing/frontier-amplification.ts test/routing/frontier-amplification.test.ts
      - name: Verify repository
        run: npm run verify
      - name: Remove temporary workflow and commit verified repair
        run: |
          rm .github/workflows/phase-f-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routing/frontier-amplification.ts test/routing/frontier-amplification.test.ts .github/workflows/phase-f-format.yml
          git diff --cached --quiet && exit 0
          git commit -m "style(intelligence): format Phase F implementation"
          git push origin HEAD:agent/intelligence-d-e-f
