name: Odin hosted API evidence

on:
  workflow_dispatch:
    inputs:
      live_model:
        description: Run one bounded live Kimi task after hosted auth checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: odin-hosted-api-evidence
  cancel-in-progress: false

jobs:
  smoke:
    if: github.repository == 'clarityosbaerbelwesterop-gif/Odin-Agent-' && github.ref == 'refs/heads/agent/chathub-modes-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Exercise the exact current preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_ODIN_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          ODIN_LIVE_MODEL: ${{ inputs.live_model && '1' || '0' }}
        run: node scripts/live-vercel-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odin-hosted-api-evidence
          path: vercel-smoke-result.json
          if-no-files-found: error
          retention-days: 14
