name: Product Experience Verify

on:
  push:
    branches:
      - agent/product-experience-runtime-quality
    paths:
      - .github/workflows/product-experience-build.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/product-experience-runtime-quality
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
# temporary verification workflow; remove before PR
