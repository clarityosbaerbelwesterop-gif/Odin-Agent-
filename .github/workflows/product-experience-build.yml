name: Product Experience Build

on:
  push:
    branches:
      - agent/product-experience-runtime-quality
    paths:
      - .github/workflows/product-experience-build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/product-experience-runtime-quality
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Apply product experience changes
        run: python .github/scripts/product-experience-build.py
      - run: npm ci
      - run: npm run format
      - run: npm run typecheck
      - run: npm run test:ui
      - name: Commit implementation
        run: |
          git config user.name "odin-product-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src test scripts web package.json
          git status --short
          git commit -m "feat: make Odin work visible and efficient"
          git push origin HEAD:agent/product-experience-runtime-quality
