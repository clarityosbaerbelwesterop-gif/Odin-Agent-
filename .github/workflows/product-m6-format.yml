name: PRODUCT M6 temporary formatter

on:
  push:
    branches:
      - agent/product-m6-build-mode

permissions:
  contents: write

concurrency:
  group: product-m6-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format M6 sources
        run: npx biome check --write src/chat/build-api.ts src/chat/build-mode.ts test/chat/product-m6-acceptance.test.ts test/chat/product-m6-build-mode.test.ts web/build-mode.js web/product-m6.css scripts/build-mode-ui.test.mjs api/index.mjs package.json
      - name: Commit formatter output
        run: |
          git config user.name "Odin Product M6"
          git config user.email "odin-m6@users.noreply.github.com"
          git add src/chat/build-api.ts src/chat/build-mode.ts test/chat/product-m6-acceptance.test.ts test/chat/product-m6-build-mode.test.ts web/build-mode.js web/product-m6.css scripts/build-mode-ui.test.mjs api/index.mjs package.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(m6): apply canonical formatting"
          git push origin HEAD:agent/product-m6-build-mode
