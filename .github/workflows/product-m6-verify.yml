name: PRODUCT M6 pre-PR verify

on:
  push:
    branches:
      - agent/product-m6-build-mode

permissions:
  contents: read

concurrency:
  group: product-m6-pre-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full repository verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run canonical verify
        run: npm run verify
