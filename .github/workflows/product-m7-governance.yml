name: PRODUCT M7 temporary governance sync

on:
  push:
    branches:
      - agent/product-m7-coding-mode

permissions:
  contents: write

concurrency:
  group: product-m7-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Synchronize M7 root governance
        run: |
          python - <<'PY'
          from pathlib import Path
          blocks = {
              "README.md": "## PRODUCT M7 — Coding Mode\n\nPRODUCT M7 turns Odin's existing `GitHubWorkspace`, repository-tool and verification stack into a professional Coding Mode. Repository browsing, line-oriented source viewing, diff-first review, exact isolated `odin/*` work-branch resume, real CI/quality evidence, fail-closed PR delivery and actual PR-file review all reuse existing authorities; no second Git client, coding runtime, Skill engine or verifier is introduced. See the [PRODUCT M7 contract](docs/milestones/PRODUCT_M7_CODING_MODE.md).",
              "ARCHITECTURE.md": "## PRODUCT M7 — Coding Mode authority boundary\n\nPRODUCT M7 is a developer projection over the existing Hosted Run, `GitHubWorkspace`, repository tools, `GitHubPullRequestClient`, M25 tool policy, M5 verification, PRODUCT M5 Skills and canonical event/checkpoint authorities. Repository tree/search/read is bounded and untrusted. Ordinary mutations remain on isolated `odin/*` branches; checkpointed repository/base/work-branch/head/write provenance restores the same branch and incomplete provenance fails closed. Diff and quality state come from repository/canonical Run evidence, not browser-authored claims. PR delivery requires COMPLETED state, real changes, current passing quality after the latest mutation, exact scope/provenance, unchanged base and secret screening.",
              "ROADMAP.md": "## PRODUCT M7 — Coding Mode (current delivery)\n\nStatus: **PRE-PR VERIFIED — final exact-head PR CI pending**.\n\n- [x] Bounded real repository tree/search/read and line-oriented source viewer.\n- [x] Diff-first changes from canonical `file.changed`/checkpoint data plus actual Git branch identity.\n- [x] Existing isolated `odin/*` work branches; no ordinary direct-main writes.\n- [x] Exact repository/base/work-branch/head resume with fail-closed incomplete provenance.\n- [x] Real CI/quality evidence kept distinct from no-CI branch-integrity-only proof.\n- [x] Fail-closed PR gate with current post-mutation quality, base-currentness and secret screening.\n- [x] Actual GitHub PR-file review evidence.\n- [x] Acceptance #1 failed login fix -> failed check -> repair -> green verification.\n- [x] Acceptance #2 multi-file feature -> pause -> same Run/branch resume -> final verification.\n- [x] Repository injection/traversal/binary/Git-identity/stale-quality/permission regressions.\n- [x] Full `npm run verify` passed on `feebe53ab81e3eaa0ae81a91c26df910a012b17f`; focused domain gate passed 667/667 at 80.00% line coverage.\n- [ ] Remove temporary milestone workflows, run exact-head normal PR CI and merge.\n\nPRODUCT M8 starts only from merged PRODUCT M7 `main`.",
              "HANDOVER.md": "## PRODUCT M7 checkpoint — Coding Mode\n\nPRODUCT M7 continues from merged PRODUCT M6 main `57ea16c2e818547689e43e36822934f7cf4042d8`. Preserve the existing `GitHubWorkspace`, `GitHubPullRequestClient`, canonical Hosted Run, repository tools, M25 permissions, verification and Skills path. Exact repository/base/work-branch/head provenance is checkpointed; missing provenance blocks resume/delivery rather than creating a replacement branch. The original pre-PR verify `34767187345` failed at Biome; later gates exposed incomplete restore callers, stale GitHub fixtures, acceptance assertions, a branch-regex test bug, a real 40-character Git SHA restore bug and a small coverage gap. All were repaired without reducing gates. Focused domain verification passed 667/667 at 80.00% line coverage and full `npm run verify` passed on `feebe53ab81e3eaa0ae81a91c26df910a012b17f`. Temporary milestone workflows must be absent from the PR; normal exact-head PR CI remains merge authority.",
              "SECURITY.md": "## PRODUCT M7 Coding Mode security boundary\n\nRepository files, README instructions, package scripts and PR prose are untrusted data. Coding Mode cannot convert them into Tool permissions, shell authority, network scope, credentials, approvals or verification. Repository paths remain normalized/scoped; binary/unsupported input is refused; tree/search/read are bounded. Ordinary writes remain on isolated `odin/*` work branches and restore requires exact repository/base/branch provenance. PR delivery fails closed unless the canonical Run is COMPLETED, real changes exist, passing quality evidence post-dates the final mutation, branch/base/head provenance matches, canonical base is unchanged and changed content passes secret screening. No-CI branch-integrity evidence is never relabeled as successful tests."
          }
          for name, block in blocks.items():
              p = Path(name)
              text = p.read_text()
              if block.splitlines()[0] in text:
                  continue
              first, rest = text.split("\n", 1)
              p.write_text(first + "\n\n" + block + "\n\n" + rest)
          roadmap = Path("ROADMAP.md")
          text = roadmap.read_text().replace("## PRODUCT M6 — Build Mode (current delivery)", "## PRODUCT M6 — Build Mode (merged milestone)", 1)
          text = text.replace("Status: **PRE-PR VERIFIED — final governance exact-head CI and merge pending**.", "Status: **MERGED** — PR #81; exact-head CI #883 passed; merge `57ea16c2e818547689e43e36822934f7cf4042d8` is on `main`.", 1)
          roadmap.write_text(text)
          PY
      - name: Commit governance
        run: |
          git config user.name "Odin Product M7"
          git config user.email "odin-m7@users.noreply.github.com"
          git add README.md ARCHITECTURE.md ROADMAP.md HANDOVER.md SECURITY.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(m7): synchronize Coding Mode governance"
          git push origin HEAD:agent/product-m7-coding-mode
