name: PRODUCT M7 temporary Biome repair

on:
  push:
    branches:
      - agent/product-m7-coding-mode

permissions:
  contents: write

concurrency:
  group: product-m7-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Repair M7 CSS cascade without important overrides
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/product-m7.css')
          text = p.read_text()
          replacements = {
            '.m7-review>div{display:flex;gap:6px}': '.m7-odin .m7-review>div{display:flex;gap:6px}',
            '.m7-review-result{display:grid!important;margin-top:8px}': '.m7-review-result{display:grid;margin-top:8px}',
            '.m7-odin{grid-column:1/-1;border-left:0!important;border-top:1px solid #e4e8e2;display:grid;': '.m7-pane.m7-odin{grid-column:1/-1;border-left:0;border-top:1px solid #e4e8e2;display:grid;',
            '.m7-pane{display:none!important;border:0!important}': '.m7-grid .m7-pane{display:none;border:0}',
            '[data-m7-pane="odin"]{display:grid!important}': '[data-m7-pane="odin"]{display:grid}',
            'scroll-behavior:auto!important;transition:none!important': 'scroll-behavior:auto;transition:none',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'missing CSS repair anchor: {old}')
            text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Canonical M7 formatting
        run: npx biome check --write web/product-m7.css web/coding-mode.js src/chat/coding-api.ts src/chat/coding-product.ts scripts/coding-mode-ui.test.mjs test/chat/product-m7-acceptance.test.ts test/chat/product-m7-coding-mode.test.ts
      - name: Focused Biome validation
        run: npx biome check web/product-m7.css web/coding-mode.js src/chat/coding-api.ts src/chat/coding-product.ts scripts/coding-mode-ui.test.mjs test/chat/product-m7-acceptance.test.ts test/chat/product-m7-coding-mode.test.ts
      - name: Commit repair
        run: |
          git config user.name "Odin Product M7"
          git config user.email "odin-m7@users.noreply.github.com"
          git add web/product-m7.css web/coding-mode.js src/chat/coding-api.ts src/chat/coding-product.ts scripts/coding-mode-ui.test.mjs test/chat/product-m7-acceptance.test.ts test/chat/product-m7-coding-mode.test.ts
          git commit -m "fix(m7): satisfy canonical Biome gate"
          git push origin HEAD:agent/product-m7-coding-mode
