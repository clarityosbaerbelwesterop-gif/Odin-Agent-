name: PRODUCT M7 temporary integration wiring

on:
  push:
    branches:
      - agent/product-m7-coding-mode

permissions:
  contents: write

concurrency:
  group: product-m7-wire-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Wire existing GitHub runtime into Coding Mode
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor missing: {path}: {old[:60]!r}")
              p.write_text(text.replace(old,new,1))

          replace("src/chat/types.ts",
          '''export interface ChatChange {\n  readonly path: string;\n  readonly before: string | null;\n  readonly after: string;\n  readonly sha: string;\n}\n''',
          '''export interface ChatChange {\n  readonly path: string;\n  readonly before: string | null;\n  readonly after: string;\n  readonly sha: string;\n  readonly repository?: string;\n  readonly baseSha?: string;\n  readonly branch?: string;\n  readonly headSha?: string;\n}\n''')

          p=Path("src/chat/github-workspace.ts"); text=p.read_text()
          text=text.replace('''export interface RestoredGitHubWrite {\n  readonly path: string;\n  readonly sha: string;\n}\n''','''export interface RestoredGitHubWrite {\n  readonly path: string;\n  readonly sha: string;\n}\n\nexport interface GitHubWorkspaceRepositoryState {\n  readonly repository: string;\n  readonly baseBranch: string;\n  readonly storedBaseSha: string | null;\n  readonly currentBaseSha: string;\n  readonly workBranch: string | null;\n  readonly headSha: string | null;\n}\n\nexport interface GitHubWorkspaceTreeEntry {\n  readonly path: string;\n  readonly sha: string | null;\n}\n''')
          text=text.replace('''export class GitHubWorkspace implements RepositoryWorkspace, QualityCommandRunner {\n  #workBranch: string | undefined;\n  readonly #persistedWrites = new Map<string, string>();\n''','''export class GitHubWorkspace implements RepositoryWorkspace, QualityCommandRunner {\n  #workBranch: string | undefined;\n  #baseSha: string | undefined;\n  readonly #persistedWrites = new Map<string, string>();\n''')
          text=text.replace('''    initialWorkBranch?: string,\n    initialWrites: readonly RestoredGitHubWrite[] = [],\n  ) {\n''','''    initialWorkBranch?: string,\n    initialWrites: readonly RestoredGitHubWrite[] = [],\n    initialBaseSha?: string,\n  ) {\n''')
          text=text.replace('''    this.#workBranch = initialWorkBranch;\n    for (const write of initialWrites) {\n''','''    this.#workBranch = initialWorkBranch;\n    if (initialBaseSha && !CONTENT_HASH.test(initialBaseSha))\n      throw new ChatError("INVALID_CHECKPOINT", "Stored repository base hash is invalid.", 409);\n    this.#baseSha = initialBaseSha;\n    for (const write of initialWrites) {\n''')
          text=text.replace('''    const branch = `odin/${new Date().toISOString().slice(0, 10)}/${randomUUID().slice(0, 8)}`;\n    await this.#api("/git/refs", {\n''','''    const branch = `odin/${new Date().toISOString().slice(0, 10)}/${randomUUID().slice(0, 8)}`;\n    this.#baseSha = object.sha;\n    await this.#api("/git/refs", {\n''')
          marker='''  async read(input: Parameters<RepositoryWorkspace["read"]>[0]) {\n'''
          insert='''  async tree(signal: AbortSignal, maxEntries = 500): Promise<GitHubWorkspaceTreeEntry[]> {\n    if (!Number.isSafeInteger(maxEntries) || maxEntries < 1 || maxEntries > 2000)\n      throw new ChatError("TREE_LIMIT", "Repository tree limit is invalid.");\n    const tree = await this.#api(\n      `/git/trees/${encodeURIComponent(this.#workBranch ?? this.defaultBranch)}?recursive=1`,\n      { signal },\n    );\n    const entries = Array.isArray(tree.tree) ? tree.tree : [];\n    return entries\n      .filter(\n        (entry: GitHubFile) =>\n          entry.type === "blob" && typeof entry.path === "string" && entry.path.length <= 400,\n      )\n      .flatMap((entry: GitHubFile) => {\n        try {\n          return [{ path: normalizeWorkspacePath(String(entry.path)), sha: typeof entry.sha === "string" ? entry.sha : null }];\n        } catch {\n          return [];\n        }\n      })\n      .slice(0, maxEntries);\n  }\n\n'''+marker
          if marker not in text: raise SystemExit("github workspace read anchor missing")
          text=text.replace(marker,insert,1)
          text=text.replace('''    const file = result.content as { sha?: string } | undefined;\n    if (!file?.sha)\n      throw new ChatError("GITHUB_UPSTREAM", "GitHub did not confirm the file change.", 502);\n    const contentHash = hashText(content);\n    await this.changed({ path, before, after: content, sha: contentHash, branch });\n''','''    const file = result.content as { sha?: string } | undefined;\n    const commit = result.commit as { sha?: string } | undefined;\n    if (!file?.sha || !commit?.sha || !this.#baseSha)\n      throw new ChatError("GITHUB_UPSTREAM", "GitHub did not confirm the file change.", 502);\n    const contentHash = hashText(content);\n    await this.changed({\n      path,\n      before,\n      after: content,\n      sha: contentHash,\n      repository: this.repository,\n      baseSha: this.#baseSha,\n      branch,\n      headSha: commit.sha,\n    });\n''')
          text=text.replace('''  branchName(): string | null {\n    return this.#workBranch ?? null;\n  }\n''','''  async repositoryState(signal: AbortSignal): Promise<GitHubWorkspaceRepositoryState> {\n    const base = await this.#api(`/git/ref/heads/${encodeURIComponent(this.defaultBranch)}`, { signal });\n    const baseObject = base.object as { sha?: string } | undefined;\n    if (!baseObject?.sha) throw new ChatError("GITHUB_UPSTREAM", "Base branch reference is invalid.", 502);\n    let headSha: string | null = null;\n    if (this.#workBranch) {\n      const work = await this.#api(`/git/ref/heads/${encodeURIComponent(this.#workBranch)}`, { signal });\n      const workObject = work.object as { sha?: string } | undefined;\n      if (!workObject?.sha) throw new ChatError("GITHUB_UPSTREAM", "Odin work branch reference is invalid.", 502);\n      headSha = workObject.sha;\n    }\n    return {\n      repository: this.repository,\n      baseBranch: this.defaultBranch,\n      storedBaseSha: this.#baseSha ?? null,\n      currentBaseSha: baseObject.sha,\n      workBranch: this.#workBranch ?? null,\n      headSha,\n    };\n  }\n\n  branchName(): string | null {\n    return this.#workBranch ?? null;\n  }\n''')
          p.write_text(text)

          p=Path("src/chat/github-workspace-session.ts"); text=p.read_text()
          text=text.replace('''export interface GitHubWorkspaceRestore {\n  readonly branch: string;\n  readonly writes: readonly RestoredGitHubWrite[];\n}\n''','''export interface GitHubWorkspaceRestore {\n  readonly repository: string;\n  readonly branch: string;\n  readonly baseSha: string;\n  readonly writes: readonly RestoredGitHubWrite[];\n}\n''')
          text=text.replace('''  ) {}\n\n  workspace(onChange''','''  ) {\n    if (restore && restore.repository !== repository)\n      throw new Error("Stored Coding workspace repository does not match the selected repository.");\n  }\n\n  workspace(onChange''')
          text=text.replace('''      this.restore?.branch,\n      this.restore?.writes ?? [],\n    );\n''','''      this.restore?.branch,\n      this.restore?.writes ?? [],\n      this.restore?.baseSha,\n    );\n''')
          text=text.replace('''      this.restore?.branch,\n      this.restore?.writes ?? [],\n    ).commands();\n''','''      this.restore?.branch,\n      this.restore?.writes ?? [],\n      this.restore?.baseSha,\n    ).commands();\n''')
          p.write_text(text)

          p=Path("src/chat/github-delivery.ts"); text=p.read_text()
          text=text.replace('''export interface GitHubPullRequestDelivery {\n''','''export interface GitHubPullRequestFile {\n  readonly filename: string;\n  readonly status: string;\n  readonly additions: number;\n  readonly deletions: number;\n  readonly patch: string | null;\n}\n\nexport interface GitHubPullRequestDelivery {\n''')
          anchor='''  async status(number: number, signal?: AbortSignal): Promise<GitHubPullRequestDelivery> {\n'''
          method='''  async files(number: number, signal?: AbortSignal): Promise<GitHubPullRequestFile[]> {\n    if (!Number.isSafeInteger(number) || number <= 0)\n      throw new ChatError("GITHUB_PR_INVALID", "Pull request number is invalid.");\n    const rows = await this.#api(`/pulls/${number}/files?per_page=100`, signal ? { signal } : {});\n    if (!Array.isArray(rows)) throw new ChatError("GITHUB_UPSTREAM", "GitHub pull request files response is invalid.", 502);\n    return rows.slice(0, 200).map((value) => {\n      const item = object(value);\n      if (typeof item.filename !== "string" || typeof item.status !== "string")\n        throw new ChatError("GITHUB_UPSTREAM", "GitHub pull request file is invalid.", 502);\n      return {\n        filename: item.filename,\n        status: item.status,\n        additions: Number.isSafeInteger(item.additions) ? Number(item.additions) : 0,\n        deletions: Number.isSafeInteger(item.deletions) ? Number(item.deletions) : 0,\n        patch: typeof item.patch === "string" ? item.patch.slice(0, 32_000) : null,\n      };\n    });\n  }\n\n'''+anchor
          if anchor not in text: raise SystemExit("delivery anchor missing")
          p.write_text(text.replace(anchor,method,1))

          p=Path("src/chat/hosted.ts"); text=p.read_text()
          text=text.replace('''import { GitHubWorkspaceSession } from "./github-workspace-session.js";''','''import {\n  type GitHubWorkspaceRestore,\n  GitHubWorkspaceSession,\n} from "./github-workspace-session.js";''')
          text=text.replace('''import { ChatError, type ChatModel } from "./types.js";''','''import { ChatError, type ChatChange, type ChatModel } from "./types.js";''')
          text=text.replace('''      workspaceKind: "auto" | "internal" = "auto",\n    ) => {''','''      workspaceKind: "auto" | "internal" = "auto",\n      githubRestore?: GitHubWorkspaceRestore,\n    ) => {''')
          text=text.replace('''              githubConnection.defaultBranch,\n            )''','''              githubConnection.defaultBranch,\n              fetch,\n              githubRestore,\n            )''',1)
          old='''          const worker = createEngine(\n            workerDb,\n            found.conversationId,\n            controller.signal,\n            workspaceKind,\n          );'''
          new='''          const checkpoint = await new NeonChatStore(workerDb).checkpoint(id);\n          const githubRestore = restoreGitHubWorkspace(\n            checkpoint?.changes,\n            githubConnection.repository,\n          );\n          const worker = createEngine(\n            workerDb,\n            found.conversationId,\n            controller.signal,\n            workspaceKind,\n            githubRestore,\n          );'''
          if old not in text: raise SystemExit("hosted worker anchor missing")
          text=text.replace(old,new,1)
          helper='''\nfunction restoreGitHubWorkspace(\n  changes: readonly ChatChange[] | undefined,\n  repository: string | null,\n): GitHubWorkspaceRestore | undefined {\n  if (!repository || !changes?.length) return undefined;\n  const eligible = changes.filter(\n    (change) =>\n      change.repository === repository &&\n      typeof change.branch === "string" &&\n      typeof change.baseSha === "string",\n  );\n  const latest = eligible.at(-1);\n  if (!latest?.branch || !latest.baseSha) return undefined;\n  return {\n    repository,\n    branch: latest.branch,\n    baseSha: latest.baseSha,\n    writes: eligible\n      .filter((change) => change.branch === latest.branch)\n      .map((change) => ({ path: change.path, sha: change.sha })),\n  };\n}\n'''
          send_anchor='''function send(res: ServerResponse, status: number, data: unknown): void {'''
          if send_anchor not in text: raise SystemExit("hosted send anchor missing")
          text=text.replace(send_anchor,helper+"\n"+send_anchor,1)
          p.write_text(text)

          p=Path("api/index.mjs"); text=p.read_text()
          text=text.replace('''import { buildApiHandler } from "../dist/src/chat/build-api.js";\n''','''import { buildApiHandler } from "../dist/src/chat/build-api.js";\nimport { codingApiHandler } from "../dist/src/chat/coding-api.js";\n''')
          text=text.replace('''  if (rewrittenPath === "build" || rewrittenPath.startsWith("build/"))\n    return buildApiHandler(req, res);\n''','''  if (rewrittenPath === "build" || rewrittenPath.startsWith("build/"))\n    return buildApiHandler(req, res);\n  if (rewrittenPath === "coding" || rewrittenPath.startsWith("coding/"))\n    return codingApiHandler(req, res);\n''')
          p.write_text(text)

          p=Path("web/chat.html"); text=p.read_text()
          needle='<script type="module" src="/build-mode.js"></script>'
          if needle not in text: raise SystemExit("chat html build script anchor missing")
          text=text.replace(needle,needle+'\n    <script type="module" src="/coding-mode.js"></script>',1)
          p.write_text(text)

          p=Path("package.json"); text=p.read_text()
          needle='scripts/build-mode-ui.test.mjs scripts/bot-ui.test.mjs'
          if needle not in text: raise SystemExit("package UI anchor missing")
          text=text.replace(needle,'scripts/build-mode-ui.test.mjs scripts/coding-mode-ui.test.mjs scripts/bot-ui.test.mjs',1)
          p.write_text(text)
          PY
      - name: Canonical formatting
        run: |
          npm ci
          npx biome check --write src/chat/types.ts src/chat/github-workspace.ts src/chat/github-workspace-session.ts src/chat/github-delivery.ts src/chat/hosted.ts api/index.mjs package.json
      - name: Commit wiring
        run: |
          git config user.name "Odin Product M7"
          git config user.email "odin-m7@users.noreply.github.com"
          git add src/chat/types.ts src/chat/github-workspace.ts src/chat/github-workspace-session.ts src/chat/github-delivery.ts src/chat/hosted.ts api/index.mjs web/chat.html package.json
          git commit -m "feat(m7): wire Coding Mode into existing GitHub runtime"
          git push origin HEAD:agent/product-m7-coding-mode
