name: PRODUCT M8 temporary formatter repair

on:
  push:
    branches:
      - agent/product-m8-act-browser-mode

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Repair blocking lint
        run: |
          sed -i 's/let approval = undefined;/let approval: ReturnType<typeof approvalForBrowserAction> | undefined;/' src/chat/browser-store.ts
          sed -i 's/let approval;/let approval: ReturnType<typeof approvalForBrowserAction> | undefined;/' src/chat/browser-store.ts
          sed -i 's/evidence\.forms\.slice(0, 6)\.forEach((form, index) => forms\.append(buildForm(form, index)));/evidence.forms.slice(0, 6).forEach((form, index) => { forms.append(buildForm(form, index)); });/' web/browser.js
      - name: Apply canonical Biome formatting and safe fixes
        run: npx biome check --write src/chat/browser-api.ts src/chat/browser-http.ts src/chat/browser-mode.ts src/chat/browser-store.ts test/chat/product-m8-browser-mode.test.ts web/browser.js web/browser.css vercel.json
      - name: Commit repaired formatting
        run: |
          git config user.name "Odin Product M8"
          git config user.email "odin-m8@users.noreply.github.com"
          git add src/chat/browser-api.ts src/chat/browser-http.ts src/chat/browser-mode.ts src/chat/browser-store.ts test/chat/product-m8-browser-mode.test.ts web/browser.js web/browser.css vercel.json
          git diff --cached --quiet && exit 0
          git commit -m "style(m8): apply canonical formatting"
          git push origin HEAD:agent/product-m8-act-browser-mode
