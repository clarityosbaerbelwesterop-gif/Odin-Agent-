name: PRODUCT M8 temporary formatter repair

on:
  push:
    branches:
      - agent/product-m8-act-browser-mode

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Enforce single-use external approvals
        run: |
          if ! grep -q BROWSER_ACTION_ALREADY_ATTEMPTED src/chat/browser-store.ts; then
            sed -i '/const prepared = await this.preparedAction(session, identifier(preparedActionId));/a\      const priorEvents = await this.chat.events(session.projectId, 0, 1000);\n      if (priorEvents.some((candidate) => ["browser.action.executed", "browser.action.outcome_unknown", "browser.action.failed"].includes(candidate.type) && candidate.data.sessionId === session.id && candidate.data.actionId === prepared.actionId))\n        throw new ChatError("BROWSER_ACTION_ALREADY_ATTEMPTED", "This approved external action was already attempted and cannot be replayed.", 409);' src/chat/browser-store.ts
          fi
      - name: Apply canonical Biome formatting
        run: npx biome check --write src/chat/browser-store.ts
      - name: Commit replay guard
        run: |
          git config user.name "Odin Product M8"
          git config user.email "odin-m8@users.noreply.github.com"
          git add src/chat/browser-store.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(m8): prevent approved action replay"
          git push origin HEAD:agent/product-m8-act-browser-mode
