name: PRODUCT M8 temporary formatter repair

on:
  push:
    branches:
      - agent/product-m8-act-browser-mode

permissions:
  contents: write

concurrency:
  group: product-m8-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Repair replay guard and lint-only source issue
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('web/browser.js')
          text = js.read_text()
          old = 'evidence.forms.slice(0, 6).forEach((form, index) => forms.append(buildForm(form, index)));'
          new = '''for (const [index, form] of evidence.forms.slice(0, 6).entries()) {
              forms.append(buildForm(form, index));
            }'''
          if old not in text:
            raise SystemExit('browser.js target not found')
          js.write_text(text.replace(old, new))

          store = Path('src/chat/browser-store.ts')
          text = store.read_text()
          text = text.replace(
            'let approval = undefined;',
            'let approval: ReturnType<typeof approvalForBrowserAction> | undefined;',
          )
          old = 'const prepared = await this.preparedAction(session, identifier(preparedActionId));\n      if (prepared.requestHash !== actionHash(normalized))'
          new = 'const prepared = await this.preparedAction(session, identifier(preparedActionId));\n      await this.assertActionUnused(session, prepared.actionId);\n      if (prepared.requestHash !== actionHash(normalized))'
          if old not in text:
            raise SystemExit('execute prepared-action target not found')
          text = text.replace(old, new, 1)
          marker = '  private async preparedAction(session: BrowserSession, actionId: string): Promise<PreparedAction> {'
          method = '''  private async assertActionUnused(session: BrowserSession, actionId: string): Promise<void> {
            const events = await this.chat.events(session.projectId, 0, 1000);
            const attempted = events.some(
              (candidate) =>
                [
                  "browser.action.executed",
                  "browser.action.outcome_unknown",
                  "browser.action.failed",
                ].includes(candidate.type) &&
                candidate.data.sessionId === session.id &&
                candidate.data.actionId === actionId,
            );
            if (attempted)
              throw new ChatError(
                "BROWSER_ACTION_ALREADY_ATTEMPTED",
                "This approved external action was already attempted and cannot be replayed.",
                409,
              );
          }

'''
          if marker not in text:
            raise SystemExit('preparedAction marker not found')
          store.write_text(text.replace(marker, method + marker, 1))
          PY
      - name: Apply canonical Biome formatting and safe fixes
        run: |
          npx biome check --write \
            src/chat/browser-api.ts \
            src/chat/browser-http.ts \
            src/chat/browser-mode.ts \
            src/chat/browser-store.ts \
            test/chat/product-m8-browser-mode.test.ts \
            web/browser.js \
            web/browser.css \
            vercel.json
      - name: Commit repaired M8 sources
        run: |
          git config user.name "Odin Product M8"
          git config user.email "odin-m8@users.noreply.github.com"
          git add src/chat/browser-api.ts src/chat/browser-http.ts src/chat/browser-mode.ts src/chat/browser-store.ts test/chat/product-m8-browser-mode.test.ts web/browser.js web/browser.css vercel.json
          git commit -m "fix(m8): harden browser replay and satisfy quality gate"
          git push origin HEAD:agent/product-m8-act-browser-mode
