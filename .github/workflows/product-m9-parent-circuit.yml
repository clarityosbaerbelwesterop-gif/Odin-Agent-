name: PRODUCT M9 parent automation circuit breaker

on:
  push:
    branches:
      - agent/product-m9-automations

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pause parent Automation when its Run exhausts retries
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/bot/executor.ts')
          text = path.read_text()
          old = "    await bot.updateTask(\n      wake.targetId,\n      \"failed\",\n      \"Blocked after repeated failures\",\n      \"runtime.failed\",\n      { code, attempts: wake.attempt },\n    );\n    await bot.addInbox(\n"
          new = "    const failed = await bot.updateTask(\n      wake.targetId,\n      \"failed\",\n      \"Blocked after repeated failures\",\n      \"runtime.failed\",\n      { code, attempts: wake.attempt },\n    );\n    if (failed.sourceAutomationId) await bot.pauseAutomation(failed.sourceAutomationId, code);\n    await bot.addInbox(\n"
          if old not in text:
              raise SystemExit('executor failure block marker missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format and commit
        run: |
          npx biome check --write src/bot/executor.ts
          git config user.name "Odin Product M9"
          git config user.email "odin-m9@users.noreply.github.com"
          git rm .github/workflows/product-m9-parent-circuit.yml
          git add src/bot/executor.ts
          git commit -m "fix(m9): pause automations after exhausted Run retries"
          git push origin HEAD:agent/product-m9-automations
