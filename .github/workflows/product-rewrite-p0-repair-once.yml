name: Product Rewrite P0 Repair Once

on:
  push:
    branches:
      - agent/product-rewrite-p0-auth-workspace-chat
    paths:
      - .github/workflows/product-rewrite-p0-repair-once.yml

permissions:
  contents: write

concurrency:
  group: product-rewrite-p0-repair-once
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.head_commit.message == 'Build: run P0 repair once'
    name: Apply and verify repaired P0 block
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply guarded P0 integration
        run: node scripts/apply-product-rewrite-p0-v2.mjs

      - name: Format integrated product files
        run: >-
          npx biome format --write
          src/chat/hosted.ts src/chat/github-catalog.ts
          test/chat/github-catalog.test.ts
          web/chat.js web/chat.html web/login.html web/login.css web/login.js
          web/workspace.js web/workspace.css
          scripts/login.test.mjs scripts/workspace-ui.test.mjs

      - name: Remove one-shot integration machinery before verification
        run: >-
          rm -f
          scripts/apply-product-rewrite-p0-v2.mjs
          .github/workflows/product-rewrite-p0.yml
          .github/workflows/product-rewrite-p0-repair-once.yml

      - name: Verify complete repository
        run: npm run verify

      - name: Review staged diff safety
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Commit only verified P0 product integration
        shell: bash
        run: |
          git config user.name "odin-product-rewrite"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "P0: integrate login workspace and resilient mission runs"
          git push origin HEAD:agent/product-rewrite-p0-auth-workspace-chat
