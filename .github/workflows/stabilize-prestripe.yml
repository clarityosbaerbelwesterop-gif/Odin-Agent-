name: Stabilize pre-Stripe product

on:
  push:
    branches: [stabilize/prestripe-full-access-legal]
    paths:
      - scripts/stabilize-prestripe.mjs
      - .github/workflows/stabilize-prestripe.yml

permissions:
  contents: write

concurrency:
  group: stabilize-prestripe-product
  cancel-in-progress: false

jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stabilize/prestripe-full-access-legal
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply stabilization patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('scripts/stabilize-prestripe.mjs')
          text = path.read_text()
          generated_placeholders = [
              'origin',
              'attachment.mediaType',
              'model.label',
              'tier',
              'github.repository',
              'github.branch',
              'snapshot.connectors?.models?.length ?? 0',
              'item.label',
              'item.provider',
          ]
          for expression in generated_placeholders:
              pattern = rf'(?<!\\)\$\{{{re.escape(expression)}\}}'
              text = re.sub(pattern, lambda match: '\\' + match.group(0), text)
          path.write_text(text)
          PY
          node scripts/stabilize-prestripe.mjs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/chat/hosted.ts')
          text = path.read_text()
          text = text.replace('const identity = await auth.verifyToken(body.token);', 'await auth.verifyToken(body.token);')
          path.write_text(text)
          PY
      - name: Format changed code and generated legal surfaces
        run: npx biome check --write scripts/stabilize-prestripe.mjs src/chat/product.ts src/chat/neon-auth.ts src/chat/modes.ts src/chat/types.ts src/chat/engine.ts src/chat/agent.ts src/chat/neon-store.ts src/chat/hosted.ts src/bot/executor.ts web/login.js web/workspace.js web/chat.js web/bot.js web/chat.css web/bot.css web/login.html web/chat.html web/bot.html web/eula.html web/privacy.html web/cookies.html web/ai-act.html web/imprint.html web/gdpr.html
      - name: Verify full repository
        run: npm run verify
      - name: Commit verified product tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/chat/product.ts src/chat/neon-auth.ts src/chat/modes.ts src/chat/types.ts src/chat/engine.ts src/chat/agent.ts src/chat/neon-store.ts src/chat/hosted.ts src/bot/executor.ts web/login.html web/login.js web/workspace.js web/chat.html web/chat.js web/chat.css web/bot.html web/bot.js web/bot.css web/eula.html web/privacy.html web/cookies.html web/ai-act.html web/imprint.html web/gdpr.html
          git commit -m 'feat: open full pre-Stripe test lane and stabilize auth workspace legal UX'
          git push origin HEAD:stabilize/prestripe-full-access-legal
