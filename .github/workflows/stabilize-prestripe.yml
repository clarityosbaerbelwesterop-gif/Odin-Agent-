name: Stabilize pre-Stripe product

on:
  push:
    branches: [stabilize/prestripe-full-access-legal]
    paths:
      - scripts/stabilize-prestripe.mjs
      - test/chat/hosted.test.ts
      - test/chat/neon-auth.test.ts
      - test/chat/product.test.ts
      - .github/workflows/stabilize-prestripe.yml

permissions:
  contents: write

concurrency:
  group: stabilize-prestripe-product
  cancel-in-progress: false

jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stabilize/prestripe-full-access-legal
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply stabilization patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('scripts/stabilize-prestripe.mjs')
          text = path.read_text()
          generated_placeholders = [
              'origin',
              'attachment.mediaType',
              'model.label',
              'tier',
              'github.repository',
              'github.branch',
              'snapshot.connectors?.models?.length ?? 0',
              'item.label',
              'item.provider',
          ]
          for expression in generated_placeholders:
              pattern = rf'(?<!\\)\$\{{{re.escape(expression)}\}}'
              text = re.sub(pattern, lambda match: '\\' + match.group(0), text)
          path.write_text(text)
          PY
          node scripts/stabilize-prestripe.mjs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/chat/hosted.ts')
          text = path.read_text()
          text = text.replace('const identity = await auth.verifyToken(body.token);', 'await auth.verifyToken(body.token);')
          path.write_text(text)
          PY
      - name: Align UI compatibility and current product contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, label):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Missing anchor: {label}')
              file.write_text(text.replace(old, new, 1))

          replace(
              'web/chat.js',
              '        attachments: screenshotAttachment ? [screenshotAttachment] : [],',
              '        ...(screenshotAttachment ? { attachments: [screenshotAttachment] } : {}),',
              'optional screenshot payload',
          )
          replace(
              'web/login.js',
              '      "Erstelle deine Identity. Danach bestätigst du deine E-Mail.",',
              '      "Erstelle deine Identity und öffne danach direkt deinen Workspace.",',
              'signup copy',
          )

          old_signup = (
              '    if (mode === "signup") {\n'
              '      $("auth-password").value = "";\n'
              '      await clearIncompleteSession();\n'
              '      applyMode("verify");\n'
              '      try {\n'
              '        await request("/api/auth/sendCode", { email });\n'
              '        status("Konto erstellt. Der Bestätigungscode wurde per E-Mail gesendet.", "success");\n'
              '      } catch {\n'
              '        status(\n'
              '          "Konto erstellt. Der Code konnte nicht automatisch gesendet werden. Nutze „Code senden“.",\n'
              '          "error",\n'
              '        );\n'
              '      }\n'
              '    } else if (mode === "forgot") {'
          )
          new_signup = (
              '    if (mode === "signup") {\n'
              '      $("auth-password").value = "";\n'
              '      try {\n'
              '        await request("/api/config");\n'
              '        status("Konto erstellt. Workspace wird geöffnet …", "success");\n'
              '        window.location.replace(safeReturnTo());\n'
              '      } catch (error) {\n'
              '        if (error.status !== 401) throw error;\n'
              '        applyMode("login");\n'
              '        status("Konto erstellt. Du kannst dich jetzt anmelden.", "success");\n'
              '      }\n'
              '    } else if (mode === "forgot") {'
          )
          replace('web/login.js', old_signup, new_signup, 'signup without forced verification')

          login_test = Path('scripts/login.test.mjs')
          text = login_test.read_text()
          start = text.index('test("registration sends a verification code automatically and enters verification state"')
          end = text.index('\ntest("password recovery is an explicit state"', start)
          replacement = (
              'test("registration does not force email verification when the server accepts the account", async () => {\n'
              '  const client = await loginClient();\n'
              '  try {\n'
              '    client.get("switch-mode").click();\n'
              '    assert.equal(client.get("login-title").textContent, "Odin Account erstellen");\n'
              '    assert.equal(client.get("name-field").hidden, false);\n'
              '    assert.equal(client.get("name-field").style.display, "");\n'
              '    assert.equal(client.get("code-field").style.display, "none");\n'
              '    assert.equal(client.get("auth-password").minLength, 14);\n'
              '\n'
              '    client.get("auth-email").value = "person@example.com";\n'
              '    client.get("auth-name").value = "Person";\n'
              '    client.get("auth-password").value = "correct-password";\n'
              '    client\n'
              '      .get("auth-form")\n'
              '      .dispatchEvent(new client.window.Event("submit", { bubbles: true, cancelable: true }));\n'
              '    await new Promise((resolve) => setImmediate(resolve));\n'
              '    await new Promise((resolve) => setImmediate(resolve));\n'
              '\n'
              '    assert.ok(client.requests.find((item) => item.path === "/api/auth/signup"));\n'
              '    assert.equal(client.requests.find((item) => item.path === "/api/auth/logout"), undefined);\n'
              '    assert.equal(client.requests.find((item) => item.path === "/api/auth/sendCode"), undefined);\n'
              '    assert.equal(client.get("login-title").textContent, "Bei Odin anmelden");\n'
              '    assert.equal(client.get("code-field").hidden, true);\n'
              '    assert.equal(client.get("password-field").style.display, "");\n'
              '    assert.match(client.get("auth-status").textContent, /Konto erstellt/u);\n'
              '  } finally {\n'
              '    client.close();\n'
              '  }\n'
              '});\n'
          )
          login_test.write_text(text[:start] + replacement + text[end:])

          product_test = Path('scripts/product-info.test.mjs')
          text = product_test.read_text()
          old = (
              '  assert.match(pages[0], /PREVIEW-ENTWURF/u);\n'
              '  assert.match(pages[0], /\\[BETREIBERNAME/u);\n'
              '  assert.match(pages[1], /Verbindliche Preise werden ausschließlich im Stripe Checkout angezeigt/u);\n'
              '  assert.match(pages[2], /PARTIALLY VERIFIED/u);\n'
              '  assert.match(pages[3], /BLOCKED · BETREIBERANGABEN FEHLEN/u);'
          )
          new = (
              '  assert.match(pages[0], /TESTBETRIEB/u);\n'
              '  assert.match(pages[0], /\\[BETREIBERNAME/u);\n'
              '  assert.match(pages[0], /Launch-Gate/u);\n'
              '  assert.match(pages[1], /Pre-Stripe-Testbetrieb/u);\n'
              '  assert.match(pages[2], /PARTIALLY VERIFIED/u);\n'
              '  assert.match(pages[3], /BLOCKED · BETREIBERANGABEN FEHLEN/u);'
          )
          if old not in text:
              raise SystemExit('Missing anchor: legal product test')
          product_test.write_text(text.replace(old, new, 1))
          PY
      - name: Format changed code, tests, and legal surfaces
        run: npx biome check --write scripts/stabilize-prestripe.mjs src/chat/product.ts src/chat/neon-auth.ts src/chat/modes.ts src/chat/types.ts src/chat/engine.ts src/chat/agent.ts src/chat/neon-store.ts src/chat/hosted.ts src/bot/executor.ts test/chat/hosted.test.ts test/chat/neon-auth.test.ts test/chat/product.test.ts scripts/login.test.mjs scripts/product-info.test.mjs web/login.js web/workspace.js web/chat.js web/bot.js web/chat.css web/bot.css web/login.html web/chat.html web/bot.html web/eula.html web/privacy.html web/cookies.html web/ai-act.html web/imprint.html web/gdpr.html
      - name: Verify full repository
        run: npm run verify
      - name: Commit verified product tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/chat/product.ts src/chat/neon-auth.ts src/chat/modes.ts src/chat/types.ts src/chat/engine.ts src/chat/agent.ts src/chat/neon-store.ts src/chat/hosted.ts src/bot/executor.ts test/chat/hosted.test.ts test/chat/neon-auth.test.ts test/chat/product.test.ts scripts/login.test.mjs scripts/product-info.test.mjs web/login.html web/login.js web/workspace.js web/chat.html web/chat.js web/chat.css web/bot.html web/bot.js web/bot.css web/eula.html web/privacy.html web/cookies.html web/ai-act.html web/imprint.html web/gdpr.html
          git commit -m 'feat: open full pre-Stripe test lane and stabilize auth workspace legal UX'
          git push origin HEAD:stabilize/prestripe-full-access-legal
