name: PRODUCT M5 governance sync

on:
  push:
    branches:
      - agent/product-m5-skills-os-staging
    paths:
      - .github/workflows/staging-m5-governance-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/product-m5-skills-os-staging
      - name: Synchronize binding PRODUCT M5 governance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sections = {
              "ROADMAP.md": """## PRODUCT M5 — Skills OS (current delivery)\n\nStatus: **STAGING VERIFIED — PR #80 exact-head move/CI/merge pending**.\n\n- [x] Product Skills bind to real M10 package identity and content hashes.\n- [x] M23 performs deterministic task-class discovery, selection and progressive loading in real Hosted Runs.\n- [x] M25 remains the tool/permission authority; installing a Skill grants no filesystem, repository, network, credential, deployment, database, billing or approval authority.\n- [x] Global/project install, enable/disable, update, rollback and removal are actor/project scoped; project overrides and global fallback are deterministic.\n- [x] Run/Project isolation, exact version/hash resume pinning, canonical `cursor` event ordering and bounded server-originated `skill.selected`, `skill.loaded` and `skill.result` evidence are regression-tested.\n- [x] Custom Skill drafts remain inert candidates and reject secret-like content or authority escalation.\n- [x] Migration 014 is repository-verified with canonical Project FKs, ENABLE/FORCE RLS, PUBLIC revocation and limited `odin_runtime` grants. Production application is not claimed here.\n- [x] Migration 015 was applied only after a fresh live dependency/row-count proof on the canonical Odin Neon production branch; both empty legacy v003 tables were removed without `CASCADE` and canonical replacements remain present.\n- [x] Full staging `npm run verify` / CI #878 passed on pre-governance head `8053ae99dbb816d193e8fe3e5346dc73d5fcd2ad`.\n- [ ] Fresh exact-head CI after this governance synchronization.\n- [ ] Fast-forward PR #80 to the final staging head once, mark ready and merge only after exact-head required checks are green.\n\nPRODUCT M6 starts only from the merged PRODUCT M5 `main` head and composes existing Workspace, Memory, Runtime, Skills, Tool and Verification authorities rather than creating a second Build engine.\n""",
              "ARCHITECTURE.md": """## PRODUCT M5 — Skills OS product boundary\n\nPRODUCT M5 is a product/install/discovery projection over existing authorities, not a new Skill runtime. M10 owns package verification and lifecycle identity; M23 owns discovery, deterministic task-class selection and progressive loading; M25 owns tools, permissions and side effects. The real Hosted Run path is installed Product Skill → M10 package identity → M23 selection/load → exact version/content-hash binding → bounded verified procedure context → canonical Run execution → server-side Skill events. Installation state can be global or Project-scoped but never mints execution authority.\n\nProject/run ownership is checked through canonical actor-scoped `conversations` and `turns`. Resume restores only the same `skillId`/version/content hash; changed catalog/install revisions fail closed rather than silently substituting another Skill. Runtime evidence is server-originated and ordered by canonical event `cursor`; the browser cannot mint `skill.selected`, `skill.loaded` or `skill.result`. Migration 014 stores only installation/custom-draft product state with canonical Project FKs and FORCE RLS. Migration 015 removes only the proven-empty legacy v003 connection tables and intentionally uses no `CASCADE`.\n""",
              "HANDOVER.md": """## PRODUCT M5 checkpoint — Skills OS\n\nPRODUCT M5 staging is implementation-complete and passed the full canonical staging gate in CI #878 on `8053ae99dbb816d193e8fe3e5346dc73d5fcd2ad` before final governance synchronization. Preserve the existing M10 → M23 → Hosted Run path: do not create a second Skill runtime, client-side selector or prompt-only injection path. M25 remains permission authority. Global/project lifecycle, exact rollback, connection state, Run/Project isolation, version/hash resume pinning, cursor-ordered server Skill evidence, inert custom drafts and responsive Skills/Run Center UI have focused regressions.\n\nNeon production is `cold-mode-01560070`, branch `production` (`br-muddy-boat-b1po0mwo`), database `neondb`. Migration 015 was applied after confirming both targeted legacy tables had zero rows, zero FK/trigger/view/routine dependencies, canonical replacements existed and runtime code did not query them; no `CASCADE` was used. Migration 014 remains a versioned repository migration and production application must not be inferred merely from source verification. Before merge, require a fresh exact-head full CI after this governance sync, then fast-forward PR #80 once and merge only if required checks are green and the PR remains mergeable. PRODUCT M6 must branch from the resulting merged `main`.\n""",
              "SECURITY.md": """## PRODUCT M5 Skills OS security boundary\n\nProduct Skill installation changes availability only. M10 remains verification/lifecycle authority, M23 remains discovery/selection/loading authority, and M25 remains tool/permission authority. A Skill cannot grant filesystem/repository writes, network, credentials, deployment, database mutation, billing or approval bypass. Repository/document/retrieved/Skill text is untrusted procedure data and cannot override runtime policy. Custom Skill drafts are inert `CANDIDATE`/`DRAFT` records until the existing independent verification authority promotes them.\n\nActor-scoped Product state is isolated globally or by canonical Project. Run evidence additionally proves the Run belongs to the requested Project before Skill discovery or projection. Resume restores only exact `skillId`, version and content hash; mismatches fail closed. `skill.selected`, `skill.loaded`, `skill.connection_required`, `skill.verification_failed` and bounded `skill.result` rows originate server-side and use canonical event `cursor` ordering; the frontend is projection-only. Migration 014 preserves ENABLE/FORCE RLS, PUBLIC revocation, canonical `(owner_id, project_id)` foreign keys and limited `odin_runtime` grants. Migration 015 was applied only after fresh production proof of zero rows and zero dependencies for the two legacy v003 connection tables and deliberately contains no `CASCADE`.\n""",
          }

          for filename, section in sections.items():
              path = Path(filename)
              text = path.read_text()
              marker = section.splitlines()[0]
              if marker in text:
                  continue
              first_newline = text.find("\n")
              if first_newline < 0:
                  raise SystemExit(f"missing document heading in {filename}")
              updated = text[: first_newline + 1] + "\n" + section + "\n" + text[first_newline + 1 :]
              path.write_text(updated)
          PY
          git rm .github/workflows/staging-m5-governance-sync.yml
          git config user.name "Odin Product Staging"
          git config user.email "odin-staging@users.noreply.github.com"
          git add ROADMAP.md ARCHITECTURE.md HANDOVER.md SECURITY.md
          git diff --cached --check
          git commit -m "synchronize PRODUCT M5 governance docs"
          git push origin HEAD:agent/product-m5-skills-os-staging
