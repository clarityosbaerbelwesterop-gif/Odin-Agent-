name: PRODUCT M6 wire existing authorities

on:
  push:
    branches:
      - agent/product-m6-build-mode
    paths:
      - .github/workflows/staging-m6-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/product-m6-build-mode
      - name: Wire Build Mode
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected anchor missing in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Vercel API router: Build owns only /api/build; hosted remains canonical Run authority.
          replace_once(
              "api/index.mjs",
              'import { hostedHandler } from "../dist/src/chat/hosted.js";\n',
              'import { buildApiHandler } from "../dist/src/chat/build-api.js";\nimport { hostedHandler } from "../dist/src/chat/hosted.js";\n',
          )
          replace_once(
              "api/index.mjs",
              '  if (rewrittenPath === "workspace" || rewrittenPath.startsWith("workspace/"))\n',
              '  if (rewrittenPath === "build" || rewrittenPath.startsWith("build/"))\n    return buildApiHandler(req, res);\n  if (rewrittenPath === "workspace" || rewrittenPath.startsWith("workspace/"))\n',
          )

          # Hosted Run engine: greenfield Build Projects stay in M2 NeonWorkspace even if the
          # account also has a selected GitHub repository. Existing-app Build Projects keep GitHub.
          replace_once(
              "src/chat/hosted.ts",
              'import { readBenchmarks } from "./benchmarks.js";\n',
              'import { readBenchmarks } from "./benchmarks.js";\nimport { BuildProductStore, buildPreviewRevision } from "./build-mode.js";\n',
          )
          replace_once(
              "src/chat/hosted.ts",
              '    const botControl = new BotControlStore(db);\n',
              '    const botControl = new BotControlStore(db);\n    const buildProduct = new BuildProductStore(db, identity.id);\n',
          )
          replace_once(
              "src/chat/hosted.ts",
              '      signal?: AbortSignal,\n    ) => {\n      const githubReady = githubWorkspaceReady ? (githubToken as string) : undefined;\n',
              '      signal?: AbortSignal,\n      workspaceKind: "auto" | "internal" = "auto",\n    ) => {\n      const githubReady =\n        workspaceKind === "auto" && githubWorkspaceReady ? (githubToken as string) : undefined;\n',
          )
          replace_once(
              "src/chat/hosted.ts",
              '      await store.conversation(id);\n      const engine = createEngine(db, id);\n',
              '      await store.conversation(id);\n      const workspaceKind = await buildProduct.workspaceKind(id);\n      const engine = createEngine(db, id, undefined, workspaceKind);\n',
          )
          replace_once(
              "src/chat/hosted.ts",
              '        const workspace = new NeonWorkspace(db, id, async () => {});\n        const html = await workspace.preview(url.searchParams.get("file") ?? "index.html");\n',
              '        const workspace = new NeonWorkspace(db, id, async () => {});\n        const requestedRevision = url.searchParams.get("revision");\n        if (requestedRevision) {\n          const currentRevision = buildPreviewRevision(await workspace.files());\n          if (currentRevision !== requestedRevision)\n            throw new ChatError(\n              "STALE_PREVIEW",\n              "Build output changed; refresh Preview before continuing.",\n              409,\n            );\n        }\n        const html = await workspace.preview(url.searchParams.get("file") ?? "index.html");\n',
          )
          replace_once(
              "src/chat/hosted.ts",
              '      const found = await store.turn(id);\n      const engine = createEngine(db, found.conversationId);\n',
              '      const found = await store.turn(id);\n      const workspaceKind = await buildProduct.workspaceKind(found.conversationId);\n      const engine = createEngine(db, found.conversationId, undefined, workspaceKind);\n',
          )
          replace_once(
              "src/chat/hosted.ts",
              '          const worker = createEngine(workerDb, found.conversationId, controller.signal);\n',
              '          const worker = createEngine(\n            workerDb,\n            found.conversationId,\n            controller.signal,\n            workspaceKind,\n          );\n',
          )

          # Product surface loads as a projection; it submits Runs through the existing hosted API.
          replace_once(
              "web/chat.html",
              '  </body>\n',
              '    <script type="module" src="/build-mode.js"></script>\n  </body>\n',
          )

          package = json.loads(Path("package.json").read_text())
          ui = package["scripts"]["test:ui"]
          marker = "scripts/skills-ui.test.mjs"
          if "scripts/build-mode-ui.test.mjs" not in ui:
              if marker not in ui:
                  raise SystemExit("skills UI test anchor missing")
              ui = ui.replace(marker, f"{marker} scripts/build-mode-ui.test.mjs")
          package["scripts"]["test:ui"] = ui
          Path("package.json").write_text(json.dumps(package, indent=2) + "\n")
          PY
          git rm .github/workflows/staging-m6-wire.yml
          npx biome format --write src/chat/build-mode.ts src/chat/build-api.ts test/chat/product-m6-build-mode.test.ts test/chat/product-m6-acceptance.test.ts web/build-mode.js web/product-m6.css scripts/build-mode-ui.test.mjs api/index.mjs src/chat/hosted.ts package.json
          git config user.name "Odin Product M6"
          git config user.email "odin-m6@users.noreply.github.com"
          git add api/index.mjs src/chat/hosted.ts web/chat.html package.json src/chat/build-mode.ts src/chat/build-api.ts test/chat/product-m6-build-mode.test.ts test/chat/product-m6-acceptance.test.ts web/build-mode.js web/product-m6.css scripts/build-mode-ui.test.mjs
          git diff --cached --check
          git commit -m "integrate PRODUCT M6 with Workspace Runtime and Preview"
          git push origin HEAD:agent/product-m6-build-mode
