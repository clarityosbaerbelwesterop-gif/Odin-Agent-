name: M17-M19 governance sync once

on:
  push:
    branches:
      - agent/m17-m19-reliability-efficiency-multifile
    paths:
      - scripts/sync-m17-m19-docs-once.mjs
      - .github/workflows/sync-m17-m19-docs-once.yml

permissions:
  contents: write

jobs:
  sync-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/m17-m19-reliability-efficiency-multifile
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx biome check --write scripts/sync-m17-m19-docs-once.mjs
      - name: Synchronize governance documentation
        run: node scripts/sync-m17-m19-docs-once.mjs
      - name: Verify repository
        run: npm run verify
      - name: Build repository
        run: npm run build
      - name: Remove helper and commit synchronized docs
        run: |
          git rm -f scripts/sync-m17-m19-docs-once.mjs .github/workflows/sync-m17-m19-docs-once.yml
          git add ROADMAP.md ARCHITECTURE.md SECURITY.md HANDOVER.md docs/milestones/M17_M19_RELIABILITY_EFFICIENCY_MULTIFILE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(m17-m19): synchronize verified package evidence"
          git push origin HEAD:agent/m17-m19-reliability-efficiency-multifile
