name: Sync Odin Vercel runtime secrets

on:
  workflow_dispatch:
  push:
    branches: [agent/chathub-modes-evidence]
    paths:
      - .github/workflows/sync-vercel-runtime-secrets.yml
      - scripts/sync-vercel-runtime-secrets.mjs

permissions:
  contents: read

concurrency:
  group: odin-vercel-runtime-secret-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'clarityosbaerbelwesterop-gif/Odin-Agent-' && github.ref == 'refs/heads/agent/chathub-modes-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Sync provider credentials to the protected preview and redeploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_ODIN_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NV_API_KEY: ${{ secrets.NV_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node scripts/sync-vercel-runtime-secrets.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odin-vercel-runtime-secret-sync
          path: vercel-secret-sync-result.json
          if-no-files-found: warn
          retention-days: 14
