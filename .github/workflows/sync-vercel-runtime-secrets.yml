name: Verify Odin Neon production

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-vercel-runtime-secrets.yml
      - scripts/verify-neon-production.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: odin-neon-production-verify
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'clarityosbaerbelwesterop-gif/Odin-Agent-' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify exact merged source before inspecting production
        run: npm run verify
      - name: Verify Neon production Auth, roles, schema and RLS
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node scripts/verify-neon-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odin-neon-production-verify
          path: neon-production-verify-result.json
          if-no-files-found: warn
          retention-days: 14
